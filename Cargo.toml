[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Herepiggypiggypiggy/kopercad"

[workspace.dependencies]
# Every roadmap crate is registered here once, in alphabetical order, so a
# pull request that adds a crate never edits these lines (cargo ignores a
# path entry until some crate uses it). Add external crates below.
novo-ai = { path = "crates/novo-ai" }
novo-app = { path = "crates/novo-app" }
novo-cables = { path = "crates/novo-cables" }
novo-canvas = { path = "crates/novo-canvas" }
novo-cfd = { path = "crates/novo-cfd" }
novo-checks = { path = "crates/novo-checks" }
novo-cli = { path = "crates/novo-cli" }
novo-commissioning = { path = "crates/novo-commissioning" }
novo-core = { path = "crates/novo-core" }
novo-editor = { path = "crates/novo-editor" }
novo-interop = { path = "crates/novo-interop" }
novo-layout = { path = "crates/novo-layout" }
novo-numbering = { path = "crates/novo-numbering" }
novo-parts = { path = "crates/novo-parts" }
novo-pdf = { path = "crates/novo-pdf" }
novo-plc = { path = "crates/novo-plc" }
novo-py = { path = "crates/novo-py" }
novo-reports = { path = "crates/novo-reports" }
novo-revisions = { path = "crates/novo-revisions" }
novo-routing = { path = "crates/novo-routing" }
novo-safety = { path = "crates/novo-safety" }
novo-sim = { path = "crates/novo-sim" }
novo-storage = { path = "crates/novo-storage" }
novo-symbols = { path = "crates/novo-symbols" }
novo-terminals = { path = "crates/novo-terminals" }
novo-tests = { path = "crates/novo-tests" }
novo-theme = { path = "crates/novo-theme" }
novo-view3d = { path = "crates/novo-view3d" }
novo-learn = { path = "crates/novo-learn" }
novo-heatview = { path = "crates/novo-heatview" }
novo-thermal = { path = "crates/novo-thermal" }
novo-workflow = { path = "crates/novo-workflow" }
novo-xref = { path = "crates/novo-xref" }

bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
glam = { version = "0.30", features = ["bytemuck"] }
# Must match the wgpu version egui-wgpu uses.
wgpu = "30"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse every f64 exactly (the default parser can be 1 ULP off, so a
# saved and reopened number would change)
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
thiserror = "2"
egui-phosphor = "0.14"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tempfile = "3"
rust_xlsxwriter = { version = "0.99", default-features = false }
calamine = { version = "0.36", default-features = false }
# Known-folder lookup for Documents (SHGetKnownFolderPath on Windows), so
# redirected or OneDrive Documents folders resolve without our own unsafe.
dirs = "6"
# Reads the ZIP a maker portal serves a STEP file in (novo-parts).
zip = { version = "8", default-features = false, features = ["deflate"] }
# Reads BMEcat catalogs (novo-parts).
quick-xml = "0.41"
# HTTPS client for the optional Claude integration (novo-ai); rustls, no system TLS or admin rights.
ureq = "3"
# Hashes imported maker files for their source record (novo-parts).
sha2 = "0.11"
# Decodes punch item photos for the viewer (novo-app): PNG and JPEG only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
clap = { version = "4.6", features = ["derive"] }
# abi3: one wheel serves every CPython from 3.9 on.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pdf-writer = "0.15"
# Reads PDFs back in tests (novo-pdf, novo-app).
lopdf = { version = "0.45", default-features = false }
# PDF text outside WinAnsi: an embedded subset of the bundled Inter font.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
subsetter = "0.2"
# Compresses revision snapshots in project files (novo-storage).
flate2 = "1"
# Data-parallel kernels of the flow solver (novo-cfd).
rayon = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# The thermal solver is numeric code: unoptimised it is about 30 times slower,
# which makes its tests and the app's debug builds crawl.
[profile.dev.package.novo-thermal]
opt-level = 3

# The flow solver is numeric code too (see novo-thermal above).
[profile.dev.package.novo-cfd]
opt-level = 3
