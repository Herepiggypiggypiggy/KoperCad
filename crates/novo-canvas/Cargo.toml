[package]
name = "novo-canvas"
description = "GPU drawing canvas: pan, zoom, snap, hit testing, selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["egui"]
# egui widget and paint callback for embedding the canvas in eframe.
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
bytemuck = { workspace = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
glam = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
eframe = { workspace = true }
naga = { version = "*", features = ["wgsl-in"] }
pollster = "1"

[[example]]
name = "stress"
required-features = ["egui"]

[lints]
workspace = true
