[package]
name = "novo-canvas"
description = "GPU drawing canvas: pan, zoom, snap, hit testing, selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["egui", "model"]
# The wgpu renderer (`render`). Headless users (PDF export, novo-cli,
# novo-py) turn default features off and never link wgpu.
gpu = ["dep:wgpu"]
# egui widget and paint callback for embedding the canvas in eframe.
egui = ["gpu", "dep:egui", "dep:egui-wgpu"]
# Adapter that draws novo-core pages. The rest of the crate is model-agnostic.
model = ["dep:novo-core", "dep:novo-symbols"]

[dependencies]
bytemuck = { workspace = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
glam = { workspace = true }
novo-core = { workspace = true, optional = true }
novo-symbols = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
eframe = { workspace = true }
novo-core = { workspace = true }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"

[[test]]
name = "gpu"
required-features = ["gpu"]

[[example]]
name = "stress"
required-features = ["egui"]

[[example]]
name = "demo"
required-features = ["egui", "model"]

[lints]
workspace = true
