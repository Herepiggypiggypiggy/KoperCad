# EPLAN function and symbol meaning <-> KoperCAD symbol, written by hand for KoperCAD.
#
# Nothing here is copied from EPLAN's symbol library, macros or data: a row says
# "a device that an EPLAN user calls one of `names`, tags with one of `letters`
# and pins like this, is this KoperCAD symbol". Names are plain device words in
# English, Dutch and German; letters are the IEC 81346-2 class letters (the first
# one is the usual choice); pin designations follow EN 50005 / IEC 61666 and are
# the same on both sides, with `pins` naming an alias set for common variants.
# Symbols are listed pack-less (`contacts/no`) and resolve in the IEC or NFPA pack.
#
# Order matters: when several rows match equally well the earlier one wins, so
# the common device comes before its variants.

[pinset.poles]          # main-circuit pole notation L1/T1 ... on a 1..6 or 1..8 device
L1 = "1"
T1 = "2"
L2 = "3"
T2 = "4"
L3 = "5"
T3 = "6"
L4 = "7"
T4 = "8"

[pinset.poles_n]        # the same, with N as pole 4 on a 1..8 device
L1 = "1"
T1 = "2"
L2 = "3"
T2 = "4"
L3 = "5"
T3 = "6"
N = "7"
"N'" = "8"

[pinset.motor]
U = "U1"
V = "V1"
W = "W1"
"1U1" = "U1"
"1V1" = "V1"
"1W1" = "W1"
U2 = "U2"
V2 = "V2"
W2 = "W2"
PE2 = "PE"

[pinset.sensor3]        # three-wire proximity sensor, by terminal or by wire colour
"L+" = "1"
M = "3"
Q = "4"
BN = "1"
BU = "3"
BK = "4"
"-" = "3"
"+" = "1"

[pinset.diode]
"+" = "A"
"-" = "K"
ANODE = "A"
CATHODE = "K"
"1" = "A"
"2" = "K"

[pinset.lamp]
"1" = "X1"
"2" = "X2"
"+" = "X1"
"-" = "X2"
H1 = "X1"
H2 = "X2"

[pinset.coil]
"1" = "A1"
"2" = "A2"
"+" = "A1"
"-" = "A2"

[pinset.dc]
"L+" = "+"
M = "-"
"24V" = "+"
"0V" = "-"
"1" = "+"
"2" = "-"

[pinset.supply]
"+" = "L+"
"-" = "M"
"24V" = "L+"
"0V" = "M"

