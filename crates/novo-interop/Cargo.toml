[package]
name = "novo-interop"
description = "Import and export: DXF, EPLAN parts (WS-24)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
novo-core.workspace = true
# Only the model adapter, as novo-pdf: no egui widget.
novo-canvas = { path = "../novo-canvas", default-features = false, features = ["model"] }
novo-layout.workspace = true
novo-routing.workspace = true
novo-parts.workspace = true
# Scene builder only (`model`): headless users such as novo-cli and novo-py must not link wgpu.
novo-view3d = { path = "../novo-view3d", default-features = false, features = ["model"] }
glam.workspace = true
thiserror.workspace = true
# Polygon triangulation (port of Mapbox earcut), pure Rust.
earcutr = "0.5"
# Per-user cache folder.
dirs.workspace = true
# Pure-Rust Excel writer and reader: no Excel install, nothing to elevate.
rust_xlsxwriter.workspace = true
calamine.workspace = true

[dev-dependencies]
novo-tests = { path = "../novo-tests" }
tempfile.workspace = true

[lints]
workspace = true
