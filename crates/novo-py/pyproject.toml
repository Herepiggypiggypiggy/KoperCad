[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "novoelectric"
description = "Script NovoElectric projects from Python: open, edit and save .novo files headless"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
module-name = "novoelectric"
features = ["python"]
