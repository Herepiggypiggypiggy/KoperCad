[package]
name = "novo-cli"
description = "The `novo` command-line tool: project info, checks and batch export, read-only on project files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kopercad-cli"
path = "src/main.rs"

[dependencies]
novo-commissioning.workspace = true
novo-core.workspace = true
novo-interop.workspace = true
novo-parts.workspace = true
novo-storage.workspace = true
novo-py.workspace = true
novo-checks.workspace = true
novo-pdf.workspace = true
novo-layout.workspace = true
novo-plc.workspace = true
novo-reports.workspace = true
novo-revisions.workspace = true
novo-xref.workspace = true
# Symbol artwork for PDF export, without the egui widget or wgpu.
novo-editor = { path = "../novo-editor", default-features = false, features = ["art"] }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# By path with the `model` feature only (no GPU stack in the test build), which
# `workspace = true` cannot narrow.
novo-canvas = { path = "../novo-canvas", default-features = false, features = ["model"] }
tempfile.workspace = true
calamine.workspace = true

[lints]
workspace = true
