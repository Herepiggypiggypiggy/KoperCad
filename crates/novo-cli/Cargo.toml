[package]
name = "novo-cli"
description = "The `novo` command-line tool: project info, checks and batch export, read-only on project files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "novo"
path = "src/main.rs"

[dependencies]
novo-core.workspace = true
novo-storage.workspace = true
novo-py.workspace = true
novo-checks.workspace = true
novo-pdf.workspace = true
novo-reports.workspace = true
# Symbol artwork for PDF export (`art` lives behind the editor's egui feature).
novo-editor = { workspace = true, features = ["egui"] }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
calamine.workspace = true

[lints]
workspace = true
