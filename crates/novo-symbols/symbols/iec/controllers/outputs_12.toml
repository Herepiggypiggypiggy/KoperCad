format = 1
id = "iec/controllers/outputs_12"
name = "Controller outputs, 12 contacts on one common"
description = "Dry contacts of a radio receiver or pendant (12 outputs closing a common COM to each output pin). The virtual controller panel of the live view closes them; a generic block, not a vendor receiver."
standard = "IEC 60617"
category = "controllers"
function = "controller.outputs"
keywords = ["controller", "receiver", "radio", "pendant", "remote", "outputs", "dry contacts", "crane", "afstandsbediening", "ontvanger", "hangkast"]
