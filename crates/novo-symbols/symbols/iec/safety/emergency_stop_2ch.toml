format = 1
id = "iec/safety/emergency_stop_2ch"
name = "Emergency stop, 2 break contacts"
description = "Mushroom-head emergency stop with two latching break contacts 11-12 and 21-22 for a two-channel safety relay."
standard = "IEC 60617"
category = "safety"
function = "contact.nc.estop"
keywords = ["two channel", "2 channel", "noodstop 2 kanaals", "safety"]
aliases = ["estop2"]

connections = [
  { id = "11", at = [0, 0], dir = "up" },
  { id = "12", at = [0, 16], dir = "down" },
  { id = "21", at = [8, 0], dir = "up" },
  { id = "22", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-11.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 5], to = [3.5, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [4, 4] },
  { kind = "line", from = [8, 0], to = [8, 5] },
  { kind = "line", from = [8, 5], to = [11.5, 5] },
  { kind = "line", from = [8, 16], to = [8, 11] },
  { kind = "line", from = [8, 11], to = [12, 4] },
  { kind = "line", from = [9.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "polyline", points = [[-6.5, 6], [-8, 6], [-8, 10], [-6.5, 10]] },
  { kind = "arc", center = [-8, 8], r = 2, start = 90, end = 270 },
]

[behavior]
kind = "contact"
normally = "closed"
latching = true
poles = [["11", "12"], ["21", "22"]]
