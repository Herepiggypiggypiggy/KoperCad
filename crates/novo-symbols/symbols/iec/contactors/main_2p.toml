format = 1
id = "iec/contactors/main_2p"
name = "Contactor main contacts, 2-pole"
description = "2-pole main (power) contacts of a contactor, switched by the coil with the same tag."
standard = "IEC 60617"
category = "contactors"
function = "contact.main"
keywords = ["contactor", "main contact", "power", "2p"]
aliases = ["km2"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
  { id = "3", at = [8, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 3.5] },
  { kind = "arc", center = [0, 5], r = 1.5, start = 180, end = 360 },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [8, 0], to = [8, 3.5] },
  { kind = "arc", center = [8, 5], r = 1.5, start = 180, end = 360 },
  { kind = "line", from = [8, 16], to = [8, 11] },
  { kind = "line", from = [8, 11], to = [4, 4] },
  { kind = "line", from = [-1.714, 8], to = [6.286, 8], stroke = "dashed" },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["1", "2"], ["3", "4"]]
