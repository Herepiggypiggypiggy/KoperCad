format = 1
id = "iec/contactors/main_1p"
name = "Contactor main contacts, 1-pole"
description = "1-pole main (power) contacts of a contactor, switched by the coil with the same tag."
standard = "IEC 60617"
category = "contactors"
function = "contact.main"
keywords = ["contactor", "main contact", "power contactor", "main contacts", "power contacts", "power", "1p"]
aliases = ["km1"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 3.5] },
  { kind = "arc", center = [0, 5], r = 1.5, start = 180, end = 360 },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["1", "2"]]
