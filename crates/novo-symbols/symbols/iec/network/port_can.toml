format = 1
id = "iec/network/port_can"
name = "Fieldbus port CAN"
description = "CAN bus port with CH (CAN high), CL (CAN low) and CG (CAN ground or shield), for CANopen and J1939."
standard = "IEC 60617"
category = "network"
function = "network.port.fieldbus"
keywords = ["can", "canopen", "j1939", "fieldbus", "bus"]
aliases = ["can"]

connections = [
  { id = "CH", at = [0, 0], dir = "up" },
  { id = "CL", at = [8, 0], dir = "up" },
  { id = "CG", at = [16, 0], dir = "up" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "line", from = [16, 0], to = [16, 4] },
  { kind = "rect", at = [-4, 4], size = [28, 8] },
  { kind = "text", at = [10, 8], text = "CAN", size = 2.2 },
]

[behavior]
kind = "load"
type = "network_port"
