format = 1
id = "iec/sensors/float_no"
name = "Float switch, make contact"
description = "Level float switch with a normally open contact."
standard = "IEC 60617"
category = "sensors"
function = "contact.no.float"
keywords = ["float", "level", "sensor", "no"]

connections = [
  { id = "13", at = [0, 0], dir = "up" },
  { id = "14", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-14, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [-1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "line", from = [-8, 8], to = [-10, 10] },
  { kind = "circle", center = [-11, 11], r = 1.4 },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["13", "14"]]
