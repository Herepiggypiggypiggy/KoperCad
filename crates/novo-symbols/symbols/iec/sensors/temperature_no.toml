format = 1
id = "iec/sensors/temperature_no"
name = "Temperature switch, make contact"
description = "Thermostat or thermal switch with a normally open contact that closes when hot."
standard = "IEC 60617"
category = "sensors"
function = "contact.no.temperature"
keywords = ["temperature", "thermostat", "sensor", "no"]

connections = [
  { id = "13", at = [0, 0], dir = "up" },
  { id = "14", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-12, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [-1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "text", at = [-9.5, 8], text = "θ", size = 3 },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["13", "14"]]
