format = 1
id = "iec/sensors/pressure_no"
name = "Pressure switch, make contact"
description = "Pressure switch with a normally open contact."
standard = "IEC 60617"
category = "sensors"
function = "contact.no.pressure"
keywords = ["pressure", "sensor", "no"]

connections = [
  { id = "13", at = [0, 0], dir = "up" },
  { id = "14", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-12, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [-1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "text", at = [-9.5, 8], text = "p", size = 3 },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["13", "14"]]
