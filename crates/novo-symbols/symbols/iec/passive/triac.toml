format = 1
id = "iec/passive/triac"
name = "Triac"
description = "Triac: bidirectional thyristor for AC switching, triggered at the gate."
standard = "IEC 60617"
category = "passive"
function = "passive.triac"
keywords = ["triac", "ac switch", "semiconductor"]

connections = [
  { id = "A1", at = [0, 0], dir = "up" },
  { id = "A2", at = [0, 16], dir = "down" },
  { id = "G", at = [-8, 12], dir = "left" },
]

anchors = [
  { role = "tag", at = [4.5, 8], align = "left" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "polyline", points = [[-3, 6], [0, 6], [-1.5, 10]], closed = true },
  { kind = "polyline", points = [[0, 10], [3, 10], [1.5, 6]], closed = true },
  { kind = "line", from = [0, 10], to = [0, 16] },
  { kind = "line", from = [-8, 12], to = [-3, 12] },
  { kind = "line", from = [-3, 12], to = [-2, 10] },
]

[behavior]
kind = "passive"
type = "triac"
poles = [["A1", "A2"]]
