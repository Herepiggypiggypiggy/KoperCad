format = 1
id = "iec/passive/thyristor"
name = "Thyristor"
description = "Thyristor (SCR): conducts from anode to cathode once triggered at the gate."
standard = "IEC 60617"
category = "passive"
function = "passive.thyristor"
keywords = ["thyristor", "scr", "semiconductor"]

connections = [
  { id = "A", at = [0, 0], dir = "up" },
  { id = "K", at = [0, 16], dir = "down" },
  { id = "G", at = [-8, 12], dir = "left" },
]

anchors = [
  { role = "tag", at = [4, 8], align = "left" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "polyline", points = [[-2.5, 6], [2.5, 6], [0, 10]], closed = true },
  { kind = "line", from = [-2.5, 10], to = [2.5, 10] },
  { kind = "line", from = [0, 6], to = [0, 10] },
  { kind = "line", from = [0, 10], to = [0, 16] },
  { kind = "line", from = [-8, 12], to = [-3, 12] },
  { kind = "line", from = [-3, 12], to = [-1.5, 10] },
]

[behavior]
kind = "passive"
type = "thyristor"
poles = [["A", "K"]]
