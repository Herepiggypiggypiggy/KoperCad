format = 1
id = "iec/motors/motor_dc"
name = "DC motor"
description = "Direct-current motor with armature terminals A1 and A2."
standard = "IEC 60617"
category = "motors"
function = "motor.dc"
keywords = ["motor", "dc", "direct current", "m"]

connections = [
  { id = "A1", at = [0, 0], dir = "up" },
  { id = "A2", at = [8, 0], dir = "up" },
]

anchors = [
  { role = "tag", at = [-5, 16], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [0, 4], to = [0.8, 9.774] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "line", from = [8, 4], to = [7.2, 9.774] },
  { kind = "circle", center = [4, 16], r = 7 },
  { kind = "text", at = [4, 14.5], text = "M", size = 4 },
  { kind = "text", at = [4, 19], text = "=" },
]

[behavior]
kind = "motor"
phases = 0
poles = [["A1", "A2"]]
