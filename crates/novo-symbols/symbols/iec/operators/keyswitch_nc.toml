format = 1
id = "iec/operators/keyswitch_nc"
name = "Key switch, break contact"
description = "Key-operated selector switch with a normally closed contact."
standard = "IEC 60617"
category = "operators"
function = "contact.nc.key"
keywords = ["key switch", "key", "selector", "nc"]

connections = [
  { id = "11", at = [0, 0], dir = "up" },
  { id = "12", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-15.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 5], to = [3.5, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [4, 4] },
  { kind = "line", from = [1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "polyline", points = [[-6.8, 6], [-8, 6], [-8, 10], [-9.2, 10]] },
  { kind = "line", from = [-9.2, 8], to = [-11.5, 8] },
  { kind = "circle", center = [-12.7, 8], r = 1.2 },
  { kind = "line", from = [-10.5, 8], to = [-10.5, 9.2] },
]

[behavior]
kind = "contact"
normally = "closed"
latching = true
poles = [["11", "12"]]
