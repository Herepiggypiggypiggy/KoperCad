format = 1
id = "iec/protection/motor_protection_breaker_1p"
name = "Motor protection circuit breaker, 1-pole"
description = "1-pole motor protection circuit breaker (MPCB) with adjustable thermal and magnetic trip, for a single-phase motor or one leg of a larger starter."
standard = "IEC 60617"
category = "protection"
function = "protection.mpcb"
keywords = ["mpcb", "motor protection", "motor circuit breaker", "1p", "single phase"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-18.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [-1.2, 3.8], to = [1.2, 6.2] },
  { kind = "line", from = [-1.2, 6.2], to = [1.2, 3.8] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [-1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "polyline", points = [[-8, 8], [-8, 6], [-10, 6], [-10, 10], [-12, 10], [-12, 8]] },
  { kind = "text", at = [-14, 8], text = "I>", size = 2.2, align = "right" },
]

[behavior]
kind = "breaker"
trip = ["thermal", "magnetic"]
adjustable = true
poles = [["1", "2"]]
