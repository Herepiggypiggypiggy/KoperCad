  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [-1.2, 3.8], to = [1.2, 6.2] },
  { kind = "line", from = [-1.2, 6.2], to = [1.2, 3.8] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [8, 0], to = [8, 5] },
  { kind = "line", from = [6.8, 3.8], to = [9.2, 6.2] },
  { kind = "line", from = [6.8, 6.2], to = [9.2, 3.8] },
  { kind = "line", from = [8, 16], to = [8, 11] },
  { kind = "line", from = [8, 11], to = [4, 4] },
  { kind = "line", from = [16, 0], to = [16, 5] },
  { kind = "line", from = [14.8, 3.8], to = [17.2, 6.2] },
  { kind = "line", from = [14.8, 6.2], to = [17.2, 3.8] },
  { kind = "line", from = [16, 16], to = [16, 11] },
  { kind = "line", from = [16, 11], to = [12, 4] },
  { kind = "line", from = [-1.714, 8], to = [14.286, 8], stroke = "dashed" },
  { kind = "line", from = [-1.714, 8], to = [-8, 8], stroke = "dashed" },
