keywords = ["mcp", "magnetic only", "motor circuit protector", "short circuit"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
  { id = "3", at = [8, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
  { id = "5", at = [16, 0], dir = "up" },
  { id = "6", at = [16, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-13, 8], align = "right" },
]

