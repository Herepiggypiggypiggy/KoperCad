format = 1
id = "iec/protection/fuse_2p"
name = "Fuse, 2-pole"
description = "Two fuses of one fuse base or fuse holder sharing a device tag."
standard = "IEC 60617"
category = "protection"
function = "protection.fuse"
keywords = ["fuse", "2p", "fuse base"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
  { id = "3", at = [8, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-4, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "rect", at = [-1.5, 4], size = [3, 8] },
  { kind = "line", from = [0, 4], to = [0, 12] },
  { kind = "line", from = [0, 12], to = [0, 16] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "rect", at = [6.5, 4], size = [3, 8] },
  { kind = "line", from = [8, 4], to = [8, 12] },
  { kind = "line", from = [8, 12], to = [8, 16] },
]

[behavior]
kind = "fuse"
poles = [["1", "2"], ["3", "4"]]
