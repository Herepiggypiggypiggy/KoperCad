format = 1
id = "iec/plc/remote_io"
name = "Remote I/O node"
description = "Fieldbus head of a remote I/O station: 24 V supply L+, M and PE and two Ethernet ports P1 and P2 for the line topology. IEC pack block symbol (a manufacturer-neutral drawing, not a 60617 graphic)."
standard = "IEC 60617"
category = "plc"
function = "plc.remote_io"
keywords = ["remote io", "i/o node", "fieldbus head", "profinet", "decentral", "ip20"]
aliases = ["rio"]

connections = [
  { id = "L+", at = [0, 0], dir = "up" },
  { id = "M", at = [8, 0], dir = "up" },
  { id = "PE", at = [16, 0], dir = "up", role = "pe" },
  { id = "P1", at = [32, 12], dir = "right" },
  { id = "P2", at = [32, 20], dir = "right" },
]

anchors = [
  { role = "tag", at = [-6, 16], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "line", from = [16, 0], to = [16, 4] },
  { kind = "line", from = [28, 12], to = [32, 12] },
  { kind = "line", from = [28, 20], to = [32, 20] },
  { kind = "rect", at = [-4, 4], size = [32, 24] },
  { kind = "text", at = [12, 11], text = "REMOTE I/O", size = 3.0 },
  { kind = "text", at = [12, 22], text = "24 V DC", size = 1.8 },
]

[behavior]
kind = "load"
type = "plc_cpu"
poles = [["L+", "M"]]
