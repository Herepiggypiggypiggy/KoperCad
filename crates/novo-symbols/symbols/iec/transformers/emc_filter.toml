format = 1
id = "iec/transformers/emc_filter"
name = "EMC filter, 3-phase"
description = "Three-phase mains (EMC) filter in front of a drive."
standard = "IEC 60617"
category = "transformers"
function = "passive.filter"
keywords = ["emc filter", "line filter", "rfi", "mains filter"]

connections = [
  { id = "L1", at = [0, 0], dir = "up" },
  { id = "L2", at = [8, 0], dir = "up" },
  { id = "L3", at = [16, 0], dir = "up" },
  { id = "PE", at = [24, 0], dir = "up", role = "pe" },
  { id = "L1'", at = [0, 24], dir = "down" },
  { id = "L2'", at = [8, 24], dir = "down" },
  { id = "L3'", at = [16, 24], dir = "down" },
  { id = "PE'", at = [24, 24], dir = "down", role = "pe" },
]

anchors = [
  { role = "tag", at = [-6, 12], align = "right" },
]

bridges = [["L1", "L1'"], ["L2", "L2'"], ["L3", "L3'"], ["PE", "PE'"]]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "line", from = [16, 0], to = [16, 4] },
  { kind = "line", from = [24, 0], to = [24, 4] },
  { kind = "line", from = [0, 20], to = [0, 24] },
  { kind = "line", from = [8, 20], to = [8, 24] },
  { kind = "line", from = [16, 20], to = [16, 24] },
  { kind = "line", from = [24, 20], to = [24, 24] },
  { kind = "rect", at = [-4, 4], size = [32, 16] },
  { kind = "text", at = [12, 8.8], text = "~", size = 3 },
  { kind = "text", at = [12, 12.8], text = "~", size = 3 },
  { kind = "text", at = [7.2, 16.8], text = "~", size = 3 },
]

[behavior]
kind = "passive"
type = "filter"
