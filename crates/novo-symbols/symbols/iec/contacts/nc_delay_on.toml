category = "contacts"
function = "contact.nc.delay_on"
keywords = ["timer", "delay", "nc", "delay on"]

connections = [
  { id = "15", at = [0, 0], dir = "up" },
  { id = "16", at = [0, 16], dir = "down" },
]

