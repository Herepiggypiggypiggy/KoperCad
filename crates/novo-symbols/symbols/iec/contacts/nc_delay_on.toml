  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 5], to = [3.5, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [4, 4] },
  { kind = "line", from = [1.714, 7.2], to = [-2.286, 7.2] },
  { kind = "line", from = [1.714, 8.8], to = [-2.286, 8.8] },
  { kind = "arc", center = [-2.286, 8], r = 1.5, start = 90, end = 270 },
]

[behavior]
kind = "contact"
normally = "closed"
delay = "on"
poles = [["15", "16"]]
