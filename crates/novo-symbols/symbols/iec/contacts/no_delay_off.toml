  { kind = "line", from = [-1.714, 7.2], to = [-5.714, 7.2] },
  { kind = "line", from = [-1.714, 8.8], to = [-5.714, 8.8] },
  { kind = "arc", center = [-5.714, 8], r = 1.5, start = 90, end = 270 },
