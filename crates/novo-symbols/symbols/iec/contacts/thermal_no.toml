format = 1
id = "iec/contacts/thermal_no"
name = "Thermal overload contact, make"
description = "Auxiliary make contact of an overload relay (97-98); closes when the relay trips."
standard = "IEC 60617"
category = "contacts"
function = "contact.no.thermal"
keywords = ["overload", "thermal", "trip", "97", "98", "signal"]

connections = [
  { id = "97", at = [0, 0], dir = "up" },
  { id = "98", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-14, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "line", from = [-1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "polyline", points = [[-8, 8], [-8, 6], [-10, 6], [-10, 10], [-12, 10], [-12, 8]] },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["97", "98"]]
