format = 1
id = "iec/contacts/thermal_nc"
name = "Thermal overload contact, break"
description = "Auxiliary break contact of an overload relay (95-96); opens when the relay trips."
standard = "IEC 60617"
category = "contacts"
function = "contact.nc.thermal"
keywords = ["overload", "thermal", "trip", "95", "96"]

connections = [
  { id = "95", at = [0, 0], dir = "up" },
  { id = "96", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-14, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 5], to = [3.5, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [4, 4] },
  { kind = "line", from = [1.714, 8], to = [-8, 8], stroke = "dashed" },
  { kind = "polyline", points = [[-8, 8], [-8, 6], [-10, 6], [-10, 10], [-12, 10], [-12, 8]] },
]

[behavior]
kind = "contact"
normally = "closed"
poles = [["95", "96"]]
