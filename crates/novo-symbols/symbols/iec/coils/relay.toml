format = 1
id = "iec/coils/relay"
name = "Relay or contactor coil"
description = "Operating coil of a relay or contactor; its contacts carry the same device tag."
standard = "IEC 60617"
category = "coils"
function = "coil.relay"
keywords = ["coil", "relay", "contactor", "a1", "a2"]

connections = [
  { id = "A1", at = [0, 0], dir = "up" },
  { id = "A2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "rect", at = [-4, 5], size = [8, 6] },
  { kind = "line", from = [0, 11], to = [0, 16] },
]

[behavior]
kind = "coil"
poles = [["A1", "A2"]]
