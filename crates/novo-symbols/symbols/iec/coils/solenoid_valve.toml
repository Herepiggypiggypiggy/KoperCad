  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "rect", at = [-4, 5], size = [8, 6] },
  { kind = "line", from = [0, 11], to = [0, 16] },
  { kind = "line", from = [4, 8], to = [8, 8], stroke = "dashed" },
  { kind = "polyline", points = [[8, 6], [12, 10], [12, 6], [8, 10]], closed = true },
]

[behavior]
kind = "coil"
poles = [["A1", "A2"]]
