format = 1
id = "iec/terminals/terminal"
name = "Terminal"
description = "Terminal of a terminal strip; both sides are the same conductor."
standard = "IEC 60617"
category = "terminals"
function = "terminal"
keywords = ["terminal", "x", "clamp", "feed-through"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 8], dir = "down" },
]

anchors = [
  { role = "tag", at = [-3, 4], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 2.8] },
  { kind = "circle", center = [0, 4], r = 1.2 },
  { kind = "line", from = [0, 5.2], to = [0, 8] },
]

[behavior]
kind = "conductor"
poles = [["1", "2"]]
