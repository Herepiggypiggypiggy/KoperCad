format = 1
id = "nfpa/passive/photodiode"
name = "Photodiode"
description = "Photodiode, conducting in reverse when lit."
standard = "NFPA 79 / ANSI Y32.2"
category = "passive"
function = "passive.diode.photo"
keywords = ["photodiode", "light sensor", "diode", "nfpa", "ansi"]

connections = [
  { id = "A", at = [0, 0], dir = "up" },
  { id = "K", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-4, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "polyline", points = [[-2.5, 6], [2.5, 6], [0, 10]], closed = true },
  { kind = "line", from = [-2.5, 10], to = [2.5, 10] },
  { kind = "line", from = [0, 6], to = [0, 10] },
  { kind = "line", from = [5, 4.5], to = [2.5, 6.5] },
  { kind = "polyline", points = [[2.5, 6.5], [2.9, 5.3], [3.7, 6.1]], closed = true, fill = true },
  { kind = "line", from = [5, 6.5], to = [2.5, 8.5] },
  { kind = "polyline", points = [[2.5, 8.5], [2.9, 7.3], [3.7, 8.1]], closed = true, fill = true },
  { kind = "line", from = [0, 10], to = [0, 16] },
]

[behavior]
kind = "passive"
type = "diode"
poles = [["A", "K"]]
