  { id = "1.2", at = [8, 0], dir = "up" },
  { id = "2.1", at = [0, 32], dir = "down" },
  { id = "2.2", at = [8, 32], dir = "down" },
  { id = "PE", at = [16, 32], dir = "down", role = "pe" },
]

