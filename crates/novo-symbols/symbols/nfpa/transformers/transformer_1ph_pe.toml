  { kind = "line", from = [0, 0], to = [0, 9] },
  { kind = "line", from = [8, 0], to = [8, 9] },
  { kind = "circle", center = [4, 12], r = 5 },
  { kind = "circle", center = [4, 20], r = 5 },
  { kind = "line", from = [0, 23], to = [0, 32] },
  { kind = "line", from = [8, 23], to = [8, 32] },
  { kind = "polyline", points = [[16, 32], [16, 16], [7, 16]] },
]

