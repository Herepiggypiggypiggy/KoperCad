format = 1
id = "nfpa/coils/timer_off_delay"
name = "Timer coil, off-delay"
description = "Coil of an off-delay timer relay: its delayed contacts return after the set time once de-energised."
standard = "NFPA 79 / ANSI Y32.2"
category = "coils"
function = "coil.timer.off_delay"
keywords = ["timer", "off delay", "coil", "nfpa", "ansi"]
aliases = ["tof"]

connections = [
  { id = "A1", at = [0, 0], dir = "up" },
  { id = "A2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "circle", center = [0, 8], r = 4 },
  { kind = "line", from = [0, 12], to = [0, 16] },
  { kind = "text", at = [0, 8], text = "TOF", size = 2.2 },
]

[behavior]
kind = "coil"
poles = [["A1", "A2"]]
delay = "off"
