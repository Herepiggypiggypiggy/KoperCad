format = 1
id = "nfpa/contacts/nc_delay_off"
name = "Break contact, delayed on closing"
description = "Timer contact that closes again after the off-delay of its timer relay."
standard = "NFPA 79 / ANSI Y32.2"
category = "contacts"
function = "contact.nc.delay_off"
keywords = ["timer", "delay", "nc", "delay off", "nfpa", "ansi"]

connections = [
  { id = "15", at = [0, 0], dir = "up" },
  { id = "16", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-13.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [-3, 12], to = [3, 4] },
  { kind = "line", from = [-1, 8], to = [-8, 8] },
  { kind = "arc", center = [-10, 8], r = 2, start = -90, end = 90 },
]

[behavior]
kind = "contact"
normally = "closed"
delay = "off"
poles = [["15", "16"]]
