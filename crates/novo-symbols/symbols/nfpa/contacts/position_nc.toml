  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [-3, 12], to = [3, 4] },
  { kind = "line", from = [-1, 8], to = [-7, 8] },
  { kind = "circle", center = [-8.4, 8], r = 1.4 },
]

