format = 1
id = "nfpa/operators/pushbutton_mushroom_nc"
name = "Mushroom push button, break contact"
description = "Push button with a mushroom head (palm button), not latching, not an emergency stop."
standard = "NFPA 79 / ANSI Y32.2"
category = "operators"
function = "contact.nc.push"
keywords = ["mushroom", "palm", "push button", "break", "pb", "nfpa", "ansi"]
aliases = ["pbmnc"]

connections = [
  { id = "11", at = [0, 0], dir = "up" },
  { id = "12", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-13, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [-3, 12], to = [3, 4] },
  { kind = "line", from = [-1, 8], to = [-8, 8] },
  { kind = "arc", center = [-8, 8], r = 3.5, start = 90, end = 270 },
  { kind = "line", from = [-8, 4.5], to = [-8, 11.5] },
]

[behavior]
kind = "contact"
normally = "closed"
poles = [["11", "12"]]
