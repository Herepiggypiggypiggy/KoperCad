format = 1
id = "nfpa/operators/keyswitch_nc"
name = "Key switch, break contact"
description = "Key-operated selector switch with a normally closed contact."
standard = "NFPA 79 / ANSI Y32.2"
category = "operators"
function = "contact.nc.key"
keywords = ["key switch", "key", "selector", "nc", "nfpa", "ansi"]

connections = [
  { id = "11", at = [0, 0], dir = "up" },
  { id = "12", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-15.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [-3, 12], to = [3, 4] },
  { kind = "line", from = [-1, 8], to = [-7, 8] },
  { kind = "circle", center = [-9, 8], r = 2 },
  { kind = "polyline", points = [[-11, 8], [-13.5, 8], [-13.5, 9.5]] },
]

[behavior]
kind = "contact"
normally = "closed"
latching = true
poles = [["11", "12"]]
