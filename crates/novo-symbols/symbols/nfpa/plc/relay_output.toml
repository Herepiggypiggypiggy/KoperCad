format = 1
id = "nfpa/plc/relay_output"
name = "PLC relay output"
description = "One relay output channel of a PLC card: a potential-free make contact."
standard = "NFPA 79 / ANSI Y32.2"
category = "plc"
function = "plc.output.relay"
keywords = ["plc", "relay output", "ro", "do", "contact", "uitgang", "i/o", "nfpa", "ansi"]
aliases = ["ro"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-8, 8], align = "right" },
  { role = "address", at = [6, 8], align = "left" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 5] },
  { kind = "line", from = [0, 16], to = [0, 11] },
  { kind = "line", from = [0, 11], to = [-4, 4] },
  { kind = "rect", at = [-6, 2], size = [10, 12] },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["1", "2"]]
