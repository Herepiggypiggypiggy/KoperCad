  { kind = "line", from = [0, 4.2], to = [0, 6] },
  { kind = "line", from = [0, 10], to = [-2.5, 6.5] },
  { kind = "line", from = [0, 10], to = [0, 11.8] },
  { kind = "circle", center = [0, 13], r = 1.2 },
  { kind = "line", from = [0, 14.2], to = [0, 16] },
]

