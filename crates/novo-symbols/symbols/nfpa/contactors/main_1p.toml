format = 1
id = "nfpa/contactors/main_1p"
name = "Contactor main contacts, 1-pole"
description = "1-pole main (power) contacts of a contactor, switched by the coil with the same tag."
standard = "NFPA 79 / ANSI Y32.2"
category = "contactors"
function = "contact.main"
keywords = ["contactor", "main contact", "power", "1p", "nfpa", "ansi"]
aliases = ["km1"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["1", "2"]]
