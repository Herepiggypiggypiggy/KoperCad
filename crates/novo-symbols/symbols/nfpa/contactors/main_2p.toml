format = 1
id = "nfpa/contactors/main_2p"
name = "Contactor main contacts, 2-pole"
description = "2-pole main (power) contacts of a contactor, switched by the coil with the same tag."
standard = "NFPA 79 / ANSI Y32.2"
category = "contactors"
function = "contact.main"
keywords = ["contactor", "main contact", "power", "2p", "nfpa", "ansi"]
aliases = ["km2"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
  { id = "3", at = [8, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [8, 0], to = [8, 6] },
  { kind = "line", from = [8, 16], to = [8, 10] },
  { kind = "line", from = [5, 6], to = [11, 6] },
  { kind = "line", from = [5, 10], to = [11, 10] },
  { kind = "line", from = [0, 8], to = [8, 8], stroke = "dashed" },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["1", "2"], ["3", "4"]]
