format = 1
id = "nfpa/sensors/pressure_nc"
name = "Pressure switch, break contact"
description = "Pressure switch with a normally closed contact."
standard = "NFPA 79 / ANSI Y32.2"
category = "sensors"
function = "contact.nc.pressure"
keywords = ["pressure", "sensor", "nc", "nfpa", "ansi"]

connections = [
  { id = "21", at = [0, 0], dir = "up" },
  { id = "22", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-12, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [-3, 12], to = [3, 4] },
  { kind = "line", from = [-1, 8], to = [-7, 8] },
  { kind = "text", at = [-9, 8], text = "P", size = 3 },
]

[behavior]
kind = "contact"
normally = "closed"
poles = [["21", "22"]]
