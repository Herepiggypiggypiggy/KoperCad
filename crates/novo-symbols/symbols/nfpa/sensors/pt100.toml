format = 1
id = "nfpa/sensors/pt100"
name = "Resistance temperature sensor"
description = "Resistance temperature detector such as a Pt100 or Pt1000."
standard = "NFPA 79 / ANSI Y32.2"
category = "sensors"
function = "sensor.temperature.rtd"
keywords = ["pt100", "pt1000", "rtd", "temperature", "sensor", "nfpa", "ansi"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-4.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "rect", at = [-1.5, 4], size = [3, 8] },
  { kind = "line", from = [-3, 11], to = [3, 5] },
  { kind = "text", at = [4, 10], text = "θ", align = "left" },
  { kind = "line", from = [0, 12], to = [0, 16] },
]

[behavior]
kind = "passive"
type = "resistor"
poles = [["1", "2"]]
