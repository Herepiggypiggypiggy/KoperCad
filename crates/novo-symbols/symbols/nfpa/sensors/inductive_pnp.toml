format = 1
id = "nfpa/sensors/inductive_pnp"
name = "Inductive sensor, 3-wire PNP"
description = "Three-wire inductive sensor with a PNP switching output: 1 brown (+), 3 blue (-), 4 black (signal)."
standard = "NFPA 79 / ANSI Y32.2"
category = "sensors"
function = "sensor.inductive"
keywords = ["inductive", "sensor", "3-wire", "pnp", "proximity", "nfpa", "ansi"]
aliases = ["ind"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "3", at = [16, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [16, 0], to = [16, 4] },
  { kind = "line", from = [8, 12], to = [8, 16] },
  { kind = "rect", at = [-4, 4], size = [24, 8] },
  { kind = "polyline", points = [[2, 5.5], [5, 8], [2, 10.5], [-1, 8]], closed = true },
  { kind = "text", at = [13, 8], text = "PNP", size = 2.4 },
]

[behavior]
kind = "load"
type = "sensor"
poles = [["1", "3"]]
