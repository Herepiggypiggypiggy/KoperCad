format = 1
id = "nfpa/sensors/encoder"
name = "Encoder"
description = "Incremental encoder with supply (+, 0V) and channels A, B and zero pulse Z."
standard = "NFPA 79 / ANSI Y32.2"
category = "sensors"
function = "sensor.encoder"
keywords = ["encoder", "incremental", "rotary", "sensor", "speed", "nfpa", "ansi"]
aliases = ["enc"]

connections = [
  { id = "+", at = [0, 0], dir = "up" },
  { id = "0V", at = [8, 0], dir = "up" },
  { id = "A", at = [16, 0], dir = "up" },
  { id = "B", at = [24, 0], dir = "up" },
  { id = "Z", at = [32, 0], dir = "up" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "line", from = [16, 0], to = [16, 4] },
  { kind = "line", from = [24, 0], to = [24, 4] },
  { kind = "line", from = [32, 0], to = [32, 4] },
  { kind = "rect", at = [-4, 4], size = [40, 10] },
  { kind = "text", at = [16, 9], text = "ENC", size = 3 },
]

[behavior]
kind = "load"
type = "encoder"
poles = [["+", "0V"]]
