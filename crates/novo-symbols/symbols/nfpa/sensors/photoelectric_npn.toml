format = 1
id = "nfpa/sensors/photoelectric_npn"
name = "Photoelectric sensor, 3-wire NPN"
description = "Three-wire photoelectric sensor with a NPN switching output: 1 brown (+), 3 blue (-), 4 black (signal)."
standard = "NFPA 79 / ANSI Y32.2"
category = "sensors"
function = "sensor.photoelectric"
keywords = ["photoelectric", "sensor", "3-wire", "npn", "proximity", "nfpa", "ansi"]
aliases = ["photon"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "3", at = [16, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-6, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "line", from = [16, 0], to = [16, 4] },
  { kind = "line", from = [8, 12], to = [8, 16] },
  { kind = "rect", at = [-4, 4], size = [24, 8] },
  { kind = "line", from = [-1.5, 10], to = [3, 5.5] },
  { kind = "line", from = [0.5, 10.5], to = [4.5, 6.5] },
  { kind = "polyline", points = [[3, 5.5], [1.3, 5.9], [2.6, 7.2]], closed = true, fill = true },
  { kind = "polyline", points = [[4.5, 6.5], [2.8, 6.9], [4.1, 8.2]], closed = true, fill = true },
  { kind = "text", at = [13, 8], text = "NPN", size = 2.4 },
]

[behavior]
kind = "load"
type = "sensor"
poles = [["1", "3"]]
