format = 1
id = "nfpa/sensors/proximity_no"
name = "Proximity switch, make contact"
description = "Inductive or capacitive proximity sensor with a normally open switching output."
standard = "NFPA 79 / ANSI Y32.2"
category = "sensors"
function = "contact.no.proximity"
keywords = ["proximity", "sensor", "inductive", "no", "nfpa", "ansi"]

connections = [
  { id = "13", at = [0, 0], dir = "up" },
  { id = "14", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-16, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 6] },
  { kind = "line", from = [0, 16], to = [0, 10] },
  { kind = "line", from = [-3, 6], to = [3, 6] },
  { kind = "line", from = [-3, 10], to = [3, 10] },
  { kind = "line", from = [-1, 8], to = [-5, 8] },
  { kind = "polyline", points = [[-5, 8], [-7.5, 5.5], [-10, 8], [-7.5, 10.5]], closed = true },
]

[behavior]
kind = "contact"
normally = "open"
poles = [["13", "14"]]
