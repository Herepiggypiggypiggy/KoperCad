format = 1
id = "nfpa/protection/fuse_2p"
name = "Fuse, 2-pole"
description = "Two fuses of one fuse base or fuse holder sharing a device tag."
standard = "NFPA 79 / ANSI Y32.2"
category = "protection"
function = "protection.fuse"
keywords = ["fuse", "2p", "fuse base", "nfpa", "ansi"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
  { id = "3", at = [8, 0], dir = "up" },
  { id = "4", at = [8, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-4, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "arc", center = [0, 6], r = 2, start = 270, end = 450 },
  { kind = "arc", center = [0, 10], r = 2, start = 90, end = 270 },
  { kind = "line", from = [0, 12], to = [0, 16] },
  { kind = "line", from = [8, 0], to = [8, 4] },
  { kind = "arc", center = [8, 6], r = 2, start = 270, end = 450 },
  { kind = "arc", center = [8, 10], r = 2, start = 90, end = 270 },
  { kind = "line", from = [8, 12], to = [8, 16] },
]

[behavior]
kind = "fuse"
poles = [["1", "2"], ["3", "4"]]
