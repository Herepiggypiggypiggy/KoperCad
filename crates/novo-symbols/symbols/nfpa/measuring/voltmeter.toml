format = 1
id = "nfpa/measuring/voltmeter"
name = "Voltmeter"
description = "Voltage-measuring instrument."
standard = "NFPA 79 / ANSI Y32.2"
category = "measuring"
function = "meter.voltage"
keywords = ["voltmeter", "voltage", "meter", "measurement", "nfpa", "ansi"]

connections = [
  { id = "1", at = [0, 0], dir = "up" },
  { id = "2", at = [0, 16], dir = "down" },
]

anchors = [
  { role = "tag", at = [-5.5, 8], align = "right" },
]

graphics = [
  { kind = "line", from = [0, 0], to = [0, 4] },
  { kind = "circle", center = [0, 8], r = 4 },
  { kind = "text", at = [0, 8], text = "V", size = 3.5 },
  { kind = "line", from = [0, 12], to = [0, 16] },
]

[behavior]
kind = "meter"
quantity = "voltage"
poles = [["1", "2"]]
