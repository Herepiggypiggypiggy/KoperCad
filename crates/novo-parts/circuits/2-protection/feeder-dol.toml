# Direct-on-line motor feeder: motor protection breaker, contactor, motor.
name = "Motor feeder DOL"
chapter = "protection"
description = "Motor feeder with a motor protection breaker and a contactor, coil left open for your control"
tags = ["motor", "feeder", "dol", "contactor", "breaker", "mpcb"]
notes = """The feeder is the power part only: the contactor coil is left open so any control (button, PLC output, radio) can drive it. \
You connect: L1 L2 L3 above Q1, PE above the PE terminal, the coil's two ends."""

parameter = [
  { name = "power", default = 2.2, description = "Motor power in kW" },
]

open = ["q1s.1,3,5", "pe1.1", "k1c.A1,A2"]

device = [
  { id = "q1", tag = "-Q1", description = "Motor protection breaker", mount = { kind = "din", size = [45, 90, 78], at = [15, 55], rail = "r1" } },
  { id = "k1", tag = "-K1", description = "Motor contactor", mount = { kind = "din", size = [45, 77, 86], at = [65, 61.5], rail = "r1" } },
  { id = "m1", tag = "-M1", description = "Motor {power} kW", props = { power_kw = "{power}" }, mount = { kind = "field", place = "on the machine" } },
]

symbol = [
  { id = "q1s", key = "iec/protection/motor_protection_breaker", at = [40, 40], device = "q1" },
  { id = "k1m", key = "iec/contactors/main_3p", at = [40, 72], device = "k1", main = false },
  { id = "m1s", key = "iec/motors/motor_3ph", at = [40, 108], device = "m1" },
  { id = "pe1", key = "iec/terminals/terminal_pe", at = [64, 88] },
  { id = "k1c", key = "iec/coils/contactor", at = [96, 72], device = "k1", main = true },
]

chain = [
  { path = "q1s.2,4,6 > k1m.1,3,5" },
  { path = "k1m.2,4,6 > m1s.U1,V1,W1" },
  { path = "pe1.2 > m1s.PE" },
]

[plate]
width = 140
height = 160

[[rail]]
id = "r1"
x = 5
y = 100
length = 130
