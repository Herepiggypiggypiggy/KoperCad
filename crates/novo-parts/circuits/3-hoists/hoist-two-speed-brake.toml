# Two-speed pole-change hoist: up/down contactors, a slow and a fast speed
# contactor, a brake released through a rectifier, motor thermal contact and
# end limits. Written for KoperCAD from general crane practice.
name = "Hoist two-speed with rectifier brake"
chapter = "hoists"
description = "Two-speed pole-change hoist with up and down contactors, slow and fast speed contactors, a spring brake released through a rectifier, motor thermal contact and end limits"
tags = ["hoist", "crane", "two-speed", "pole-change", "brake", "rectifier", "limit", "contactor", "lift"]
notes = """Step 1 (slow) closes S1 or S3, step 2 (fast) closes S2 or S4 as well. Step 2 also opens the break contacts of S2 and S4 in the slow rung, so K3 drops before K4 pulls in; K3 and K4 lock each other, K1 and K2 lock each other. \
The brake is released through V1 while a direction contactor feeds the motor, and falls when it drops; switch the DC side as well for a quicker brake. \
B2 and B3 are the end limits, B4 takes the hoist off fast speed before the upper end. \
You connect: L1 L2 L3 above Q1, PE above the PE terminal, the control supply above F1 and its return (0 V) above the N terminal."""

parameter = [
  { name = "power_fast", default = 5.5, description = "Motor power at fast speed in kW" },
  { name = "power_slow", default = 1.4, description = "Motor power at slow speed in kW" },
]

open = ["q1s.1,3,5", "pe1.1", "f1s.1", "n1.1"]

device = [
  { id = "q1", tag = "-Q1", description = "Hoist motor protection breaker", mount = { kind = "din", size = [45, 90, 78], at = [15, 55], rail = "r1" } },
  { id = "k1", tag = "-K1", description = "Hoist up contactor", mount = { kind = "din", size = [45, 77, 86], at = [65, 61.5], rail = "r1" } },
  { id = "k2", tag = "-K2", description = "Hoist down contactor", mount = { kind = "din", size = [45, 77, 86], at = [115, 61.5], rail = "r1" } },
  { id = "k3", tag = "-K3", description = "Slow speed contactor", mount = { kind = "din", size = [45, 77, 86], at = [165, 61.5], rail = "r1" } },
  { id = "k4", tag = "-K4", description = "Fast speed contactor", mount = { kind = "din", size = [45, 77, 86], at = [215, 61.5], rail = "r1" } },
  { id = "f1", tag = "-F1", description = "Control circuit breaker", mount = { kind = "din", size = [18, 90, 70], at = [15, 145], rail = "r2" } },
  { id = "m1", tag = "-M1", description = "Hoist motor {power_fast} / {power_slow} kW, two speeds", props = { power_kw = "{power_fast}" }, mount = { kind = "field", place = "on the hoist" } },
  { id = "v1", tag = "-V1", description = "Brake rectifier", mount = { kind = "field", place = "in the motor terminal box", note = "Mount it on the rail next to the contactors when the motor has no room for it" } },
  { id = "y1", tag = "-Y1", description = "Hoist brake, spring applied", mount = { kind = "field", place = "on the motor" } },
  { id = "b1", tag = "-B1", description = "Motor thermal contact", mount = { kind = "field", place = "in the motor winding" } },
  { id = "b2", tag = "-B2", description = "Upper end limit", mount = { kind = "field", place = "at the top of the hoist travel" } },
  { id = "b3", tag = "-B3", description = "Lower end limit", mount = { kind = "field", place = "at the bottom of the hoist travel" } },
  { id = "b4", tag = "-B4", description = "Upper slow-down limit", mount = { kind = "field", place = "just below the upper end limit" } },
  { id = "s1", tag = "-S1", description = "Up, step 1 (slow)", mount = { kind = "field", place = "operator station" } },
  { id = "s2", tag = "-S2", description = "Up, step 2 (fast)", mount = { kind = "field", place = "operator station" } },
  { id = "s3", tag = "-S3", description = "Down, step 1 (slow)", mount = { kind = "field", place = "operator station" } },
  { id = "s4", tag = "-S4", description = "Down, step 2 (fast)", mount = { kind = "field", place = "operator station" } },
]

symbol = [
  # Power: breaker, reversing pair, speed contactors, motor
  { id = "q1s", key = "iec/protection/motor_protection_breaker", at = [40, 40], device = "q1" },
  { id = "k1m", key = "iec/contactors/main_3p", at = [40, 72], device = "k1", main = false },
  { id = "k2m", key = "iec/contactors/main_3p", at = [72, 72], device = "k2", main = false },
  { id = "k3m", key = "iec/contactors/main_3p", at = [104, 112], device = "k3", main = false },
  { id = "k4m", key = "iec/contactors/main_3p", at = [136, 112], device = "k4", main = false },
  { id = "m1s", key = "iec/motors/motor_3ph_dahlander", at = [104, 150], device = "m1" },
  { id = "pe1", key = "iec/terminals/terminal_pe", at = [128, 132] },
  # Brake
  { id = "v1s", key = "iec/passive/bridge_rectifier", at = [176, 116], device = "v1" },
  { id = "y1s", key = "iec/coils/brake", at = [176, 164], device = "y1" },
  # Control supply, thermal contact, 0 V entry
  { id = "f1s", key = "iec/protection/mcb_1p", at = [216, 40], device = "f1" },
  { id = "b1s", key = "iec/sensors/temperature_nc", at = [216, 64], device = "b1" },
  { id = "n1", key = "iec/terminals/terminal_n", at = [216, 208] },
  # Up rung: S1, upper end limit, K2 interlock, K1 coil
  { id = "s1s", key = "iec/operators/pushbutton_no", at = [240, 104], device = "s1" },
  { id = "b2s", key = "iec/contacts/position_nc", at = [240, 128], device = "b2" },
  { id = "k2i", key = "iec/contacts/nc", at = [240, 152], device = "k2", main = false },
  { id = "k1c", key = "iec/coils/contactor", at = [240, 176], device = "k1", main = true },
  # Down rung
  { id = "s3s", key = "iec/operators/pushbutton_no", at = [264, 104], device = "s3" },
  { id = "b3s", key = "iec/contacts/position_nc", at = [264, 128], device = "b3" },
  { id = "k1i", key = "iec/contacts/nc", at = [264, 152], device = "k1", main = false },
  { id = "k2c", key = "iec/coils/contactor", at = [264, 176], device = "k2", main = true },
  # Slow rung: either direction contactor in, K4 lock, K3 coil
  { id = "k1a", key = "iec/contacts/no", at = [288, 104], device = "k1", main = false },
  { id = "k2a", key = "iec/contacts/no", at = [304, 104], device = "k2", main = false },
  { id = "k4i", key = "iec/contacts/nc", at = [288, 192], device = "k4", main = false },
  { id = "k3c", key = "iec/coils/contactor", at = [288, 216], device = "k3", main = true },
  # Fast rung: S2 with the slow-down limit, or S4; K3 lock, K4 coil
  { id = "s2s", key = "iec/operators/pushbutton_no", at = [336, 104], device = "s2" },
  { id = "b4s", key = "iec/contacts/position_nc", at = [336, 128], device = "b4" },
  { id = "s4s", key = "iec/operators/pushbutton_no", at = [352, 104], device = "s4" },
  { id = "s2b", key = "iec/operators/pushbutton_nc", at = [288, 144], device = "s2", main = false },
  { id = "s4b", key = "iec/operators/pushbutton_nc", at = [288, 168], device = "s4", main = false },
  { id = "k3i", key = "iec/contacts/nc", at = [336, 168], device = "k3", main = false },
  { id = "k4c", key = "iec/coils/contactor", at = [336, 192], device = "k4", main = true },
]

junction = [
  # Breaker output fans to the up contactor straight and to the down contactor swapped
  { id = "u0", at = [40, 68] }, { id = "u1", at = [48, 64] }, { id = "u2", at = [56, 60] },
  # Motor phase rails U, V, W (rows 100, 104, 108): up, down, slow, fast, rectifier
  { id = "a0", at = [40, 100] }, { id = "b0", at = [72, 100] }, { id = "c0", at = [104, 100] }, { id = "d0", at = [136, 100] }, { id = "e0", at = [176, 100] },
  { id = "a1", at = [48, 104] }, { id = "b1", at = [80, 104] }, { id = "c1", at = [112, 104] }, { id = "d1", at = [144, 104] }, { id = "e1", at = [184, 104] },
  { id = "a2", at = [56, 108] }, { id = "b2", at = [88, 108] }, { id = "c2", at = [120, 108] }, { id = "d2", at = [152, 108] },
  # Merge of the two parallel contacts in the slow and fast rungs
  { id = "jc0", at = [288, 136] }, { id = "jc1", at = [304, 136] },
  { id = "jd0", at = [336, 160] }, { id = "jd1", at = [352, 160] },
]

wire = [
  { from = "q1s.2", to = "u0" }, { from = "q1s.4", to = "u1" }, { from = "q1s.6", to = "u2" },
  { from = "u0", to = "k1m.1" }, { from = "u1", to = "k1m.3" }, { from = "u2", to = "k1m.5" },
  { from = "u0", to = "k2m.5" }, { from = "u1", to = "k2m.3" }, { from = "u2", to = "k2m.1" },
  # Phase rails
  { from = "k1m.2", to = "a0" }, { from = "k1m.4", to = "a1" }, { from = "k1m.6", to = "a2" },
  { from = "k2m.2", to = "b0" }, { from = "k2m.4", to = "b1" }, { from = "k2m.6", to = "b2" },
  { from = "a0", to = "b0" }, { from = "b0", to = "c0" }, { from = "c0", to = "d0" }, { from = "d0", to = "e0" },
  { from = "a1", to = "b1" }, { from = "b1", to = "c1" }, { from = "c1", to = "d1" }, { from = "d1", to = "e1" },
  { from = "a2", to = "b2" }, { from = "b2", to = "c2" }, { from = "c2", to = "d2" },
  { from = "c0", to = "k3m.1" }, { from = "c1", to = "k3m.3" }, { from = "c2", to = "k3m.5" },
  { from = "d0", to = "k4m.1" }, { from = "d1", to = "k4m.3" }, { from = "d2", to = "k4m.5" },
  # Slow winding on top, fast winding from below
  { from = "k3m.2", to = "m1s.1U" }, { from = "k3m.4", to = "m1s.1V" }, { from = "k3m.6", to = "m1s.1W" },
  { from = "k4m.2", to = "m1s.2U", via = [[136, 192], [104, 192]] },
  { from = "k4m.4", to = "m1s.2V", via = [[144, 196], [112, 196]] },
  { from = "k4m.6", to = "m1s.2W", via = [[152, 200], [120, 200]] },
  { from = "pe1.2", to = "m1s.PE" },
  # Brake: rectifier across phases U and V, after the direction contactors
  { from = "e0", to = "v1s.~1" }, { from = "e1", to = "v1s.~2" },
  { from = "v1s.+", to = "y1s.A1" },
  { from = "v1s.-", to = "y1s.A2", via = [[184, 188], [176, 188]] },
  # Control chain
  { from = "f1s.2", to = "b1s.21" },
  { from = "s1s.14", to = "b2s.21" }, { from = "b2s.22", to = "k2i.21" }, { from = "k2i.22", to = "k1c.A1" },
  { from = "s3s.14", to = "b3s.21" }, { from = "b3s.22", to = "k1i.21" }, { from = "k1i.22", to = "k2c.A1" },
  { from = "k1a.14", to = "jc0" }, { from = "k2a.14", to = "jc1" }, { from = "jc0", to = "jc1" },
  { from = "jc0", to = "s2b.11" }, { from = "s2b.12", to = "s4b.11" }, { from = "s4b.12", to = "k4i.21" }, { from = "k4i.22", to = "k3c.A1" },
  { from = "s2s.14", to = "b4s.21" }, { from = "b4s.22", to = "jd0" }, { from = "s4s.14", to = "jd1" },
  { from = "jd0", to = "jd1" }, { from = "jd0", to = "k3i.21" }, { from = "k3i.22", to = "k4c.A1" },
]

# Top control rail (after F1 and the thermal contact) and the 0 V return rail
bus = [
  { y = 96, taps = ["b1s.22", "s1s.13", "s3s.13", "k1a.13", "k2a.13", "s2s.13", "s4s.13"] },
  { y = 248, taps = ["n1.2", "k1c.A2", "k2c.A2", "k3c.A2", "k4c.A2"] },
]

