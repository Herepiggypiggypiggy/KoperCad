# Single-speed hoist: up and down contactors, rectifier-fed spring brake,
# thermal contact and end limits.
name = "Hoist single-speed with rectifier brake"
chapter = "hoists"
description = "Single-speed hoist with up and down contactors, a spring brake released through a rectifier, motor thermal contact and end limits"
tags = ["hoist", "crane", "single-speed", "brake", "rectifier", "limit", "contactor", "lift"]
notes = """Hold S1 to hoist, S2 to lower. K1 and K2 lock each other, B2 and B3 are the end limits, B1 is the motor thermal contact. \
The brake is released through V1 while either direction contactor feeds the motor, and falls when it drops. \
You connect: L1 L2 L3 above Q1, PE above the PE terminal, the control supply above F1 and its return (0 V) above the N terminal."""

parameter = [
  { name = "power", default = 5.5, description = "Hoist motor power in kW" },
]

open = ["q1s.1,3,5", "pe1.1", "f1s.1", "n1.1"]

device = [
  { id = "q1", tag = "-Q1", description = "Hoist motor protection breaker", mount = { kind = "din", size = [45, 90, 78], at = [15, 55], rail = "r1" } },
  { id = "k1", tag = "-K1", description = "Hoist up contactor", mount = { kind = "din", size = [45, 77, 86], at = [65, 61.5], rail = "r1" } },
  { id = "k2", tag = "-K2", description = "Hoist down contactor", mount = { kind = "din", size = [45, 77, 86], at = [115, 61.5], rail = "r1" } },
  { id = "f1", tag = "-F1", description = "Control circuit breaker", mount = { kind = "din", size = [18, 90, 70], at = [165, 55], rail = "r1" } },
  { id = "m1", tag = "-M1", description = "Hoist motor {power} kW", props = { power_kw = "{power}" }, mount = { kind = "field", place = "on the hoist" } },
  { id = "v1", tag = "-V1", description = "Brake rectifier", mount = { kind = "field", place = "in the motor terminal box", note = "Mount it on the rail next to the contactors when the motor has no room for it" } },
  { id = "y1", tag = "-Y1", description = "Hoist brake, spring applied", mount = { kind = "field", place = "on the motor" } },
  { id = "b1", tag = "-B1", description = "Motor thermal contact", mount = { kind = "field", place = "in the motor winding" } },
  { id = "b2", tag = "-B2", description = "Upper end limit", mount = { kind = "field", place = "at the top of the hoist travel" } },
  { id = "b3", tag = "-B3", description = "Lower end limit", mount = { kind = "field", place = "at the bottom of the hoist travel" } },
  { id = "s1", tag = "-S1", description = "Up", mount = { kind = "field", place = "operator station" } },
  { id = "s2", tag = "-S2", description = "Down", mount = { kind = "field", place = "operator station" } },
]

symbol = [
  { id = "q1s", key = "iec/protection/motor_protection_breaker", at = [40, 40], device = "q1" },
  { id = "k1m", key = "iec/contactors/main_3p", at = [40, 72], device = "k1", main = false },
  { id = "k2m", key = "iec/contactors/main_3p", at = [80, 72], device = "k2", main = false },
  { id = "m1s", key = "iec/motors/motor_3ph", at = [40, 116], device = "m1" },
  { id = "pe1", key = "iec/terminals/terminal_pe", at = [64, 72] },
  { id = "v1s", key = "iec/passive/bridge_rectifier", at = [120, 116], device = "v1" },
  { id = "y1s", key = "iec/coils/brake", at = [120, 160], device = "y1" },
  { id = "f1s", key = "iec/protection/mcb_1p", at = [168, 40], device = "f1" },
  { id = "b1s", key = "iec/sensors/temperature_nc", at = [168, 64], device = "b1" },
  { id = "n1", key = "iec/terminals/terminal_n", at = [168, 192] },
  { id = "s1s", key = "iec/operators/pushbutton_no", at = [192, 104], device = "s1" },
  { id = "b2s", key = "iec/contacts/position_nc", at = [192, 128], device = "b2" },
  { id = "k2i", key = "iec/contacts/nc", at = [192, 152], device = "k2", main = false },
  { id = "k1c", key = "iec/coils/contactor", at = [192, 176], device = "k1", main = true },
  { id = "s2s", key = "iec/operators/pushbutton_no", at = [216, 104], device = "s2" },
  { id = "b3s", key = "iec/contacts/position_nc", at = [216, 128], device = "b3" },
  { id = "k1i", key = "iec/contacts/nc", at = [216, 152], device = "k1", main = false },
  { id = "k2c", key = "iec/coils/contactor", at = [216, 176], device = "k2", main = true },
]

junction = [
  { id = "u0", at = [40, 68] }, { id = "u1", at = [48, 64] }, { id = "u2", at = [56, 60] },
  # Phase rails U, V, W; the rectifier takes U and V
  { id = "a0", at = [40, 96] }, { id = "b0", at = [80, 96] }, { id = "c0", at = [120, 96] },
  { id = "a1", at = [48, 100] }, { id = "b1", at = [88, 100] }, { id = "c1", at = [128, 100] },
  { id = "a2", at = [56, 104] }, { id = "b2", at = [96, 104] },
]

wire = [
  { from = "q1s.2", to = "u0" }, { from = "q1s.4", to = "u1" }, { from = "q1s.6", to = "u2" },
  { from = "u0", to = "k1m.1" }, { from = "u1", to = "k1m.3" }, { from = "u2", to = "k1m.5" },
  { from = "u0", to = "k2m.5" }, { from = "u1", to = "k2m.3" }, { from = "u2", to = "k2m.1" },
  { from = "k1m.2", to = "a0" }, { from = "k1m.4", to = "a1" }, { from = "k1m.6", to = "a2" },
  { from = "k2m.2", to = "b0" }, { from = "k2m.4", to = "b1" }, { from = "k2m.6", to = "b2" },
  { from = "a0", to = "b0" }, { from = "a1", to = "b1" }, { from = "a2", to = "b2" },
  { from = "b0", to = "c0" }, { from = "b1", to = "c1" },
  { from = "a0", to = "m1s.U1" }, { from = "a1", to = "m1s.V1" }, { from = "a2", to = "m1s.W1" },
  { from = "pe1.2", to = "m1s.PE" },
  { from = "c0", to = "v1s.~1" }, { from = "c1", to = "v1s.~2" },
  { from = "v1s.+", to = "y1s.A1" },
  { from = "v1s.-", to = "y1s.A2", via = [[128, 188], [120, 188]] },
  { from = "f1s.2", to = "b1s.21" },
  { from = "s1s.14", to = "b2s.21" }, { from = "b2s.22", to = "k2i.21" }, { from = "k2i.22", to = "k1c.A1" },
  { from = "s2s.14", to = "b3s.21" }, { from = "b3s.22", to = "k1i.21" }, { from = "k1i.22", to = "k2c.A1" },
]

bus = [
  { y = 96, taps = ["b1s.22", "s1s.13", "s2s.13"] },
  { y = 208, taps = ["n1.2", "k1c.A2", "k2c.A2"] },
]

[plate]
width = 220
height = 170

[[rail]]
id = "r1"
x = 5
y = 100
length = 210
