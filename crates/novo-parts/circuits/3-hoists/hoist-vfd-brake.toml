# Frequency-controlled hoist: breaker, line contactor, converter with braking
# resistor, motor, a brake released by the converter's relay output and
# watched through a feedback contact, commands through the end limits.
name = "Hoist frequency controlled with brake and braking resistor"
chapter = "hoists"
description = "Hoist on a frequency converter: breaker, line contactor, converter with braking resistor, motor, brake released by the converter's relay output with a feedback contact, up and down commands through end limits"
tags = ["hoist", "crane", "vfd", "frequency converter", "inverter", "drive", "brake", "braking resistor", "end limit", "lift"]
notes = """The converter's control terminals are drawn as device pins of -T1 with generic names (+24, FWD, REV, SP2, BFB, PA/+, PB, RA, RC): rename them to your drive's terminals. \
S1 hoists, S2 lowers, S3 selects the fast step; B2 and B3 are the end limits, B4 takes the drive back to slow speed before the upper end; B1 is the motor thermal contact. \
When the converter releases the brake (relay RA to RC), K2 feeds the rectifier V1 and the spring brake Y1 lifts; the K2 contact tells the converter the brake really moved (BFB). \
The braking resistor R1 takes the energy of lowering; size it from the converter's data. This is a wiring example, not a validated lifting safety function. \
You connect: L1 L2 L3 above Q1, PE above the PE terminal, the brake supply above K2, 48 V above RA, 0 V below the K2 coil, the K1 coil from your emergency stop chain."""

parameter = [
  { name = "power", default = 5.5, description = "Motor power in kW" },
]

open = ["q1s.1,3,5", "pe1.1", "k2m.1,3", "dpra.1", "k2c.A2", "k1c.A1,A2"]

device = [
  { id = "q1", tag = "-Q1", description = "Drive input breaker", mount = { kind = "din", size = [54, 90, 70], at = [15, 55], rail = "r1" } },
  { id = "k1", tag = "-K1", description = "Line contactor", mount = { kind = "din", size = [45, 77, 86], at = [75, 61.5], rail = "r1" } },
  { id = "k2", tag = "-K2", description = "Brake supply contactor", mount = { kind = "din", size = [45, 77, 86], at = [125, 61.5], rail = "r1" } },
  { id = "t1", tag = "-T1", description = "Frequency converter {power} kW", props = { power_kw = "{power}" }, mount = { kind = "plate", size = [105, 143, 150], at = [15, 150] } },
  { id = "m1", tag = "-M1", description = "Hoist motor {power} kW", props = { power_kw = "{power}" }, mount = { kind = "field", place = "on the hoist" } },
  { id = "v1", tag = "-V1", description = "Brake rectifier", mount = { kind = "field", place = "in the motor terminal box" } },
  { id = "y1", tag = "-Y1", description = "Hoist brake, spring applied", mount = { kind = "field", place = "on the motor" } },
  { id = "b1", tag = "-B1", description = "Motor thermal contact", mount = { kind = "field", place = "in the motor winding" } },
  { id = "b2", tag = "-B2", description = "Upper end limit", mount = { kind = "field", place = "at the top of the hoist travel" } },
  { id = "b3", tag = "-B3", description = "Lower end limit", mount = { kind = "field", place = "at the bottom of the hoist travel" } },
  { id = "b4", tag = "-B4", description = "Upper slow-down limit", mount = { kind = "field", place = "just below the upper end limit" } },
  { id = "r1", tag = "-R1", description = "Braking resistor", mount = { kind = "plate", size = [55, 240, 70], at = [140, 150] } },
  { id = "s1", tag = "-S1", description = "Up", mount = { kind = "field", place = "operator station" } },
  { id = "s2", tag = "-S2", description = "Down", mount = { kind = "field", place = "operator station" } },
  { id = "s3", tag = "-S3", description = "Fast speed step", mount = { kind = "field", place = "operator station" } },
]

symbol = [
  # Power
  { id = "q1s", key = "iec/protection/mcb_3p", at = [40, 40], device = "q1" },
  { id = "k1m", key = "iec/contactors/main_3p", at = [40, 72], device = "k1", main = false },
  { id = "t1s", key = "iec/drives/frequency_converter", at = [40, 104], device = "t1" },
  { id = "m1s", key = "iec/motors/motor_3ph", at = [40, 152], device = "m1" },
  { id = "pe1", key = "iec/terminals/terminal_pe", at = [76, 56] },
  # Brake: contactor, rectifier, brake coil
  { id = "k2m", key = "iec/contactors/main_2p", at = [100, 40], device = "k2", main = false },
  { id = "v1s", key = "iec/passive/bridge_rectifier", at = [100, 72], device = "v1" },
  { id = "y1s", key = "iec/coils/brake", at = [100, 116], device = "y1" },
  # Drive control terminals (device pins of the converter)
  { id = "dp24", key = "iec/connectivity/device_pin", at = [150, 24], rotate = 180, device = "t1", main = false, numbers = ["+24"] },
  { id = "b1s", key = "iec/sensors/temperature_nc", at = [150, 40], device = "b1" },
  { id = "s1s", key = "iec/operators/pushbutton_no", at = [150, 72], device = "s1" },
  { id = "b2s", key = "iec/contacts/position_nc", at = [150, 96], device = "b2" },
  { id = "dpf", key = "iec/connectivity/device_pin", at = [150, 120], device = "t1", main = false, numbers = ["FWD"] },
  { id = "s2s", key = "iec/operators/pushbutton_no", at = [174, 72], device = "s2" },
  { id = "b3s", key = "iec/contacts/position_nc", at = [174, 96], device = "b3" },
  { id = "dpr", key = "iec/connectivity/device_pin", at = [174, 120], device = "t1", main = false, numbers = ["REV"] },
  { id = "s3s", key = "iec/operators/pushbutton_no", at = [198, 72], device = "s3" },
  { id = "b4s", key = "iec/contacts/position_nc", at = [198, 96], device = "b4" },
  { id = "dps", key = "iec/connectivity/device_pin", at = [198, 120], device = "t1", main = false, numbers = ["SP2"] },
  # Brake feedback: the K2 contact tells the converter the brake moved
  { id = "k2a", key = "iec/contacts/no", at = [222, 72], device = "k2", main = false },
  { id = "dpb", key = "iec/connectivity/device_pin", at = [222, 96], device = "t1", main = false, numbers = ["BFB"] },
  # Braking resistor on the converter's DC terminals
  { id = "dpa", key = "iec/connectivity/device_pin", at = [140, 176], rotate = 180, device = "t1", main = false, numbers = ["PA/+"] },
  { id = "r1s", key = "iec/passive/resistor", at = [140, 192], device = "r1" },
  { id = "dpc", key = "iec/connectivity/device_pin", at = [140, 220], device = "t1", main = false, numbers = ["PB"] },
  # Brake release: the converter's relay output closes and K2 pulls in
  { id = "dpra", key = "iec/connectivity/device_pin", at = [240, 40], device = "t1", main = false, numbers = ["RA"] },
  { id = "dprc", key = "iec/connectivity/device_pin", at = [240, 64], rotate = 180, device = "t1", main = false, numbers = ["RC"] },
  { id = "k2c", key = "iec/coils/contactor", at = [240, 80], device = "k2", main = true },
  # Line contactor coil, driven by your emergency stop chain
  { id = "k1c", key = "iec/coils/contactor", at = [280, 40], device = "k1", main = true },
]

junction = [
  { id = "bus", at = [150, 60] }, { id = "bus2", at = [174, 60] }, { id = "bus3", at = [198, 60] }, { id = "bus4", at = [222, 60] },
]

chain = [
  { path = "q1s.2,4,6 > k1m.1,3,5/2,4,6 > t1s.L1,L2,L3" },
  { path = "t1s.U,V,W > m1s.U1,V1,W1" },
  { path = "t1s.PE2 > m1s.PE" },
  { path = "pe1.2 > t1s.PE" },
  { path = "k2m.2,4 > v1s.~1,~2" },
  { path = "v1s.+ > y1s.A1" },
]

wire = [
  { from = "v1s.-", to = "y1s.A2", via = [[108, 140], [100, 140]] },
  { from = "dp24.1", to = "b1s.21" },
  { from = "b1s.22", to = "bus" },
  { from = "bus", to = "s1s.13" }, { from = "s1s.14", to = "b2s.21" }, { from = "b2s.22", to = "dpf.1" },
  { from = "bus", to = "bus2" }, { from = "bus2", to = "s2s.13" }, { from = "s2s.14", to = "b3s.21" }, { from = "b3s.22", to = "dpr.1" },
  { from = "bus2", to = "bus3" }, { from = "bus3", to = "s3s.13" }, { from = "s3s.14", to = "b4s.21" }, { from = "b4s.22", to = "dps.1" },
  { from = "bus3", to = "bus4" }, { from = "bus4", to = "k2a.13" }, { from = "k2a.14", to = "dpb.1" },
  { from = "dpa.1", to = "r1s.1" }, { from = "r1s.2", to = "dpc.1" },
  { from = "dprc.1", to = "k2c.A1" },
]

[plate]
width = 300
height = 400

[[rail]]
id = "r1"
x = 10
y = 100
length = 280
