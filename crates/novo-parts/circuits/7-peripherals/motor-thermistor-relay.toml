# Motor winding thermistor loop on an evaluation relay with a change-over output.
name = "Motor thermistor relay"
chapter = "peripherals"
description = "Motor winding thermistor loop read by an evaluation relay with a change-over output, supplied from the control circuit"
tags = ["motor", "thermistor", "ptc", "temperature", "protection", "relay", "winding", "thermal"]
notes = """The evaluation relay A2 trips when the thermistor loop B1 gets hot or breaks, and its change-over contact K1 drops the motor's contactor or signals the fault. \\
The relay's sensor terminals are drawn as device pins of -A2 (T1, T2); rename them to your relay's terminals. \\
You connect: the control supply above F1, 0 V below the relay supply, and the three points of the change-over contact."""

open = ["f1s.1", "a2c.A2", "a2k.11,12,14"]

device = [
  { id = "f1", tag = "-F1", description = "Relay circuit breaker", mount = { kind = "din", size = [18, 90, 70], at = [15, 55], rail = "r1" } },
  { id = "a2", tag = "-A2", description = "Thermistor evaluation relay", mount = { kind = "din", size = [22.5, 90, 61], at = [45, 55], rail = "r1" } },
  { id = "b1", tag = "-B1", description = "Motor winding thermistors (PTC)", mount = { kind = "field", place = "in the motor winding" } },
]

symbol = [
  { id = "f1s", key = "iec/protection/mcb_1p", at = [40, 40], device = "f1" },
  { id = "a2c", key = "iec/coils/relay", at = [40, 80], device = "a2", main = true },
  { id = "dpt1", key = "iec/connectivity/device_pin", at = [88, 40], rotate = 180, device = "a2", main = false, numbers = ["T1"] },
  { id = "b1s", key = "iec/passive/thermistor_ptc", at = [88, 56], device = "b1" },
  { id = "dpt2", key = "iec/connectivity/device_pin", at = [88, 88], device = "a2", main = false, numbers = ["T2"] },
  { id = "a2k", key = "iec/contacts/changeover", at = [136, 56], device = "a2", main = false },
]

wire = [
  { from = "f1s.2", to = "a2c.A1" },
  { from = "dpt1.1", to = "b1s.T1" },
  { from = "b1s.T2", to = "dpt2.1" },
]

[plate]
width = 100
height = 160

[[rail]]
id = "r1"
x = 5
y = 100
length = 90
