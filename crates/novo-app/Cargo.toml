[package]
name = "novo-app"
description = "KoperCAD desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "kopercad"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true, features = ["persistence"] }
novo-core.workspace = true
novo-storage.workspace = true
novo-canvas.workspace = true
novo-layout.workspace = true
novo-parts.workspace = true
novo-routing.workspace = true
novo-cables.workspace = true
novo-theme.workspace = true
novo-heatview.workspace = true
novo-cfd.workspace = true
novo-thermal.workspace = true
novo-symbols.workspace = true
novo-editor.workspace = true
novo-workflow.workspace = true
novo-numbering.workspace = true
novo-xref.workspace = true
novo-pdf.workspace = true
novo-interop.workspace = true
novo-reports.workspace = true
novo-checks.workspace = true
novo-commissioning.workspace = true
novo-learn.workspace = true
novo-terminals.workspace = true
novo-plc.workspace = true
novo-revisions.workspace = true
novo-sim.workspace = true
novo-safety.workspace = true
novo-view3d.workspace = true
glam.workspace = true
novo-tests.workspace = true
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
rfd = "0.17"
image.workspace = true
serde.workspace = true
dirs.workspace = true

[dev-dependencies]
novo-cfd = { workspace = true, features = ["demo"] }
ron = "0.12"
tempfile.workspace = true
lopdf.workspace = true

[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "KoperCAD"
FileDescription = "KoperCAD electrical CAD"

[lints]
workspace = true
