[package]
name = "novo-app"
description = "NovoElectric desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "novoelectric"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true, features = ["persistence"] }
novo-core.workspace = true
novo-storage.workspace = true
novo-canvas.workspace = true
novo-cables.workspace = true
novo-theme.workspace = true
novo-symbols.workspace = true
novo-editor.workspace = true
novo-workflow.workspace = true
novo-xref.workspace = true
novo-pdf.workspace = true
novo-reports.workspace = true
novo-checks.workspace = true
novo-terminals.workspace = true
novo-plc.workspace = true
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
rfd = "0.17"
serde.workspace = true
dirs.workspace = true

[dev-dependencies]
ron = "0.12"
tempfile.workspace = true
lopdf.workspace = true

[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "NovoElectric"
FileDescription = "NovoElectric electrical CAD"

[lints]
workspace = true
