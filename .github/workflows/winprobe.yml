name: winprobe
on:
  push:
    branches: [claude/windows-probe]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p novo-interop --test part3d_generated -- --nocapture --test-threads=1
        shell: pwsh
