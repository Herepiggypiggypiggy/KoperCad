name: Windows installer

on:
  push:
    tags: ["v*"]
  # Code changes are covered by CI's Windows job and the experimental build;
  # the installer itself is rebuilt only when its own inputs change.
  pull_request:
    paths:
      - "packaging/windows/**"
      - "assets/branding/**"
      - ".github/workflows/package-windows.yml"
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check, so
# stale runs stop holding runners (and the experimental build's publish job
# no longer queues behind them). Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job: fork pull requests run this workflow too.
# Only the release job below gets a write token, and it runs for tag pushes
# only and executes no repository code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p novo-app -p novo-cli
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
      - name: Build installer
        shell: pwsh
        run: |
          $version = ((cargo pkgid -p novo-app) -split '[#@]')[-1]
          # A release candidate tag (v0.1.0-rc1) builds the crate version 0.1.0.
          if ($env:GITHUB_REF_TYPE -eq "tag" -and ($env:GITHUB_REF_NAME -replace '-rc[0-9]+$', '') -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match the crate version $version"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\novoelectric.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check no admin rights are requested
        shell: pwsh
        run: |
          # The installer and the app must run without elevation.
          foreach ($exe in @((Get-ChildItem dist\KoperCAD-*-setup.exe)[0].FullName, "target\release\kopercad.exe", "target\release\kopercad-cli.exe")) {
            $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
            if ($text -match 'requireAdministrator|highestAvailable') { throw "$exe asks for admin rights" }
          }
          # A dynamically linked MSVC runtime would need the machine-wide VC++
          # Redistributable, which a standard user cannot install.
          $app = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target\release\kopercad.exe"))
          if ($app -match '(?i)vcruntime140|msvcp140|api-ms-win-crt-') { throw "kopercad.exe links the MSVC runtime dynamically" }
      - name: Install as a standard (non-admin) user
        shell: pwsh
        run: |
          $user = "novotest"
          $pw = ConvertTo-SecureString ("Nv1!" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
          New-LocalUser -Name $user -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member $user
          if (Get-LocalGroupMember -Group Administrators | Where-Object Name -like "*\$user") { throw "test user is an admin" }
          $cred = New-Object PSCredential("$env:COMPUTERNAME\$user", $pw)

          # Processes started with -Credential inherit this job's environment,
          # including TEMP, which the test user cannot write to. Give it a
          # work folder of its own.
          $work = "C:\novotest"
          New-Item -ItemType Directory -Force "$work\temp" | Out-Null
          icacls $work /grant "${user}:(OI)(CI)F" | Out-Null
          $env:TEMP = "$work\temp"
          $env:TMP = "$work\temp"
          # The same goes for the profile variables the shell folder lookups
          # expand ({localappdata} failed with access denied on the runner's).
          $profileDir = "C:\Users\$user"
          $env:USERPROFILE = $profileDir
          $env:HOMEDRIVE = "C:"
          $env:HOMEPATH = "\Users\$user"
          $env:USERNAME = $user
          $env:APPDATA = "$profileDir\AppData\Roaming"
          $env:LOCALAPPDATA = "$profileDir\AppData\Local"
          # Loading the profile once creates it.
          Start-Process cmd.exe -Credential $cred -LoadUserProfile -WorkingDirectory $work -ArgumentList "/c", "exit" -Wait
          if (-not (Test-Path $profileDir)) { throw "profile for $user was not created" }

          $setup = (Get-ChildItem dist\KoperCAD-*-setup.exe)[0]
          Copy-Item $setup.FullName "$work\novo-setup.exe"
          $p = Start-Process "$work\novo-setup.exe" -Credential $cred -LoadUserProfile -WorkingDirectory $work `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$work\install.log" -Wait -PassThru
          Get-Content "$work\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }

          $exe = "C:\Users\$user\AppData\Local\Programs\KoperCAD\kopercad.exe"
          if (-not (Test-Path $exe)) { throw "kopercad.exe is not in the user's %LOCALAPPDATA%\Programs" }
          if (Test-Path "HKLM:\Software\Classes\KoperCAD.Project") { throw "file association was written machine-wide" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{AEB465B9-04F0-475B-AD7F-091D638587B5}_is1") { throw "uninstall entry was written machine-wide" }

      - name: Launch the installed app
        shell: pwsh
        run: |
          # A GUI started with -Credential from the runner's service session
          # has no desktop to attach to, so this step runs the installed exe
          # as the runner; its asInvoker manifest (checked above) means it
          # runs with whatever rights its user has.
          $exe = "C:\Users\novotest\AppData\Local\Programs\KoperCAD\kopercad.exe"
          $app = Start-Process $exe -WorkingDirectory C:\novotest -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "kopercad.exe exited at startup with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          $setup = (Get-ChildItem dist\KoperCAD-*-setup.exe)[0]
          $size = [math]::Round($setup.Length / 1MB, 1)
          "Installer: $($setup.Name), $size MB, installed as a standard user, app launched" >> $env:GITHUB_STEP_SUMMARY
      - name: Portable zip, build info and checksums
        shell: pwsh
        run: |
          $version = ((cargo pkgid -p novo-app) -split '[#@]')[-1]
          $label = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace '^v', '' } else { "$version-ci" }
          $stage = "dist\portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\kopercad.exe, target\release\kopercad-cli.exe $stage
          Copy-Item packaging\windows\portable\run.cmd $stage
          Copy-Item docs\TESTER-README.md "$stage\README.md"
          Copy-Item RELEASE_NOTES.md, THIRD_PARTY_NOTICES.txt $stage
          # LICENSE files appear once the licence is decided (B13); copy whatever exists.
          Get-ChildItem -Path . -Filter "LICENSE*" -File | Copy-Item -Destination $stage
          @(
            "KoperCAD $label"
            "Commit: $env:GITHUB_SHA"
            "Built: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding utf8 "$stage\BUILD_INFO.txt"
          $zip = "dist\KoperCAD-$label-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Copy-Item "$stage\BUILD_INFO.txt" dist\BUILD_INFO.txt
          # sha256sum format (hash, two spaces, name) so `sha256sum -c` works too.
          $lines = foreach ($f in @((Get-ChildItem dist\KoperCAD-*-setup.exe)[0], (Get-Item $zip))) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS
          Get-Content dist\SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: KoperCAD-windows-installer
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KoperCAD-release-files
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
            dist/BUILD_INFO.txt
          if-no-files-found: error

  # Attaches the installer, the portable zip, the build info and the checksums
  # to a GitHub release. Runs for tag pushes only (a pull request cannot reach
  # it), has the only write token in this workflow and checks out no code.
  # Tags vX.Y.Z make a pre-release (the beta is not a stable release yet);
  # release candidate tags vX.Y.Z-rcN make a draft pre-release that only
  # people with write access can see until it is published.
  release:
    needs: installer
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KoperCAD-release-files
          path: release
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          # PowerShell wrote CRLF line ends; sha256sum would read them as part of the name.
          sed -i 's/\r$//' SHA256SUMS
          sha256sum -c SHA256SUMS
          flags=(--prerelease)
          case "$TAG" in *-rc*) flags+=(--draft) ;; esac
          cat > notes.md <<'EOF'
          Beta for test users. Windows 10/11 only. No admin rights are needed.

          - `KoperCAD-*-setup.exe`: per-user installer (installs under your profile).
          - `KoperCAD-*-portable.zip`: unzip anywhere and double-click `run.cmd`; includes `kopercad-cli.exe`.
          - `SHA256SUMS`: checksums of the two files above. `BUILD_INFO.txt`: version, commit and build time.

          The program is not code-signed yet, so Windows SmartScreen may warn on first start: choose "More info", then "Run anyway".
          EOF
          # `gh release view` does not find draft releases by tag, so look in the list.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$TAG"; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber KoperCAD-*-setup.exe KoperCAD-*-portable.zip SHA256SUMS BUILD_INFO.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "KoperCAD ${TAG#v}" --notes-file notes.md \
              KoperCAD-*-setup.exe KoperCAD-*-portable.zip SHA256SUMS BUILD_INFO.txt
          fi
