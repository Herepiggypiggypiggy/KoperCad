name: Windows installer

on:
  push:
    tags: ["v*"]
  # Code changes are covered by CI's Windows job and the experimental build;
  # the installer itself is rebuilt only when its own inputs change.
  pull_request:
    paths:
      - "packaging/windows/**"
      - "assets/branding/**"
      - ".github/workflows/package-windows.yml"
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check, so
# stale runs stop holding runners (and the experimental build's publish job
# no longer queues behind them). Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job: fork pull requests run this workflow too.
# Only the release job below gets a write token, and it runs for tag pushes
# only and executes no repository code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p novo-app -p novo-cli
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
      - name: Build installer
        shell: pwsh
        run: |
          $version = ((cargo pkgid -p novo-app) -split '[#@]')[-1]
          # A release candidate tag (v0.1.0-rc1) builds the crate version 0.1.0.
          if ($env:GITHUB_REF_TYPE -eq "tag" -and ($env:GITHUB_REF_NAME -replace '-rc[0-9]+$', '') -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match the crate version $version"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\novoelectric.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check no admin rights are requested
        shell: pwsh
        run: |
          # The installer and the app must run without elevation.
          foreach ($exe in @((Get-ChildItem dist\KoperCAD-*-setup.exe)[0].FullName, "target\release\kopercad.exe", "target\release\kopercad-cli.exe")) {
            $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
            if ($text -match 'requireAdministrator|highestAvailable') { throw "$exe asks for admin rights" }
          }
          # A dynamically linked MSVC runtime would need the machine-wide VC++
          # Redistributable, which a standard user cannot install.
          $app = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target\release\kopercad.exe"))
          if ($app -match '(?i)vcruntime140|msvcp140|api-ms-win-crt-') { throw "kopercad.exe links the MSVC runtime dynamically" }
      - name: Install as a standard (non-admin) user
        shell: pwsh
        run: |
          $user = "novotest"
          $pw = ConvertTo-SecureString ("Nv1!" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
          New-LocalUser -Name $user -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member $user
          if (Get-LocalGroupMember -Group Administrators | Where-Object Name -like "*\$user") { throw "test user is an admin" }
          $cred = New-Object PSCredential("$env:COMPUTERNAME\$user", $pw)

          # Processes started with -Credential inherit this job's environment,
          # including TEMP, which the test user cannot write to. Give it a
          # work folder of its own.
          $work = "C:\novotest"
          New-Item -ItemType Directory -Force "$work\temp" | Out-Null
          icacls $work /grant "${user}:(OI)(CI)F" | Out-Null
          $env:TEMP = "$work\temp"
          $env:TMP = "$work\temp"
          # The same goes for the profile variables the shell folder lookups
          # expand ({localappdata} failed with access denied on the runner's).
          $profileDir = "C:\Users\$user"
          $env:USERPROFILE = $profileDir
          $env:HOMEDRIVE = "C:"
          $env:HOMEPATH = "\Users\$user"
          $env:USERNAME = $user
          $env:APPDATA = "$profileDir\AppData\Roaming"
          $env:LOCALAPPDATA = "$profileDir\AppData\Local"
          # Loading the profile once creates it.
          Start-Process cmd.exe -Credential $cred -LoadUserProfile -WorkingDirectory $work -ArgumentList "/c", "exit" -Wait
          if (-not (Test-Path $profileDir)) { throw "profile for $user was not created" }

          $setup = (Get-ChildItem dist\KoperCAD-*-setup.exe)[0]
          Copy-Item $setup.FullName "$work\novo-setup.exe"
          $p = Start-Process "$work\novo-setup.exe" -Credential $cred -LoadUserProfile -WorkingDirectory $work `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$work\install.log" -Wait -PassThru
          Get-Content "$work\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }

          $exe = "C:\Users\$user\AppData\Local\Programs\KoperCAD\kopercad.exe"
          if (-not (Test-Path $exe)) { throw "kopercad.exe is not in the user's %LOCALAPPDATA%\Programs" }
          if (Test-Path "HKLM:\Software\Classes\KoperCAD.Project") { throw "file association was written machine-wide" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{AEB465B9-04F0-475B-AD7F-091D638587B5}_is1") { throw "uninstall entry was written machine-wide" }

      - name: First start on a clean profile
        shell: pwsh
        run: |
          # A GUI started with -Credential from the runner's service session
          # has no desktop to attach to, so this step runs the installed exe
          # as the runner; its asInvoker manifest (checked above) means it
          # runs with whatever rights its user has. The profile variables
          # point at the test user's untouched profile, so the app sees a PC
          # that never ran KoperCAD.
          $profileDir = "C:\Users\novotest"
          foreach ($d in "AppData\Local\KoperCAD", "AppData\Roaming\KoperCAD", "AppData\Roaming\NovoElectric", "AppData\Local\NovoElectric") {
            if (Test-Path "$profileDir\$d") { throw "$d existed before the first start" }
          }
          $env:USERPROFILE = $profileDir
          $env:APPDATA = "$profileDir\AppData\Roaming"
          $env:LOCALAPPDATA = "$profileDir\AppData\Local"
          $exe = "$profileDir\AppData\Local\Programs\KoperCAD\kopercad.exe"
          $app = Start-Process $exe -WorkingDirectory C:\novotest -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "kopercad.exe exited at startup with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          $log = Get-ChildItem "$profileDir\AppData\Local\KoperCAD\logs" -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) { throw "first start wrote no log under %LOCALAPPDATA%\KoperCAD\logs" }
          Get-Content $log.FullName | Select-Object -First 20
          if ((Get-Content $log.FullName -Raw) -match '(?i)panic') { throw "first start logged a panic" }
          if (Test-Path "$profileDir\Documents\KoperCAD\*") { throw "first start wrote into Documents before anything was saved" }
          $setup = (Get-ChildItem dist\KoperCAD-*-setup.exe)[0]
          $size = [math]::Round($setup.Length / 1MB, 1)
          "Installer: $($setup.Name), $size MB, installed as a standard user, first start on a clean profile ok" >> $env:GITHUB_STEP_SUMMARY

      - name: Registry, shortcuts, update over an old install, uninstall
        shell: pwsh
        run: |
          $user = "novotest"
          $work = "C:\novotest"
          $profileDir = "C:\Users\$user"
          $appDir = "$profileDir\AppData\Local\Programs\KoperCAD"
          $programs = "$profileDir\AppData\Roaming\Microsoft\Windows\Start Menu\Programs"
          $guid = "{AEB465B9-04F0-475B-AD7F-091D638587B5}"
          $summary = @()

          # The test user's registry hive is only loaded while one of its
          # processes runs, so load the file by hand for each look.
          # HKCU\Software\Classes lives in a second file (UsrClass.dat), which
          # a loaded user maps as HKU\<sid>_Classes; here it is HKU\novotest_Classes.
          function Get-UserHive([scriptblock]$look) {
            $hives = @(
              @("HKU\novotest", "$profileDir\NTUSER.DAT"),
              @("HKU\novotest_Classes", "$profileDir\AppData\Local\Microsoft\Windows\UsrClass.dat"))
            foreach ($h in $hives) {
              $loaded = $false
              for ($i = 0; $i -lt 15 -and -not $loaded; $i++) {
                reg load $h[0] $h[1] 2>$null | Out-Null
                if ($LASTEXITCODE -eq 0) { $loaded = $true } else { Start-Sleep -Seconds 2 }
              }
              if (-not $loaded) { throw "could not load $($h[1])" }
            }
            try { & $look } finally {
              [GC]::Collect(); [GC]::WaitForPendingFinalizers()
              foreach ($h in $hives) { reg unload $h[0] 2>$null | Out-Null }
            }
          }
          function Run-AsUser([string]$file, [string[]]$arguments) {
            Start-Process $file -Credential $cred -LoadUserProfile -WorkingDirectory $work -ArgumentList $arguments -Wait -PassThru
          }

          # The password was random in the step above; reset it for this one.
          $newpw = ConvertTo-SecureString ("Nv2!" + [guid]::NewGuid().ToString("N")) -AsPlainText -Force
          Set-LocalUser -Name $user -Password $newpw
          $cred = New-Object PSCredential("$env:COMPUTERNAME\$user", $newpw)
          $env:TEMP = "$work\temp"; $env:TMP = "$work\temp"
          $env:USERPROFILE = $profileDir; $env:HOMEDRIVE = "C:"; $env:HOMEPATH = "\Users\$user"; $env:USERNAME = $user
          $env:APPDATA = "$profileDir\AppData\Roaming"; $env:LOCALAPPDATA = "$profileDir\AppData\Local"

          # 1. After the first install: file types, uninstall entry, shortcuts.
          Get-UserHive {
            foreach ($ext in ".kopercad", ".novo") {
              $v = (Get-ItemProperty "Registry::HKU\novotest_Classes\$ext" -ErrorAction Stop).'(default)'
              if ($v -ne "KoperCAD.Project") { throw "$ext opens with '$v', not KoperCAD.Project" }
            }
            $cmd = (Get-ItemProperty "Registry::HKU\novotest_Classes\KoperCAD.Project\shell\open\command").'(default)'
            if ($cmd -ne "`"$appDir\kopercad.exe`" `"%1`"") { throw "open command is: $cmd" }
            $u = Get-ItemProperty "Registry::HKU\novotest\Software\Microsoft\Windows\CurrentVersion\Uninstall\${guid}_is1" -ErrorAction Stop
            if ($u.DisplayName -notlike "KoperCAD*") { throw "uninstall entry is named '$($u.DisplayName)'" }
            if ($u.UninstallString -notlike "*$appDir*") { throw "uninstall string is outside the user's program folder: $($u.UninstallString)" }
          }
          foreach ($lnk in "KoperCAD.lnk", "KoperCAD (safe graphics).lnk") {
            if (-not (Test-Path "$programs\$lnk")) { throw "Start menu entry '$lnk' is missing" }
          }
          if (Test-Path "$profileDir\Desktop\KoperCAD.lnk") { throw "desktop icon was created although it is unticked by default" }
          $summary += "- file types .kopercad and .novo, open command, uninstall entry and both Start menu entries are per user"

          # 2. Update over an install that still has the old name's leftovers.
          New-Item -ItemType File "$programs\NovoElectric.lnk", "$profileDir\Desktop\NovoElectric.lnk", "$appDir\novoelectric.exe" -Force | Out-Null
          $p = Run-AsUser "$work\novo-setup.exe" @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$work\update.log")
          Get-Content "$work\update.log" -ErrorAction SilentlyContinue | Select-Object -Last 8
          if ($p.ExitCode -ne 0) { throw "the update exited with $($p.ExitCode)" }
          foreach ($gone in "$programs\NovoElectric.lnk", "$profileDir\Desktop\NovoElectric.lnk", "$appDir\novoelectric.exe") {
            if (Test-Path $gone) { throw "update left $gone behind" }
          }
          if (-not (Test-Path "$appDir\kopercad.exe")) { throw "update removed kopercad.exe" }
          if (@(Get-ChildItem $programs -Filter "KoperCAD*.lnk").Count -ne 2) { throw "update left a different number of Start menu entries than two" }
          if (-not (Test-Path "$profileDir\AppData\Local\KoperCAD\logs")) { throw "update removed the user's log folder" }
          $summary += "- update over an old install removes the NovoElectric shortcuts and exe, keeps one set of entries and the user's data"

          # 3. Silent uninstall: program, shortcuts and registry go; data and projects stay.
          New-Item -ItemType Directory -Force "$profileDir\Documents\KoperCAD" | Out-Null
          Set-Content "$profileDir\Documents\KoperCAD\keep.kopercad" "project"
          $unins = "$appDir\unins000.exe"
          if (-not (Test-Path $unins)) { throw "no uninstaller in the program folder" }
          # The uninstaller copies itself to a temp folder and the first process
          # returns at once, so wait for the files to go.
          Run-AsUser $unins @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$work\uninstall.log") | Out-Null
          for ($i = 0; $i -lt 60 -and (Test-Path "$appDir\kopercad.exe"); $i++) { Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 5
          Get-Content "$work\uninstall.log" -ErrorAction SilentlyContinue | Select-Object -Last 8
          if (Test-Path "$appDir\kopercad.exe") { throw "uninstall left kopercad.exe" }
          if (Test-Path "$programs\KoperCAD.lnk") { throw "uninstall left the Start menu entry" }
          if (Test-Path "$programs\KoperCAD (safe graphics).lnk") { throw "uninstall left the safe graphics entry" }
          Get-UserHive {
            foreach ($k in "novotest_Classes\.kopercad", "novotest_Classes\.novo", "novotest_Classes\KoperCAD.Project", "novotest\Software\Microsoft\Windows\CurrentVersion\Uninstall\${guid}_is1") {
              if (Test-Path "Registry::HKU\$k") { throw "uninstall left HKU\$k" }
            }
          }
          if (-not (Test-Path "$profileDir\AppData\Local\KoperCAD\logs")) { throw "a silent uninstall removed the user's data" }
          if (-not (Test-Path "$profileDir\Documents\KoperCAD\keep.kopercad")) { throw "uninstall removed a project file" }
          $summary += "- silent uninstall removes program, shortcuts and registry keys; settings, logs and project files stay"
          $summary += "- not covered here (needs a person at a real desktop): the wizard pages, the data question at uninstall, SmartScreen, HiDPI, double-click in Explorer, the GPU adapter"
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          $summary

      - name: Portable zip, build info and checksums
        shell: pwsh
        run: |
          $version = ((cargo pkgid -p novo-app) -split '[#@]')[-1]
          $label = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME -replace '^v', '' } else { "$version-ci" }
          $stage = "dist\portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\kopercad.exe, target\release\kopercad-cli.exe $stage
          Copy-Item packaging\windows\portable\run.cmd, packaging\windows\portable\run-safe-graphics.cmd $stage
          # The marker makes the folder portable: settings and logs go to .\data, not the user profile.
          New-Item -ItemType File "$stage\kopercad.portable" | Out-Null
          Copy-Item docs\TESTER-README.md "$stage\README.md"
          Copy-Item RELEASE_NOTES.md, THIRD_PARTY_NOTICES.txt $stage
          # LICENSE files appear once the licence is decided (B13); copy whatever exists.
          Get-ChildItem -Path . -Filter "LICENSE*" -File | Copy-Item -Destination $stage
          @(
            "KoperCAD $label"
            "Commit: $env:GITHUB_SHA"
            "Built: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding utf8 "$stage\BUILD_INFO.txt"
          $zip = "dist\KoperCAD-$label-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Copy-Item "$stage\BUILD_INFO.txt" dist\BUILD_INFO.txt
          # sha256sum format (hash, two spaces, name) so `sha256sum -c` works too.
          $lines = foreach ($f in @((Get-ChildItem dist\KoperCAD-*-setup.exe)[0], (Get-Item $zip))) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS
          Get-Content dist\SHA256SUMS
          # Release notes for a tag: docs/release-notes/<tag>.md at the tagged commit, when it exists.
          $notes = "docs\release-notes\$($env:GITHUB_REF_NAME).md"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and (Test-Path $notes)) { Copy-Item $notes dist\RELEASE-NOTES.md }
      - name: Portable zip runs from an odd folder, keeps its data beside itself, safe graphics picks the software adapter
        shell: pwsh
        run: |
          # The shipped zip, unpacked into a folder with spaces and brackets
          # (the case run.cmd's comment worries about), on a profile that has
          # never seen KoperCAD.
          $zip = (Get-ChildItem dist\KoperCAD-*-portable.zip)[0]
          $dest = Join-Path $env:RUNNER_TEMP "KC (portable) test"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $dest
          foreach ($f in "kopercad.exe", "kopercad-cli.exe", "run.cmd", "run-safe-graphics.cmd", "kopercad.portable", "README.md", "THIRD_PARTY_NOTICES.txt") {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "the portable zip is missing $f" }
          }
          $fresh = Join-Path $env:RUNNER_TEMP "fresh-profile"
          $env:LOCALAPPDATA = "$fresh\Local"; $env:APPDATA = "$fresh\Roaming"; $env:USERPROFILE = $fresh
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA, $env:APPDATA | Out-Null

          & "$dest\kopercad-cli.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "kopercad-cli.exe --help exited with $LASTEXITCODE" }

          function Start-Check([string]$label, [string]$cmdFile) {
            Get-ChildItem "$dest\data" -Recurse -Filter *.log -ErrorAction SilentlyContinue | Remove-Item -Force
            $cmd = Start-Process cmd.exe -ArgumentList "/c", "`"$dest\$cmdFile`"" -WorkingDirectory $dest -PassThru
            $app = $null
            for ($i = 0; $i -lt 30 -and -not $app; $i++) { Start-Sleep -Seconds 1; $app = Get-Process kopercad -ErrorAction SilentlyContinue | Select-Object -First 1 }
            if (-not $app) { throw "$label did not start kopercad.exe" }
            Start-Sleep -Seconds 10
            if ($app.HasExited) { throw "$label: kopercad.exe exited at startup with code $($app.ExitCode)" }
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 2
            # A killed program makes run.cmd report the exit code and wait for a key.
            Stop-Process -Id $cmd.Id -Force -ErrorAction SilentlyContinue
            $log = Get-ChildItem "$dest\data" -Recurse -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $log) { throw "$label wrote no log under the portable data folder" }
            $text = Get-Content $log.FullName -Raw
            if ($text -match '(?i)panic') { throw "$label logged a panic" }
            $text -split "`n" | Where-Object { $_ -match 'graphics adapter' } | ForEach-Object { "[$label] $_" }
            return $text
          }

          $normal = Start-Check "run.cmd" "run.cmd"
          if ($normal -notmatch 'Using graphics adapter') { throw "run.cmd: the log names no graphics adapter" }
          $safe = Start-Check "run-safe-graphics.cmd" "run-safe-graphics.cmd"
          if ($safe -notmatch 'Using graphics adapter') { throw "safe graphics: the log names no graphics adapter" }
          if ($safe -notmatch 'asks for the software renderer') { throw "--safe-graphics was not honoured: the log never says it asked for the software renderer" }
          # The runner has the Microsoft software adapter; safe graphics must pick it.
          if ($safe -notmatch '(?i)Using graphics adapter [^\r\n]*(Basic Render|WARP|Cpu|llvmpipe)') { throw "safe graphics did not choose a software adapter" }

          # Nothing may leak into the user's own profile or Documents.
          foreach ($d in "$fresh\Local\KoperCAD", "$fresh\Roaming\KoperCAD", "$fresh\Local\NovoElectric", "$fresh\Documents\KoperCAD") {
            if (Test-Path $d) { throw "portable run wrote to $d" }
          }
          @(
            "- portable zip unpacked into a folder with spaces and brackets: run.cmd and run-safe-graphics.cmd start the app, kopercad-cli --help works",
            "- portable data (log) stays in the data folder beside the program, nothing in the user profile",
            "- run-safe-graphics.cmd really selects the software adapter on the runner (log line 'asks for the software renderer')"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Update over a running copy (information only)
        shell: pwsh
        continue-on-error: true
        run: |
          # Install, start the program, then install the same setup over it
          # silently, as an update does. Inno's CloseApplications should close
          # the running copy. Whether a window with unsaved work can refuse
          # to close is a question for a real desktop. Recorded, not gating yet.
          $setup = (Get-ChildItem dist\KoperCAD-*-setup.exe)[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP "KC update"
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS=", "/LOG=$env:RUNNER_TEMP\upd1.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "first install exited with $($p.ExitCode)" }
          $app = Start-Process "$dir\kopercad.exe" -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "the installed copy did not stay running" }
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS=", "/LOG=$env:RUNNER_TEMP\upd2.log" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\upd2.log" -ErrorAction SilentlyContinue | Select-String -Pattern 'clos|Restart|in use|running|Replac' | Select-Object -Last 15
          $line = "- update over a running copy: setup exit code $($p.ExitCode), old process still running afterwards: $(-not $app.HasExited)"
          $line | Add-Content $env:GITHUB_STEP_SUMMARY
          $line
          Get-Process kopercad -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($p.ExitCode -ne 0) { throw "the update over a running copy exited with $($p.ExitCode)" }
          if (-not $app.HasExited) { throw "the update left the old copy running" }

      - uses: actions/upload-artifact@v4
        with:
          name: KoperCAD-windows-installer
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KoperCAD-release-files
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
            dist/BUILD_INFO.txt
            dist/RELEASE-NOTES.md
          if-no-files-found: error

  # Attaches the installer, the portable zip, the build info and the checksums
  # to a GitHub release. Runs for tag pushes and manual starts on a tag (a pull request cannot reach
  # it), has the only write token in this workflow and checks out no code.
  # Tags vX.Y.Z make a pre-release (the beta is not a stable release yet);
  # release candidate tags vX.Y.Z-rcN make a draft pre-release that only
  # people with write access can see until it is published.
  release:
    needs: installer
    # A tag push, or a manual start on a tag (the "Tag a release" workflow).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KoperCAD-release-files
          path: release
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          # PowerShell wrote CRLF line ends; sha256sum would read them as part of the name.
          sed -i 's/\r$//' SHA256SUMS
          sha256sum -c SHA256SUMS
          flags=(--prerelease)
          case "$TAG" in *-rc*) flags+=(--draft) ;; esac
          if [ -f RELEASE-NOTES.md ]; then
            cp RELEASE-NOTES.md notes.md
          else
          cat > notes.md <<'EOF'
          Beta for test users. Windows 10/11 only. No admin rights are needed.

          - `KoperCAD-*-setup.exe`: per-user installer (installs under your profile).
          - `KoperCAD-*-portable.zip`: unzip anywhere and double-click `run.cmd`; includes `kopercad-cli.exe`.
          - `SHA256SUMS`: checksums of the two files above. `BUILD_INFO.txt`: version, commit and build time.

          The program is not code-signed yet, so Windows SmartScreen may warn on first start: choose "More info", then "Run anyway".
          EOF
          fi
          # `gh release view` does not find draft releases by tag, so look in the list.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$TAG"; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber KoperCAD-*-setup.exe KoperCAD-*-portable.zip SHA256SUMS BUILD_INFO.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
              --title "KoperCAD ${TAG#v}" --notes-file notes.md \
              KoperCAD-*-setup.exe KoperCAD-*-portable.zip SHA256SUMS BUILD_INFO.txt
          fi
