name: CI

# Sized for the free Actions allowance (2000 minutes a month on a free
# private repo; Windows minutes count double):
# - Linux fmt, clippy and tests on every pull request and every push to main.
# - Windows (the slow, double-priced one) only on main pushes, a nightly run
#   and manual dispatch, never per pull request. The experimental build is
#   the Windows build of open PRs.
# - A newer push to the same pull request or branch cancels the older run.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token for every job: fork pull requests run this workflow too.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ubuntu-latest
    # The nightly run only checks Windows; Linux was checked on every push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: windows-latest
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Formatting is platform independent and already checked on Linux.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
