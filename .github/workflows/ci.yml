name: CI

# Sized for the free Actions allowance (2000 minutes a month on a free
# private repo; Windows minutes count double):
# - Linux fmt, clippy and tests on every pull request and every push to main,
#   as parallel jobs (lint, workspace tests, three novo-cfd test shards; the
#   shards are skipped on pull requests that cannot affect novo-cfd).
# - Windows (the slow, double-priced one) only on main pushes, a nightly run
#   and manual dispatch, never per pull request. The experimental build is
#   the Windows build of open PRs.
# - A newer push to the same pull request cancels the older run. Runs on main
#   are never cancelled (a merge burst would cancel every Windows test run
#   before it finished); GitHub keeps only the newest waiting run per group, so
#   a burst of merges skips the middle commits and the head is still tested.
# - The nightly Windows run is skipped when main has not moved since the last
#   green CI run.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job: fork pull requests run this workflow too.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic backtraces readable; full debuginfo only costs
  # compile, link and cache time in CI.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Formatting and lints. Fast on a warm cache, and it fails first so a
  # trivial mistake does not wait for the test shards.
  lint:
    name: lint
    # The nightly run only checks Windows; Linux was checked on every push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Which pull request files matter to the slow novo-cfd physics runs (about
  # 10 minutes per shard, three shards). On a pull request they run only when
  # the diff touches novo-cfd or a crate it builds on (cargo tree -p novo-cfd),
  # the lockfile, toolchain or this workflow; main and manual runs always run
  # them, so nothing escapes. Most PRs are UI work and skip 30 runner minutes.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cfd: ${{ steps.diff.outputs.cfd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          cfd=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            cfd=false
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -Eq '^(crates/(novo-cfd|novo-layout|novo-thermal|novo-core|novo-parts|novo-terminals|novo-symbols|novo-tests)/|Cargo\.(toml|lock)$|rust-toolchain|\.github/workflows/ci\.yml$)'; then
              cfd=true
            fi
          fi
          echo "cfd=$cfd" >> "$GITHUB_OUTPUT"
          echo "novo-cfd tests: $cfd" >> "$GITHUB_STEP_SUMMARY"

  # All tests except novo-cfd: unit and integration tests under nextest, doc
  # tests under `cargo test --doc` (nextest does not run those).
  test:
    name: test (workspace)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --exclude novo-cfd --no-fail-fast
      - run: cargo test --workspace --exclude novo-cfd --doc

  # novo-cfd holds the physics validation runs (minutes each), split in three
  # shards cut by test (nextest partitions the list, so a new test is always
  # in exactly one shard). Skipped on pull requests that cannot affect it.
  test-cfd:
    name: test (cfd ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.cfd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run -p novo-cfd --partition count:${{ matrix.shard }}/3 --no-fail-fast
      - if: matrix.shard == 1
        run: cargo test -p novo-cfd --doc

  # One required check for branch protection and the merge leads: green only
  # when lint and every test shard passed.
  linux:
    name: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    needs: [lint, test, test-cfd]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}, cfd: ${{ needs.test-cfd.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ] \
            && { [ "${{ needs.test-cfd.result }}" = success ] || [ "${{ needs.test-cfd.result }}" = skipped ]; }

  # Decides whether the Windows job runs. Pull requests never get one.
  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
            if [ "$last" = "${{ github.sha }}" ]; then
              run=false
              echo "main has not moved since the last green CI run (${last:0:7})." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  windows:
    name: windows-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Formatting is platform independent and already checked on Linux.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
