name: Windows build check

# A Windows check for pull requests that touch the CI file, build inputs or any
# crate source. It runs the same clippy as the Windows job in ci.yml (so a
# Windows-only lint blocks the merge instead of turning main red) and compiles
# and links every test binary, which is where Windows-only failures like the
# LNK1104 on main 125412fa show up. It then runs the tests of the crates the
# pull request changes (the whole workspace, minus novo-cfd, when it changes
# anything outside crates/<name>/, such as Cargo.lock or a workflow), so a
# Windows-only test failure blocks the merge too. Doc tests and the other
# crates' tests still run on main pushes, nightly and manual starts (ci.yml).
# novo-cfd is left out as in ci.yml: its tests take over 35 minutes on Windows.
on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/windows-pr.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
      - ".gitattributes"
      - "crates/**"

concurrency:
  group: windows-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  windows-build:
    name: windows clippy and tests of changed crates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent (the base) give the changed files.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Same command as the Windows job in ci.yml.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Same target selection as the Windows test step in ci.yml.
      - run: cargo test --workspace --exclude novo-cfd --lib --bins --tests --no-run
      - name: Run the tests of the changed crates
        shell: pwsh
        run: |
          $files = git diff --name-only HEAD^1 HEAD
          $crates = @()
          $all = $false
          foreach ($f in $files) {
            if ($f -match '^crates/([^/]+)/') { $crates += $Matches[1] } else { $all = $true }
          }
          $crates = @($crates | Where-Object { $_ -ne 'novo-cfd' } | Sort-Object -Unique)
          if ($all) {
            Write-Host 'Changes outside crates/<name>/: testing the whole workspace (without novo-cfd).'
            cargo test --workspace --exclude novo-cfd --no-fail-fast --lib --bins --tests
          } elseif ($crates.Count -eq 0) {
            Write-Host 'Only novo-cfd changed: its tests run on Linux (ci.yml), not here.'
            exit 0
          } else {
            Write-Host "Testing: $($crates -join ', ')"
            $pkgs = $crates | ForEach-Object { '-p'; $_ }
            cargo test @pkgs --no-fail-fast --lib --bins --tests
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
