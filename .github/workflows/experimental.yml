# Rolling "experimental" Windows build: main plus every open pull request,
# merged in PR order. Published to the `experimental` pre-release, which the
# desktop launcher (scripts/run-latest.ps1) downloads. It is deliberately
# unverified: PRs that conflict are skipped, and if the combined build fails
# the PRs that break it are dropped one by one.
#
# PR code (build scripts, proc macros) runs only in the read-only `build`
# job; the write token exists only in `publish`, which runs no PR code.
name: Experimental build

on:
  # Not per push: a Windows release build costs about 15 billed minutes, so
  # this runs every two hours and builds only when main or an open PR has
  # moved since the published build (see the plan job). workflow_dispatch
  # always builds.
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # listing open PRs needs it; contents alone returns 403

concurrency:
  group: experimental
  # Let a running build finish so busy periods still publish; GitHub keeps
  # only the newest queued run, so the next build picks up everything since.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Speed over the last few percent of runtime: this build is unverified
  # anyway, and thin LTO with one codegen unit roughly doubles link time.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      inputs: ${{ steps.plan.outputs.inputs }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # What the build would contain: main plus every open same-repo PR head,
          # reduced to the top-level entries the binary is built from. Handoff
          # notes and docs, which nearly every push touches, do not change it.
          tree() {
            gh api "repos/$REPO/git/trees/$1" \
              --jq '.tree[] | select(.path | IN("crates", "assets", ".cargo", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml")) | "\(.path):\(.sha)"'
          }
          inputs=$( {
            echo "main"; tree "$(gh api "repos/$REPO/commits/main" --jq .sha)"
            gh api "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == "'"$REPO"'") | "\(.number) \(.head.sha)"' | sort -n |
            while read -r n sha; do echo "pr $n"; tree "$sha"; done
          } | sha256sum | cut -c1-16)
          last=$(gh release download experimental --repo "$REPO" --pattern build-info.json --output - 2>/dev/null | jq -r '.inputs // ""' || true)
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$inputs" != "$last" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since the published build ($inputs)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: experimental

      - name: Merge open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "NovoElectric experimental build"
          git config user.email "noreply@github.com"
          state="$(cygpath -u "$RUNNER_TEMP")/experimental"
          mkdir -p "$state"
          export state
          echo "state=$state" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "${{ github.repository }}") | "\(.number)\t\(.title)"' \
            | sort -n > "$state/prs.tsv"
          # Merges every open PR onto HEAD in PR order. With "check", a PR
          # whose merge stops novo-app from compiling is dropped again, so
          # one broken PR no longer takes every other PR out of the build.
          # Kept outside the work tree so a merge or checkout cannot change
          # it. Build scripts run by `cargo check` could still write here;
          # that is acceptable because this job holds only a read token and
          # builds only same-repository PRs.
          cat > "$state/merge-prs.sh" <<'SCRIPT'
          set -u
          check="${1:-}"
          echo "main $(git rev-parse --short HEAD)" > "$state/merged.txt"
          : > "$state/skipped.txt"
          # The PR list is read on fd 3, so nothing in the loop (git, cargo,
          # build scripts) can consume it through stdin.
          while IFS=$'\t' read -r n title <&3; do
            before=$(git rev-parse HEAD)
            if ! git fetch -q origin "pull/$n/head"; then
              echo "#$n $title (could not fetch the PR head)" >> "$state/skipped.txt"
              continue
            fi
            head=$(git rev-parse --short FETCH_HEAD)
            note=""
            if ! out=$(git merge -q --no-edit FETCH_HEAD 2>&1); then
              unmerged=$(git diff --name-only --diff-filter=U)
              if [ "$unmerged" = "Cargo.lock" ]; then
                # Lock-only clash: keep ours; cargo re-resolves it below or
                # during the build.
                git checkout -q --ours Cargo.lock && git add Cargo.lock
                git commit -q --no-edit
                note=" (Cargo.lock regenerated)"
              else
                # Reset rather than `git merge --abort`: when git refused to
                # start the merge there is nothing to abort.
                git reset -q --hard "$before"
                if [ -n "$unmerged" ]; then
                  echo "#$n $title (merge conflict)" >> "$state/skipped.txt"
                else
                  echo "#$n $title (merge failed: $(echo "$out" | head -n 1))" >> "$state/skipped.txt"
                fi
                continue
              fi
            fi
            if [ "$check" = check ]; then
              if ! cargo check -q -p novo-app < /dev/null; then
                git reset -q --hard "$before"
                git clean -qfd
                echo "#$n $title (does not compile with the PRs before it)" >> "$state/skipped.txt"
                continue
              fi
              # cargo check re-resolves Cargo.lock after a lock-only clash.
              # Commit that as part of this PR's merge result so the next
              # merge starts from a clean tree and sees the resolved lock,
              # and so dropping a later PR (reset to its $before) keeps it.
              if ! git diff --quiet -- Cargo.lock; then
                git commit -q -m "Re-resolve Cargo.lock after merging #$n" -- Cargo.lock
              fi
              # Anything else a build script left behind goes too.
              git reset -q --hard HEAD
              git clean -qfd
            fi
            echo "#$n $head $title$note" >> "$state/merged.txt"
          done 3< "$state/prs.tsv"
          cat "$state/merged.txt" "$state/skipped.txt"
          SCRIPT
          bash "$state/merge-prs.sh"

      - name: Build (main + open PRs)
        id: combined
        continue-on-error: true
        run: cargo build --release -p novo-app

      - name: Drop the PRs that break the build
        if: steps.combined.outcome == 'failure'
        run: |
          git reset -q --hard origin/main
          bash "$state/merge-prs.sh" check
          if ! cargo build --release -p novo-app; then
            git reset -q --hard origin/main
            echo "main $(git rev-parse --short HEAD)" > "$state/merged.txt"
            echo "Release build failed with the remaining PRs; this build is main only." >> "$state/skipped.txt"
            cargo build --release -p novo-app
          fi

      - name: Build canvas stress demo (for the GPU check on real hardware)
        continue-on-error: true
        run: cargo build --release -p novo-canvas --example demo

      - name: Package
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist out
          cp target/release/novoelectric.exe dist/
          if [ -f target/release/examples/demo.exe ]; then cp target/release/examples/demo.exe dist/canvas-demo.exe; fi
          {
            echo "NovoElectric experimental build $stamp"
            echo
            echo "Included:"
            cat "$state/merged.txt"
            if [ -s "$state/skipped.txt" ]; then echo; echo "Skipped:"; cat "$state/skipped.txt"; fi
          } > dist/BUILD_INFO.txt
          cp dist/BUILD_INFO.txt out/
          printf '{"built":"%s","run":"%s","tree":"%s","inputs":"%s"}\n' "$stamp" "${{ github.run_id }}" "$(git rev-parse HEAD)" "${{ needs.plan.outputs.inputs }}" > out/build-info.json
          (cd dist && 7z a -tzip ../out/novoelectric-experimental-windows.zip . > /dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: experimental
          path: out/
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: experimental
          path: out
      - name: Publish to the experimental pre-release
        run: |
          main_sha=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if ! gh release view experimental --repo "$REPO" > /dev/null 2>&1; then
            gh release create experimental --repo "$REPO" --prerelease --target "$main_sha" \
              --title "Experimental (latest, unverified)" --notes "Rolling build of main plus all open pull requests."
          fi
          gh release upload experimental --repo "$REPO" --clobber \
            out/novoelectric-experimental-windows.zip out/build-info.json
          # The tag marks main at build time; build-info.json names the exact merged tree.
          gh release edit experimental --repo "$REPO" --target "$main_sha" --notes-file out/BUILD_INFO.txt
