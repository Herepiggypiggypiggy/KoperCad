# The generic radio panel: drawn by KoperCAD from this data; every button asks the engine.

[[widget]]
kind = "heading"
text = "Radio, 3 motions, 2-step"

[[widget]]
kind = "label"
text = "Generic stand-in, not a specific product. It simulates wiring and logic only: no radio protocol, receiver firmware or contact bounce."
weak = true

[[widget]]
kind = "row"
widgets = [
  { kind = "lamp", id = "main", text = "Main", state = "ok", lit = false },
  { kind = "lamp", id = "estop-ok", text = "E-stop chain", state = "ok", lit = true },
]

[[widget]]
kind = "row"
widgets = [
  { kind = "button", id = "press-estop", text = "E-stop" },
  { kind = "button", id = "reset-estop", text = "Reset E-stop" },
  { kind = "button", id = "tap-stop", text = "Stop" },
  { kind = "button", id = "press-start", text = "Main / start" },
]

[[widget]]
kind = "label"
text = "Hoist select"
weak = true

[[widget]]
kind = "row"
widgets = [
  { kind = "button", id = "set-hoist-sel-main", text = "Main hoist" },
  { kind = "button", id = "set-hoist-sel-mast", text = "Mast hoist" },
]

[[widget]]
kind = "label"
text = "Hoist"
weak = true

[[widget]]
kind = "row"
widgets = [
  { kind = "button", id = "set-hoist-off", text = "Off" },
