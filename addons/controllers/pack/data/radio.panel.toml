# The generic radio panel: drawn by KoperCAD from this data (add-on API 2 widgets); every control
# sends a button id to the engine: set-hoist-up2, set-bridge-fwd1, set-hoist-sel-mast, press-estop...

[[widget]]
kind = "heading"
text = "Radio, 3 motions, 2-step"

[[widget]]
kind = "label"
text = "Generic stand-in, not a specific product. It simulates wiring and logic only: no radio protocol, receiver firmware or contact bounce."
weak = true

[[widget]]
kind = "row"
widgets = [
  { kind = "lamp", id = "main", text = "Main", state = "ok", lit = false },
  { kind = "lamp", id = "estop-ok", text = "E-stop chain", state = "ok", lit = true },
]

[[widget]]
kind = "row"
widgets = [
  { kind = "button", id = "press-estop", text = "E-stop" },
  { kind = "button", id = "reset-estop", text = "Reset E-stop" },
  { kind = "button", id = "tap-stop", text = "Stop" },
  { kind = "button", id = "press-start", text = "Main / start" },
]

[[widget]]
kind = "tabs"
tabs = [
  { id = "motions", text = "Motions", widgets = [
    { kind = "selector", id = "set-hoist-sel", text = "Hoist select", rotary = true, options = [
      { name = "main", text = "Main hoist" },
      { name = "mast", text = "Mast hoist" },
    ] },
    { kind = "separator" },
    { kind = "rocker", id = "set-hoist", text = "Hoist", steps = 2, spring = true, plus = { name = "up", text = "Up" }, minus = { name = "down", text = "Down" } },
    { kind = "row", widgets = [
      { kind = "lamp", id = "h-up-slow", text = "Up slow", state = "ok", lit = false },
      { kind = "lamp", id = "h-up-fast", text = "Up fast", state = "ok", lit = false },
      { kind = "lamp", id = "h-dn-slow", text = "Down slow", state = "ok", lit = false },
      { kind = "lamp", id = "h-dn-fast", text = "Down fast", state = "ok", lit = false },
    ] },
    { kind = "lamp", id = "m-up-slow", text = "Mast hoist up slow", state = "ok", lit = false },
    { kind = "separator" },
    { kind = "rocker", id = "set-bridge", text = "Bridge", steps = 2, spring = true, plus = { name = "fwd", text = "Forward" }, minus = { name = "rev", text = "Reverse" } },
    { kind = "row", widgets = [
      { kind = "lamp", id = "b-fwd-slow", text = "Fwd slow", state = "ok", lit = false },
      { kind = "lamp", id = "b-fwd-fast", text = "Fwd fast", state = "ok", lit = false },
      { kind = "lamp", id = "b-rev-slow", text = "Rev slow", state = "ok", lit = false },
      { kind = "lamp", id = "b-rev-fast", text = "Rev fast", state = "ok", lit = false },
    ] },
    { kind = "separator" },
    { kind = "rocker", id = "set-trolley", text = "Trolley", steps = 2, spring = true, plus = { name = "right", text = "Right" }, minus = { name = "left", text = "Left" } },
    { kind = "row", widgets = [
      { kind = "lamp", id = "t-left-slow", text = "Left slow", state = "ok", lit = false },
      { kind = "lamp", id = "t-left-fast", text = "Left fast", state = "ok", lit = false },
      { kind = "lamp", id = "t-right-slow", text = "Right slow", state = "ok", lit = false },
      { kind = "lamp", id = "t-right-fast", text = "Right fast", state = "ok", lit = false },
    ] },
  ] },
  { id = "keys", text = "Keys", widgets = [
    { kind = "label", text = "Open the Controller card (Simulate > Controller panel) and tick Keyboard to use these keys. Shift picks step 2.", weak = true },
    { kind = "keymap", text = "Keyboard", rows = [
      { key = "Arrows, letters", text = "Hold a rocker (see the Key map of the card)" },
      { key = "Shift", text = "Step 2 (fast)" },
      { key = "Space", text = "Main latch" },
      { key = "X", text = "Press the E-stop" },
      { key = "R", text = "Reset the E-stop" },
    ] },
  ] },
  { id = "table", text = "Contacts", widgets = [
    { kind = "table", text = "Contacts of a 2-step rocker", columns = ["Position", "Slow", "Fast"], rows = [
      ["Off", "open", "open"],
      ["Step 1", "closed", "open"],
      ["Step 2", "closed", "closed"],
    ] },
    { kind = "label", text = "Step 2 keeps the slow contact closed, as on a real two-step switch.", weak = true },
  ] },
]
