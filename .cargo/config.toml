# Link the MSVC C runtime statically so kopercad.exe runs on a clean
# Windows machine without the machine-wide VC++ Redistributable, which a
# standard (non-admin) user cannot install.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
