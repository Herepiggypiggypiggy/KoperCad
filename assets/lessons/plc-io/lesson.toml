# Lesson: PLC cards and I/O (cards, channels, addresses, live view).
# Sample project: a 24 V pump circuit with a start button and a running lamp, plus an analog card whose addresses
# start at byte 4 (project.json); builder and tests: crates/novo-tests/tests/lessons/plc.rs.
# Every step is replayed headless from project.json by crates/novo-app/src/app/lesson_verify_cables.rs (keys,
# palette text, clicks on the drawing and on live badges through the real app). NOTES.md has the verified path
# per step and the remaining GAPs.

format = 1
id = "plc-io"
version = 2
status = "early"
title = "PLC Cards and I/O"
title_nl = "PLC-kaarten en I/O"
summary = "Add a PLC card, send a button and a lamp to it, read the addresses and try both in the live view."
summary_nl = "Voeg een PLC-kaart toe, stuur een knop en een lamp ernaartoe, lees de adressen en probeer beide uit in de live-weergave."
track = "terminals"
order = 60
level = "intermediate"
minutes = 9
topics = ["plc", "io", "simulation"]
needs = []
next = ["drawing-standard"]
project = "project.json"
finished = "finished.json"
page = "Pump control"

[[step]]
id = "goal"
title = "What you will have"
title_nl = "Wat je straks hebt"
text = """
By the end the start button sits on a PLC input and the lamp on a PLC output, and you have read their addresses in the I/O list. The I/O list and the PLC tag export follow the drawing, so nobody types an address twice.
"""
text_nl = """
Straks zit de startknop op een PLC-ingang en de lamp op een PLC-uitgang, en heb je hun adressen in de I/O-lijst gelezen. De I/O-lijst en de export van PLC-tags volgen de tekening, dus niemand typt een adres twee keer.
"""
point = { area = { page = "Pump control", x = 20, y = 24, w = 150, h = 56 } }
note = [
  { at = { device = "-S1" }, text = "Signal in: the start button", text_nl = "Signaal erin: de startknop" },
  { at = { device = "-H1" }, text = "Signal out: the running lamp", text_nl = "Signaal eruit: de looplamp" },
]
pause = true

[[step]]
id = "add-card"
title = "Add a PLC card"
title_nl = "Voeg een PLC-kaart toe"
text = """
A PLC card has channels: DI are digital inputs (signals into the PLC), DQ digital outputs (signals out of it). Adding one with 16 DI and 8 DQ creates the card -A1 next to the analog card -K1. The card itself is not drawn; its channels are, once you send signals to it.
"""
text_nl = """
Een PLC-kaart heeft kanalen: DI zijn digitale ingangen (signalen naar de PLC), DQ digitale uitgangen (signalen uit de PLC). Een kaart met 16 DI en 8 DQ maakt de kaart -A1 naast de analoge kaart -K1. De kaart zelf wordt niet getekend; zijn kanalen wel, zodra je er signalen naartoe stuurt.
"""
how = [
  "Press {key:view.command_palette}",
  "Type **add card DI16 DQ8** and press Enter",
  "The toast reads Added card =A1+CAB-A1",
]
how_nl = [
  "Druk op {key:view.command_palette}",
  "Typ **add card DI16 DQ8** en druk op Enter",
  "De melding zegt Added card =A1+CAB-A1",
]
demo = [
  { press = "view.command_palette" },
  { type = "add card DI16 DQ8" },
  { key = "Enter" },
]
# verified: Ctrl+K keymap.rs:313; verb "add card" (commands.rs:457) -> plc.rs:34 plc_add_card; toast "Added card =A1+CAB-A1 (DI16 DQ8)";
# the tag comes from next_device_tag (-K1 is the analog card, the new card is -A1). Test: plc_io_each_instruction_works_in_the_app.
# GAP: the card is only a device: no card symbol is drawn (plc.md section 4 overview) and the command field offers no
#      chips for the layout, so `DI16 DQ8` is taught in text. Owner: WS-17 / WS-01.
point = { ui = "palette.button" }
expect = { device = { tag = "=A1+CAB-A1" } }
solve = [ { command = "plc.add_card", arg = "DI16 DQ8" } ]

[[step]]
id = "select-button"
title = "Select the start button"
title_nl = "Selecteer de startknop"
text = """
Sending a signal to the PLC works on the selected device, so first select the start button: click its symbol -S1 on the drawing.
"""
text_nl = """
Een signaal naar de PLC sturen werkt op het geselecteerde onderdeel, dus selecteer eerst de startknop: klik op het symbool -S1 op de tekening.
"""
how = [
  "Click the pushbutton symbol -S1 on the drawing; it shows as selected",
]
how_nl = [
  "Klik op het drukknopsymbool -S1 op de tekening; het wordt geselecteerd",
]
# verified: a click on a symbol selects it; plc.to_plc is greyed in the command field until one symbol is selected
# (commands.rs:466 Needs::Selection, plc.rs:72-80).
point = { at = { device = "-S1" } }
expect = { selected = "-S1" }
solve = [ { select = "-S1" } ]

[[step]]
id = "button-to-plc"
title = "Send the button to the PLC"
title_nl = "Stuur de knop naar de PLC"
text = """
The command Send signal to PLC gives a contact the next free DI channel of a card, draws it 50 mm to the right and wires it to the button. Here a digital input box (DI) appears at the right of -S1, joined to the button's free pin.
"""
text_nl = """
De opdracht Send signal to PLC geeft een contact het volgende vrije DI-kanaal van een kaart, tekent het 50 mm naar rechts en verbindt het met de knop. Hier verschijnt rechts van -S1 een digitale-ingangsbox (DI), verbonden met de vrije pin van de knop.
"""
how = [
  "Press {key:view.command_palette}",
  "Type **to plc** and press Enter",
  "A DI box appears 50 mm right of -S1",
]
how_nl = [
  "Druk op {key:view.command_palette}",
  "Typ **to plc** en druk op Enter",
  "Een DI-box verschijnt 50 mm rechts van -S1",
]
demo = [
  { press = "view.command_palette" },
  { type = "to plc" },
  { key = "Enter" },
]
# verified: verb "to plc" (commands.rs:466) -> plc.rs:72-148; a contact gets a DI, the channel lands 50 mm right (plc.rs:16);
# toast "Sent to =A1+CAB-A1: next free DI channel"; the page holds 4 symbols before and 5 after; one undo step.
point = { ui = "palette.button" }
note = [
  { at = { page = "Pump control", x = 90, y = 44 }, text = "The new DI channel", text_nl = "Het nieuwe DI-kanaal" },
]
expect = { count = { kind = "symbol", page = "Pump control", at_least = 5 } }
solve = [ { command = "plc.to_plc" } ]

[[step]]
id = "lamp-to-plc"
title = "Send the lamp to the PLC"
title_nl = "Stuur de lamp naar de PLC"
text = """
Do the same for the lamp: select the lamp symbol -H1, then run Send signal to PLC. A lamp is an output, so it gets the next free DQ channel: a digital output box (DQ) appears at the right of -H1, wired to the lamp.
"""
text_nl = """
Doe hetzelfde voor de lamp: selecteer het lampsymbool -H1 en voer dan Send signal to PLC uit. Een lamp is een uitgang, dus hij krijgt het volgende vrije DQ-kanaal: rechts van -H1 verschijnt een digitale-uitgangsbox (DQ), verbonden met de lamp.
"""
how = [
  "Click the lamp symbol -H1",
  "Press {key:view.command_palette}, type **to plc** and press Enter",
  "A DQ box appears 50 mm right of -H1",
]
how_nl = [
  "Klik op het lampsymbool -H1",
  "Druk op {key:view.command_palette}, typ **to plc** en druk op Enter",
  "Een DQ-box verschijnt 50 mm rechts van -H1",
]
demo = [
  { move = { at = { device = "-H1" } } },
  { click = true },
  { press = "view.command_palette" },
  { type = "to plc" },
  { key = "Enter" },
]
# verified: as select-button and button-to-plc (the lamp's function is signal.lamp.green, which signal_channel_type sends to a DQ); a lamp, horn or coil gets a DQ; page holds 6 symbols after. The app picks the channel, the person
# cannot choose it. Oddity: the wire from the lamp's lower pin retraces 4 mm of the lamp's lead before it turns right.
point = { ui = "palette.button" }
note = [
  { at = { page = "Pump control", x = 170, y = 48 }, text = "The new DQ channel", text_nl = "Het nieuwe DQ-kanaal" },
]
expect = { count = { kind = "symbol", page = "Pump control", at_least = 6 } }
solve = [ { select = "-H1" }, { command = "plc.to_plc" } ]

[[step]]
id = "io-list"
title = "Read the addresses in the I/O list"
title_nl = "Lees de adressen in de I/O-lijst"
text = """
The page I/O list is written from the drawing. Your two channels are among the spare ones: the button on %IX12.0 as a DI of -A1 and the lamp on %QX0.0 as a DQ, each with its signal text and where it is drawn. The addresses are not written next to the channel boxes on the drawing yet; this list is where to read them.
"""
text_nl = """
De pagina I/O list wordt uit de tekening gemaakt. Je twee kanalen staan tussen de reserves: de knop op %IX12.0 als DI van -A1 en de lamp op %QX0.0 als DQ, elk met signaaltekst en waar het getekend is. De adressen staan nog niet naast de kanaalboxen op de tekening; in deze lijst lees je ze.
"""
how = [
  "Press {key:view.command_palette}, type **page 30** and press Enter",
  "Find the rows Pump start button and Pump running lamp",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **page 30** en druk op Enter",
  "Zoek de rijen Pump start button en Pump running lamp",
]
demo = [
  { press = "view.command_palette" },
  { type = "page 30" },
  { key = "Enter" },
]
# verified: "page 30" opens the page named 30 (palette.rs PAGE_WORDS); rows printed by the test (Address, Type, Card, Ch., Pin,
# Signal, Terminal, Connected to, Drawn at): %IX12.0 DI =A1+CAB-A1 0 "Pump start button" =A1+CAB-S1:14; %QX0.0 DQ ... "Pump running lamp" =A1+CAB-H1:X2.
# GAP: channel symbols carry no address or signal text on the drawing; the Devices drawer does not expand a card into channels;
#      the inspector shows only the card's properties; `plc.signal` (typing a different signal text) has no editor.
# Oddity: the I/O list page is added when a project opens; a project that gets its first card in a session shows it after reopening.
point = { ui = "palette.button" }
expect = { page = "I/O list" }
solve = [ { page = "I/O list" } ]

[[step]]
id = "renumber"
title = "Close the gap in the addresses"
title_nl = "Sluit het gat in de adressen"
text = """
The analog card starts at byte 4 and -A1 at byte 12, so bytes 0 to 3 and 5 to 11 are wasted. Renumber I/O previews every card start address that moves (-K1 %I4 to %I0, -A1 %I12 to %I8); Enter applies it, Esc cancels. Afterwards the button reads %IX8.0.
"""
text_nl = """
De analoge kaart begint op byte 4 en -A1 op byte 12, dus de bytes 0 tot 3 en 5 tot 11 gaan verloren. Renumber I/O toont vooraf elk startadres dat verschuift (-K1 %I4 naar %I0, -A1 %I12 naar %I8); Enter past toe, Esc annuleert. Daarna staat de knop op %IX8.0.
"""
how = [
  "Press {key:view.command_palette}, type **renumber io** and press Enter",
  "Read the preview: -K1 %I4 to %I0, -A1 %I12 to %I8",
  "Press Enter (or click **Renumber (Enter)**); Esc cancels",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **renumber io** en druk op Enter",
  "Lees de voorvertoning: -K1 %I4 naar %I0, -A1 %I12 naar %I8",
  "Druk op Enter (of klik op **Renumber (Enter)**); Esc annuleert",
]
demo = [
  { press = "view.command_palette" },
  { type = "renumber io" },
  { key = "Enter" },
  { say = "Enter applies, Esc cancels", say_nl = "Enter past toe, Esc annuleert" },
  { key = "Enter" },
]
# verified: verb "renumber io" (commands.rs:588) -> plc.rs:155 plc_renumber_io -> dialog "Renumber I/O" with buttons "Renumber (Enter)" and
# "Cancel (Esc)" (plc.rs:190); Enter applies in one undo step, toast "Renumbered I/O: 2 start address(es) moved".
# The field check `equals` exists in novo-learn check.rs FieldCheck.
point = { ui = "palette.button" }
expect = { field = { device = "=A1+CAB-A1", name = "plc.start.i", equals = 8 } }
solve = [ { command = "plc.renumber_io" }, { key = "Enter" } ]

[[step]]
id = "back-to-drawing"
title = "Go back to the drawing"
title_nl = "Ga terug naar de tekening"
text = """
The live view works on a drawing page: open page 1, Pump control.
"""
text_nl = """
De live-weergave werkt op een tekeningpagina: open pagina 1, Pump control.
"""
how = [
  "Press {key:view.command_palette}, type **page 1** and press Enter",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **page 1** en druk op Enter",
]
demo = [
  { press = "view.command_palette" },
  { type = "page 1" },
  { key = "Enter" },
]
# verified: "page 1" opens page 1 (palette.rs page_query).
point = { ui = "palette.button" }
expect = { page = "Pump control" }
solve = [ { page = "Pump control" } ]

[[step]]
id = "live-on"
title = "Turn on the live view"
title_nl = "Zet de live-weergave aan"
text = """
Live potentials colours every wire by what it carries right now. Everything starts switched off: contacts are open and the PLC outputs are off. A card at the top left of the drawing says so.
"""
text_nl = """
Live potentials kleurt elke draad naar wat hij nu voert. Alles begint uitgeschakeld: contacten zijn open en de PLC-uitgangen staan uit. Linksboven op de tekening zegt een kaart dat.
"""
how = [
  "Move the pointer over the drawing",
  "Press {key:sim.live}; a card Live potentials appears at the top left",
]
how_nl = [
  "Beweeg de aanwijzer over de tekening",
  "Druk op {key:sim.live}; linksboven verschijnt de kaart Live potentials",
]
demo = [
  { press = "sim.live" },
]
# verified: keymap.rs:373 Shift+L (Canvas) -> sim.live; toggle_live live.rs:449; card "Live potentials" with "Reset" and "PLC program…" live.rs:875-905.
expect = { live = true }
solve = [ { command = "sim.live" } ]

[[step]]
id = "press-button"
title = "Press the start button"
title_nl = "Druk op de startknop"
text = """
In the live view every switch shows a small round badge between its two pins. Press and hold the mouse button on the badge of -S1: a pushbutton is closed only while you hold it, so the wire lights up and the dot on the DI box fills as long as you keep holding. Let go and it springs back.
"""
text_nl = """
In de live-weergave toont elke schakelaar een klein rond knopje tussen zijn twee pinnen. Houd de muisknop ingedrukt op het knopje van -S1: een drukknop is alleen gesloten zolang je hem vasthoudt, dus de draad licht op en de stip op de DI-box wordt gevuld zolang je blijft drukken. Laat los en hij veert terug.
"""
how = [
  "Press and hold the mouse button on the round badge halfway between the two pins of -S1",
  "While you hold, the wire lights up and the dot on the DI box fills",
]
how_nl = [
  "Houd de muisknop ingedrukt op het ronde knopje halverwege de twee pinnen van -S1",
  "Zolang je vasthoudt licht de draad op en wordt de stip op de DI-box gevuld",
]
demo = [
  { move = { at = { page = "Pump control", x = 48, y = 44 } } },
  { click = true },
]
# verified: pole badge at the middle of the pass-through pins (live.rs:262-290; (48,44) here), click flips the pole (live.rs ~900).
# Test: the click at the badge's world position closes the pole (PoleState) and `pole_closed` holds.
point = { at = { page = "Pump control", x = 48, y = 44 } }
note = [
  { at = { page = "Pump control", x = 90, y = 44 }, text = "Dot filled: the input sees 24 V", text_nl = "Stip gevuld: de ingang ziet 24 V" },
]
expect = { pole_closed = "-S1" }
solve = [ { live_pole = { device = "-S1" } } ]

[[step]]
id = "switch-output"
title = "Switch the output on"
title_nl = "Schakel de uitgang in"
text = """
There is no PLC program here: you are the program. A PLC output box shows a small square badge above its pin. Click it on the DQ box: the output puts 24 V on the lamp and -H1 lights. Reset on the card switches everything off again.
"""
text_nl = """
Er is hier geen PLC-programma: jij bent het programma. Een PLC-uitgangsbox toont een klein vierkant knopje boven zijn pin. Klik erop bij de DQ-box: de uitgang zet 24 V op de lamp en -H1 brandt. Met Reset op de kaart zet je alles weer uit.
"""
how = [
  "Click the square badge just above the pin of the DQ box",
  "The lamp -H1 lights; **Reset** on the card switches everything off again",
]
how_nl = [
  "Klik op het vierkante knopje net boven de pin van de DQ-box",
  "De lamp -H1 brandt; **Reset** op de kaart zet alles weer uit",
]
demo = [
  { move = { at = { page = "Pump control", x = 170, y = 51 } } },
  { click = true },
]
# verified: output badge 5 mm above the box's pin (live.rs:311-336; (170,51) here); click toggles `forced`; novo-sim puts 24 V on the pin.
# The live card also has a button "PLC program…" that runs a ladder or Structured Text program on these channels (live.rs ~790).
point = { at = { page = "Pump control", x = 170, y = 51 } }
note = [
  { at = { device = "-H1" }, text = "The lamp lights", text_nl = "De lamp brandt" },
]
expect = { lit = "-H1:X2" }
solve = [ { live_coil = { device = "=A1+CAB-A1", output = true } } ]

[[step]]
id = "done"
title = "From signal to address and back"
title_nl = "Van signaal naar adres en terug"
text = """
You added a card, sent a button and a lamp to it, read the addresses and tried both live. Use **Open finished version** to compare: it shows the same drawing with the I/O renumbered. The live card's **PLC program…** button can run a program on these channels instead of you.
"""
text_nl = """
Je hebt een kaart toegevoegd, een knop en een lamp erheen gestuurd, de adressen gelezen en beide live geprobeerd. Gebruik **Open finished version** om te vergelijken: dezelfde tekening met de I/O hernummerd. De knop **PLC program…** op de live-kaart kan een programma op deze kanalen laten draaien in plaats van jou.
"""
pause = true
