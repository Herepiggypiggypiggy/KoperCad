# Learning paths: a reading order across the tracks for one kind of person.
# A path is only a list; progress comes from the lessons themselves.
# Lessons that are drafts are left out of a path until they are shown.
# The plan behind the paths is docs/design/lesson-plan.md.

[[path]]
id = "first-hour"
title = "First hour"
title_nl = "Eerste uur"
summary = "Anyone new: place parts, wire them, give them a supply, draw a motor starter, follow its contacts, watch it run."
summary_nl = "Voor wie nieuw is: onderdelen plaatsen, bedraden, voeden, een motorstarter tekenen, contacten volgen, laten draaien."
lessons = ["placing-parts", "wiring-modes", "potentials", "motor-starter", "cross-references", "live-view", "predict-the-starter", "coil-wont-pull-in", "motor-wont-hold", "motor-wont-stop", "time-savers", "your-project-file", "tags-and-pages"]

[[path]]
id = "draftsperson"
title = "Draftsperson"
title_nl = "Tekenaar"
summary = "Draws the schematics: after the first hour, terminals, signals across pages, cables, wire numbers, checks, blocks."
summary_nl = "Tekent de schema's: na het eerste uur klemmen, signalen over pagina's, kabels, draadnummers, controles, blokken."
lessons = ["terminal-strips", "terminals-in-depth", "connection-screens", "interruption-points", "cables-and-shields", "wire-numbers", "autopilot-wires", "design-checks", "drawing-standard", "blocks-and-macros"]

[[path]]
id = "panel-builder"
title = "Panel builder"
title_nl = "Kastenbouwer"
summary = "Builds the cabinet: layout, rails and ducts, routing, cut lengths, plate drawing, labels, heat, 3D, PLC and commissioning."
summary_nl = "Bouwt de kast: indeling, rails en kanalen, routing, snijlengtes, plaattekening, labels, warmte, 3D, PLC en inbedrijfstelling."
lessons = ["cabinet-layout", "rails-and-ducts", "wire-routing", "cut-lengths", "enclosure-door-and-depth", "panel-plate-drawing", "panel-labels", "workshop-pack", "build-mode", "heat-and-sizing", "view-3d", "editing-in-3d", "plc-io", "commissioning"]

[[path]]
id = "project-lead"
title = "Project lead"
title_nl = "Projectleider"
summary = "Issues and hands over: generated pages, wire list and parts list, revisions, PDF, parts library, spreadsheets, DXF."
summary_nl = "Geeft uit en draagt over: gegenereerde pagina's, draadlijst en stuklijst, revisies, PDF, onderdelenbibliotheek, spreadsheets, DXF."
lessons = ["generated-pages", "wire-list-and-bom", "revisions-and-compare", "pdf-export", "parts-library", "spreadsheets", "dxf-and-backgrounds", "protection-and-single-line", "standards-check", "safety-functions", "handover-package"]

[[path]]
id = "machine-builder"
title = "From loops to a machine"
title_nl = "Van lus tot machine"
summary = "After the first hour: real machine circuits, one step harder each time, each one a circuit you trace, break and repair."
summary_nl = "Na het eerste uur: echte machineschema's, steeds een stap moeilijker, elk een schema dat je volgt, stuk maakt en repareert."
lessons = ["reversing-starter", "star-delta-starter", "safety-circuit", "crane-hoist", "conveyor-line"]
