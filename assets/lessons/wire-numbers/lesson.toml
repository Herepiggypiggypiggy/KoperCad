# Lesson: wire numbers and the wire list. Builder and tests: crates/novo-tests/tests/lessons/cables.rs
# Every step is replayed headless from project.json by crates/novo-app/src/app/lesson_verify_cables.rs
# (keys, palette text and clicks through the real app). NOTES.md has the verified path per step, the
# remaining GAPs and the "Pending how" lists (the `how` / `how_nl` fields are not in the parser yet).
# What exists now (docs/design/wire-numbering.md, crates/novo-numbering): a numbering scheme stored in the project,
# "Number wires" (fills what has none, keeps unique numbers, fixes duplicates), the Wire numbering window with a
# preview, "Renumber wires" (starts over, typed numbers stay) and "Number wire <text>" (types and locks one).
format = 1
id = "wire-numbers"
version = 2
status = "early"   # GAPs: no way to give an unnumbered wire its first number, no numbering rule, no renumber
title = "Wire Numbers and the Wire List"
title_nl = "Draadnummers en de draadlijst"
summary = "Number every wire of a drawing in one command, keep a number you typed yourself, and read the numbers in the wire list and on the cable cores."
summary_nl = "Geef elke draad van een tekening met een opdracht een nummer, houd een nummer dat je zelf typte vast en lees de nummers in de draadlijst en op de kabeladers."
track = "terminals"
order = 50
level = "intermediate"
minutes = 8
topics = ["wire numbers", "wire list", "potentials"]
needs = ["cables-and-shields"]
next = ["generated-pages"]
project = "project.json"
finished = "finished.json"
page = "Pump station"

[[step]]
id = "intro"
title = "Names and numbers of wires"
title_nl = "Namen en nummers van draden"
text = """
A wire has two names. Its {tip:potential} (L1, +24 V) comes from the net. Its {tip:wire-number} is what the wire list and the labels print.
The pump station has three motor wires numbered by hand (1, 2, 2: a typo) and the rest unnumbered. At the end every wire has one number and a duplicate is gone.
"""
text_nl = """
Een draad heeft twee namen. Zijn {tip:potential} (L1, +24 V) komt van het net. Zijn {tip:wire-number} staat in de draadlijst en op de labels.
Het pompstation heeft drie motordraden met de hand genummerd (1, 2, 2: een typfout) en de rest zonder nummer. Aan het eind heeft elke draad een nummer en is het dubbele nummer weg.
"""
pause = true

[[step]]
id = "open-wire-list"
title = "Open the wire list"
title_nl = "Open de draadlijst"
text = """
The wire list is written from the drawing and always current. Opening it shows the Reports view with one row per connection and a column **Wire no.**
"""
text_nl = """
De draadlijst wordt uit de tekening gemaakt en is altijd actueel. Openen toont het Reports-venster met een rij per verbinding en een kolom **Wire no.**
"""
# verified: command report.wires (commands.rs:1139 verb "wire list"), Ctrl+K opens the field (keymap.rs:313),
# show_report reports_view.rs:80. Test: wire_numbers_each_instruction_works_in_the_app.
point = { ui = "palette.button" }
expect = { command = "report.wires" }
solve = [ { command = "report.wires" } ]

[[step]]
id = "read-list"
title = "Read the Wire no. column"
title_nl = "Lees de kolom Wire no."
text = """
Only the three motor connections have a number: 1, 2 and 2 again, two different wires with the same number. All other rows are empty. **Potential** is what the net carries; **Cable** is the cable and core of each wire.
"""
text_nl = """
Alleen de drie motorverbindingen hebben een nummer: 1, 2 en nogmaals 2, twee verschillende draden met hetzelfde nummer. Alle andere rijen zijn leeg. **Potential** is wat het net voert; **Cable** is de kabel en ader van elke draad.
"""
# verified: wires.rs:191-206 columns "Wire no.", "From", "To", "Potential", "Colour", "mm²", "Cable", ...
# Test reads the report: rows 1, 2, 2 and seven empty.
pause = true

[[step]]
id = "back-to-drawing"
title = "Back to the drawing"
title_nl = "Terug naar de tekening"
text = """
Numbering works on the drawing: switch back to the Schematic view.
"""
text_nl = """
Nummeren doe je op de tekening: schakel terug naar het venster Schematic.
"""
# verified: keymap.rs:389 Ctrl+1 (Anywhere) -> view.schematic (workspace.rs:64).
expect = { command = "view.schematic" }
solve = [ { command = "view.schematic" } ]

[[step]]
id = "preview"
title = "Preview what numbering would do"
title_nl = "Bekijk wat nummeren zou doen"
text = """
The Wire numbering window shows the scheme (Sequential: 1, 2, 3...) and a preview of every change before anything is written. The second 2 becomes 7 and every unnumbered net gets the next free number. Close the window; nothing changed yet.
"""
text_nl = """
Het venster Wire numbering toont het schema (Sequential: 1, 2, 3...) en een voorvertoning van elke wijziging voordat er iets wordt geschreven. De tweede 2 wordt 7 en elk net zonder nummer krijgt het volgende vrije nummer. Sluit het venster; er is nog niets veranderd.
"""
# verified: commands.rs:681 verb "wire numbering" -> workbench.rs:657 open_numbering(Fill, Preview); window
# numbering.rs:178 (scheme, modes, scope, Preview and Conflicts tabs, Number button, "Close window").
# Test: the plan of that window is 6 numbered, 1 renumbered (2 -> 7), 2 settled.
point = { ui = "palette.button" }
expect = { command = "wires.numbering" }
pause = true
solve = [ { command = "wires.numbering" } ]

[[step]]
id = "number-wires"
title = "Number all wires"
title_nl = "Nummer alle draden"
text = """
Number wires gives every net without a number the next free one, keeps the numbers that are unique (1 and the first 2) and fixes the duplicate. One undo step; the toast reads "6 numbered, 1 renumbered, 2 settled".
"""
text_nl = """
Number wires geeft elk net zonder nummer het volgende vrije nummer, houdt de nummers die uniek zijn (1 en de eerste 2) en herstelt het dubbele nummer. Een undo-stap; de melding zegt "6 numbered, 1 renumbered, 2 settled".
"""
# verified: commands.rs:672 "wires.number" ("Number wires"), workbench.rs:656 -> numbering.rs:75 number_wires:
# plan Mode::Fill over the project, one undo step "Number wires".
point = { ui = "palette.button" }
expect = { command = "wires.number" }
solve = [ { command = "wires.number" } ]
# GAP: no check kind reads a wire's number; the command is checked, the test asserts every wire has a number.

[[step]]
id = "type-number"
title = "Type a number yourself"
title_nl = "Typ zelf een nummer"
text = """
Click the wire from terminal 4 to the transmitter to select it, then run **number wire 100** from the command field. The whole net takes 100 and numbering runs leave it alone from now on.
"""
text_nl = """
Klik op de draad van klem 4 naar de zender om hem te selecteren en voer dan **number wire 100** uit in het opdrachtveld. Het hele net krijgt 100 en nummerrondes laten het voortaan met rust.
"""
# verified: commands.rs:706 verb "number wire" (wires.set_number, Needs::Selection) -> numbering.rs:92
# set_wire_number: novo_numbering::set_number types the number on the net and locks it; toast
# "Wire number 100 is fixed: numbering runs leave it alone".
point = { at = { wire = ["-X1:4", "-B1:+"] } }
expect = { command = "wires.set_number" }
# GAP solve: a click on a wire; the replay selects the transmitter terminal instead (select supports devices only)
solve = [ { select = "-B1" }, { command = "wires.set_number", arg = "100" } ]

[[step]]
id = "renumber"
title = "Start over, keeping what you typed"
title_nl = "Begin opnieuw en behoud wat je typte"
text = """
Renumber wires opens the window in Renumber mode: it numbers all wires again in reading order, but 100 stays. Click **Project** under Wires and then **Renumber**; the toast reads "8 renumbered, 1 unchanged".
"""
text_nl = """
Renumber wires opent het venster in de stand Renumber: het nummert alle draden opnieuw in leesvolgorde, maar 100 blijft. Klik onder Wires op **Project** en dan op **Renumber**; de melding zegt "8 renumbered, 1 unchanged".
"""
# verified: commands.rs:691 verb "renumber wires" -> workbench.rs:660 open_numbering(Renumber, Preview); with a
# wire selected the window opens on "Selection", hence the click on "Project" (numbering.rs:45-47, :233-246).
# Test: the click on Renumber applies one undo step; 8 renumbered, the typed net keeps 100.
point = { ui = "palette.button" }
expect = { command = "wires.renumber" }
pause = true
solve = [ { command = "wires.renumber" } ]
# GAP: the command check ticks when the window opens, before Renumber is clicked; solve cannot click a window
#      button (wanted: solve `numbering = "renumber"` and a check `wire_number`).

[[step]]
id = "wire-list-again"
title = "See the numbers in the wire list"
title_nl = "Zie de nummers in de draadlijst"
text = """
Open the wire list again. Every row has a number now, 100 on the level loop and no number twice on different nets.
"""
text_nl = """
Open de draadlijst opnieuw. Elke rij heeft nu een nummer, 100 op de niveaulus en geen nummer dubbel op verschillende netten.
"""
# verified: report.wires again; the list is live (reports.rs reports_heard). Test reads the report.
point = { ui = "palette.button" }
expect = { command = "report.wires" }
solve = [ { command = "report.wires" } ]

[[step]]
id = "cable-diagram"
title = "Find the numbers on the cable cores"
title_nl = "Vind de nummers op de kabeladers"
text = """
The cable diagram lists each core of -W2 with its wire number and potential, so the workshop can tag both ends of a core with the same number.
"""
text_nl = """
Het kabeldiagram toont elke ader van -W2 met haar draadnummer en potentiaal, zodat de werkplaats beide einden van een ader met hetzelfde nummer kan labelen.
"""
# verified: commands.rs:1148 verb "cable diagram" (report.cables); novo-reports diagrams.rs sections per cable with
# columns Core, mm², Wire no., Potential, From, Cabinet end, To, Field end, Note.
point = { ui = "palette.button" }
expect = { command = "report.cables" }
solve = [ { command = "report.cables" } ]

[[step]]
id = "done"
title = "Names and numbers"
title_nl = "Namen en nummers"
text = """
The potential follows the net; the number is yours to fill, fix or type. Use **Open finished version** to compare: it has the same drawing numbered 1 to 8 with 100 on the level loop.
"""
text_nl = """
De potentiaal volgt het net; het nummer vul, herstel of typ je zelf. Gebruik **Open finished version** om te vergelijken: dezelfde tekening genummerd 1 tot 8 met 100 op de niveaulus.
"""
pause = true
