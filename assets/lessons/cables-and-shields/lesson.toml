# Lesson: cables and shields. Builder and tests: crates/novo-tests/tests/lessons/cables.rs
# Every step is replayed headless from project.json by crates/novo-app/src/app/lesson_verify_cables.rs
# (keys, palette and clicks through the real app). NOTES.md has the verified path per step, the
# remaining GAPs and the "Pending how" lists (the `how` / `how_nl` fields are not in the parser yet).
format = 1
id = "cables-and-shields"
version = 2
status = "early"   # GAPs below: no screen control yet for a cable's part, length and shield
title = "Cables and Shields"
title_nl = "Kabels en schermen"
summary = "Turn the wires that leave the cabinet into cables, read their cores, and learn what the program can and cannot yet store on a cable."
summary_nl = "Maak van de draden die de kast verlaten kabels, lees de aders en leer wat het programma al wel en nog niet op een kabel kan vastleggen."
track = "terminals"
order = 40
level = "intermediate"
minutes = 8
topics = ["cables", "terminals", "shield"]
needs = ["terminal-strips"]
next = ["wire-numbers"]
project = "project.json"
finished = "finished.json"
page = "Pump station"

[[step]]
id = "intro"
title = "Cables for the pump station"
title_nl = "Kabels voor het pompstation"
text = """
The pump motor and the level transmitter sit in the field (+FLD); their wires run from the terminal strip in the cabinet (+CAB). No cable exists yet.
At the end both have a cable with every {tip:core} assigned, so the cable list, wire list and bill of materials all agree.
"""
text_nl = """
De pompmotor en de niveauzender staan in het veld (+FLD); hun draden lopen van de klemmenstrook in de kast (+CAB). Er bestaat nog geen kabel.
Aan het eind hebben beide een kabel met alle {tip:core}-en toegewezen, zodat kabellijst, draadlijst en stuklijst overeenkomen.
"""
pause = true

[[step]]
id = "open-drawer"
title = "Open the Cables drawer"
title_nl = "Open de lade Cables"
text = """
The Cables drawer under the drawing lists every cable with its cores, and counts the cables the program proposes.
Opening it shows the tab **Cables** and the button **Accept 2 proposed**.
"""
text_nl = """
De lade Cables onder de tekening toont elke kabel met zijn aders en telt de kabels die het programma voorstelt.
Na het openen zie je het tabblad **Cables** en de knop **Accept 2 proposed**.
"""
# verified: keymap.rs:392 Ctrl+4 (Anywhere) -> view.cables_drawer; workbench.rs:670 toggles the drawer;
# tabs and the button drawers.rs:62, :76. Test: open_the_drawer (key chord Ctrl+4, drawer = Cables).
# `opened = "drawer.cables"` is not an anchor in learn.rs ANCHORS, so the check is the command.
expect = { command = "view.cables_drawer" }
solve = [ { command = "view.cables_drawer" } ]

[[step]]
id = "read-proposals"
title = "Read the proposals"
title_nl = "Lees de voorstellen"
text = """
A wire that leaves one {tip:location} for another is proposed as part of a cable. Here that gives two proposals: one for the motor (four wires) and one for the level transmitter (two wires).
Proposals are only counted in the drawer; nothing is drawn on the page for them.
"""
text_nl = """
Een draad die van de ene {tip:location} naar de andere gaat, wordt voorgesteld als onderdeel van een kabel. Hier zijn dat twee voorstellen: een voor de motor (vier draden) en een voor de niveauzender (twee draden).
Voorstellen worden alleen in de lade geteld; op de pagina wordt er niets voor getekend.
"""
# verified: drawers.rs:51 counts novo_cables::propose_cables (2 here: test read_the_proposals);
# the empty-state text is drawers.rs:185-190.
# GAP: cable proposals are not drawn on the canvas and have no command id or key (Enter accepts only terminal
#      proposals); the drawer button is the only way to accept all. Declining one has no control either.
pause = true

[[step]]
id = "cable-tool"
title = "Pick the Cable tool"
title_nl = "Kies het gereedschap Kabel"
text = """
To decide yourself which wires share a cable, take the Cable tool: you draw a line across the wires that belong together. Start with the two wires of the level transmitter, below terminals 4 and 5.
"""
text_nl = """
Wil je zelf bepalen welke draden een kabel delen, kies dan het gereedschap Kabel: je trekt een lijn over de draden die bij elkaar horen. Begin met de twee draden van de niveauzender, onder klem 4 en 5.
"""
# verified: keymap.rs:348 C (Canvas) -> tool.cable; workbench.rs:601 begin_cable (tool.rs:696). The dock has
# no Cable button (dock.rs maps it to Select), so the key or Ctrl+K "cable" is the way.
point = { area = { page = "Pump station", x = 80, y = 104, w = 24, h = 24 } }
expect = { tool = "cable" }
solve = [ { command = "tool.cable" } ]

[[step]]
id = "draw-line"
title = "Draw the line across both wires"
title_nl = "Trek de lijn over beide draden"
text = """
Click on the empty page left of the first transmitter wire, then right of the second wire, and finish the line. Both wires become one 3-core cable, -W1; its third core stays free.
"""
text_nl = """
Klik op de lege pagina links van de eerste draad van de niveauzender en dan rechts van de tweede draad, en rond de lijn af. Beide draden worden een kabel met 3 aders, -W1; de derde ader blijft vrij.
"""
# verified: tool.rs:1109-1121 (clicked points), tool.rs:1904 EditorKey::Finish = Enter (keymap.rs:370
# proposal.accept), tool.rs:1730 finish_cable, app.rs:973 -> drawers.rs:128 make_cable: one undo step "Draw cable",
# toast "Cable =P1-W1: 3x1.5 on 2 wires". Test: draw_the_transmitter_cable.
point = { area = { page = "Pump station", x = 80, y = 104, w = 24, h = 24 } }
expect = { cable = { name = "-W1", cores_at_least = 3 } }
solve = [ { cable = { name = "-W1", wires = [["-X1:4", "-B1:+"], ["-X1:5", "-B1:-"]] } } ]

[[step]]
id = "accept"
title = "Accept the motor cable"
title_nl = "Neem de motorkabel over"
text = """
One proposal is left, for the motor. Accepting it turns the four motor wires into the cable -W2 with one core per wire; the drawer now lists two cables.
"""
text_nl = """
Er blijft een voorstel over, voor de motor. Overnemen maakt van de vier motordraden de kabel -W2 met een ader per draad; de lade toont nu twee kabels.
"""
# verified: drawers.rs:76 button "Accept {n} proposed" -> accept_cable_proposals drawers.rs:153 (one undo step
# "Accept cables", toast "Accepted 1 cable: =P1-W2 4G1.5"). Test: accept_the_motor_cable (click by label).
# GAP: no command id and no key for "accept cable proposals"; only the drawer button.
expect = { cable = { name = "-W2", cores_at_least = 4 } }
# GAP solve: a drawer button click; the `cable` solve makes the same cable through the engine.
solve = [ { cable = { name = "-W2", wires = [["-X1:1", "-M1:U1"], ["-X1:2", "-M1:V1"], ["-X1:3", "-M1:W1"], ["-X1:PE", "-M1:PE"]] } } ]

[[step]]
id = "read-cores"
title = "Read the cores of the motor cable"
title_nl = "Lees de aders van de motorkabel"
text = """
The right half of the drawer lists the cores (the separate insulated wires) of the picked cable. The columns headed +CAB and +FLD show where each core connects at the cabinet end and at the field end.
In -W2 brown (BN), black (BK) and grey (GY) carry L1, L2 and L3 to U1, V1 and W1; the green-yellow core (GNYE) always carries PE.
"""
text_nl = """
De rechterhelft van de lade toont de aders (de afzonderlijk geïsoleerde draden) van de gekozen kabel. De kolommen +CAB en +FLD tonen waar elke ader aan de kastzijde en aan de veldzijde is aangesloten.
In -W2 voeren bruin (BN), zwart (BK) en grijs (GY) L1, L2 en L3 naar U1, V1 en W1; de groen-gele ader (GNYE) voert altijd PE.
"""
# verified: drawers.rs:224-262 columns Core, From (+CAB), To (+FLD), Potential; core names and potentials as
# printed by the test read_the_cores (W2: BN L1, BK L2, GY L3, GNYE PE).
pause = true

[[step]]
id = "free-core"
title = "See the free core of the transmitter cable"
title_nl = "Zie de vrije ader van de zenderkabel"
text = """
Click -W1 in the cable list on the left. Its Cores column reads 2 of 3: the third core has no wire yet, a free core kept for a later addition.
"""
text_nl = """
Klik links in de kabellijst op -W1. De kolom Cores toont 2 of 3: de derde ader heeft nog geen draad, een vrije ader voor later.
"""
# verified: drawers.rs:198-222 (list; click on the tag = ShowCable), "{used} of {cores}" drawers.rs:214.
# Test: read_the_cores clicks the label and checks drawer_cable and the 2 of 3 count.
# GAP solve: no click operation; a reading step.
pause = true

[[step]]
id = "part-length-shield"
title = "What a cable can carry that you cannot set yet"
title_nl = "Wat een kabel kan dragen maar je nog niet kunt instellen"
text = """
A cable can hold a part (for example a Lapp ÖLFLEX 4G1,5), a length and a {tip:shield} connected to PE; the wire list and bill of materials would use them. The program has no screen control for the part or the shield yet, so those wait. The length can come in through the Cables sheet of the Excel round trip.
"""
text_nl = """
Een kabel kan een artikel dragen (bijvoorbeeld een Lapp ÖLFLEX 4G1,5), een lengte en een {tip:shield} dat op PE is aangesloten; draadlijst en stuklijst zouden ze gebruiken. Voor artikel en scherm is er nog geen bediening in het programma, dus die wachten. De lengte kan via het blad Cables van de Excel-rondgang binnenkomen.
"""
# GAP: no screen control sets a cable's part, type or shield. Engine: novo_parts::assign_cable_part,
#      novo_cables::add_shield / connect_shield (edit.rs). Inspector knows devices only; the drawer is read-only;
#      accept_proposals gets no catalog (drawers.rs:163). Check kinds wished for: `field` on a cable (part, length),
#      `cable` with shield_connected; solve ops `cable_part`, `cable_shield`.
# verified: novo-interop sheets/fields.rs:210-214 the Cables sheet has "Length [m]" (read 395, written 588).
pause = true

[[step]]
id = "done"
title = "That is a cable plan"
title_nl = "Dat is een kabelplan"
text = """
The two field wire groups are now cables -W1 (3 cores, one free) and -W2 (4 cores, PE on GNYE). Use **Open finished version** to compare: it also shows a part, a length and a shield, which the engine can store but the screen cannot set yet.
"""
text_nl = """
De twee groepen veldbedrading zijn nu kabels -W1 (3 aders, een vrij) en -W2 (4 aders, PE op GNYE). Gebruik **Open finished version** om te vergelijken: daar staan ook een artikel, een lengte en een scherm bij, die de motor wel kan opslaan maar het scherm nog niet kan instellen.
"""
pause = true
