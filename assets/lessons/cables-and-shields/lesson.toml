# Lesson: cables and shields. Builder and tests: crates/novo-tests/tests/lessons/cables.rs
# Verified against the app code on this branch; see NOTES.md for the table of file:line.
format = 1
id = "cables-and-shields"
version = 1
status = "draft"   # GAPs below: no screen control yet for a cable's part, length and shield
title = "Cables and Shields"
title_nl = "Kabels en schermen"
summary = "Turn the wires that leave the cabinet into cables, read their cores, and see where a part and a shield go."
summary_nl = "Maak van de draden die de kast verlaten kabels, lees de aders en zie waar een artikel en een scherm komen."
track = "terminals"
order = 40
level = "intermediate"
minutes = 8
topics = ["cables", "terminals", "shield"]
needs = ["terminal-strips"]
next = ["wire-numbers"]
project = "project.json"
page = "Pump station"

[[step]]
id = "intro"
title = "Cables for the pump station"
title_nl = "Kabels voor het pompstation"
text = """
At the end, the pump motor and the level transmitter each have a cable with every {tip:core} assigned.
The drawing is a pump station: wires run from the cabinet (+CAB) to the field (+FLD), and no cable exists yet.
"""
text_nl = """
Aan het eind hebben de pompmotor en de niveauzender elk een kabel met alle {tip:core}-en toegewezen.
De tekening is een pompstation: draden lopen van de kast (+CAB) naar het veld (+FLD), en er is nog geen kabel.
"""
pause = true

[[step]]
id = "open-drawer"
title = "Open the Cables drawer"
title_nl = "Open de lade Cables"
text = """
Press {key:view.cables_drawer} to open the **Cables** drawer under the drawing.
It lists cables and cores, and counts what the program proposes.
"""
text_nl = """
Druk op {key:view.cables_drawer} om de lade **Cables** onder de tekening te openen.
Daar staan kabels en aders, en het aantal voorstellen van het programma.
"""
# verified: keymap.rs:392 binds Ctrl+4 (Anywhere) to view.cables_drawer; commands.rs:593 "Cables";
# workbench.rs:513 toggles the drawer; the tab is drawers.rs:62-66.
point = { ui = "drawer.cables.tab" }
expect = { opened = "drawer.cables" }
solve = [ { command = "view.cables_drawer" } ]

[[step]]
id = "read-proposals"
title = "Read the proposals"
title_nl = "Lees de voorstellen"
text = """
Wires that leave one {tip:location} for another are proposed as cables.
**Accept 2 proposed** counts them: one for the motor, one for the level transmitter.
"""
text_nl = """
Draden die van de ene {tip:location} naar de andere gaan, worden als kabel voorgesteld.
**Accept 2 proposed** telt ze: een voor de motor, een voor de niveauzender.
"""
# verified: drawers.rs:51 counts novo_cables::propose_cables; the button is drawers.rs:73-79
# (small_button "Accept {n} proposed", no hover text); the empty message is drawers.rs:185-190.
# GAP: cable proposals are not drawn on the canvas (no dashed wires) and Enter / proposal.accept
#      only accepts TERMINAL proposals (workbench.rs:370, terminals.rs:30). The drawer button is the
#      only way to accept all. Owner: Fast keyboard / UI integration (novo-app).
point = { ui = "drawer.cables.accept" }
note = [
  { ui = "drawer.cables.empty", text = "No cables yet", text_nl = "Nog geen kabels" },
  { area = { page = "Pump station", x = 36, y = 100, w = 40, h = 28 }, text = "Motor wires: strip to field", text_nl = "Motordraden: klemmenstrook naar veld" },
  { area = { page = "Pump station", x = 82, y = 100, w = 22, h = 28 }, text = "Level transmitter wires", text_nl = "Draden van de niveauzender" },
]
pause = true

[[step]]
id = "cable-tool"
title = "Pick the Cable tool"
title_nl = "Kies het gereedschap Kabel"
text = """
Press {key:tool.cable} for the Cable tool.
You draw a line across the wires that belong in one cable. Start with the level transmitter.
"""
text_nl = """
Druk op {key:tool.cable} voor het gereedschap Kabel.
Je trekt een lijn over de draden die in een kabel horen. Begin met de niveauzender.
"""
# verified: keymap.rs:348 binds C (Canvas) to tool.cable; commands.rs:274-280 "Cable";
# workbench.rs:459 begins the tool (tool.rs:696); status line tool.rs:2544 "Cable: click along the wires...".
# The dock has no Cable button (dock.rs:89 maps it to Select), so the key or Ctrl+K "cable" is the way.
point = { area = { page = "Pump station", x = 82, y = 112, w = 22, h = 8 } }
expect = { tool = "cable" }
solve = [ { command = "tool.cable" } ]

[[step]]
id = "draw-line"
title = "Draw the line across both wires"
title_nl = "Trek de lijn over beide draden"
text = """
Click left of the first transmitter wire, then right of the second.
Press {key:proposal.accept} to finish. Both wires become one cable.
"""
text_nl = """
Klik links van de eerste draad van de niveauzender en dan rechts van de tweede.
Druk op {key:proposal.accept} om af te ronden. Beide draden worden een kabel.
"""
# verified: tool.rs:1109-1121 (points are clicked; the last point again finishes), view.rs:1259-1261
# (Enter finishes the cable line while no wire proposals are showing), tool.rs:1730-1762 finish_cable,
# app.rs:799-805 -> drawers.rs:128-150 make_cable: one undo step "Draw cable", toast
# "Cable =P1-W1: 3x1.5 on 2 wires", the drawer shows the new cable.
point = { area = { page = "Pump station", x = 82, y = 112, w = 22, h = 8 } }
expect = { cable = { name = "-W1", cores_at_least = 3 } }
solve = [ { cable = { name = "-W1", wires = [["-X1:4", "-B1:+"], ["-X1:5", "-B1:-"]] } } ]

[[step]]
id = "accept"
title = "Accept the motor cable"
title_nl = "Neem de motorkabel over"
text = """
In the drawer, click **Accept 1 proposed**.
The four motor wires become one cable, each on its own core.
"""
text_nl = """
Klik in de lade op **Accept 1 proposed**.
De vier motordraden worden een kabel, elk op een eigen ader.
"""
# verified: drawers.rs:73-79 button -> accept_cable_proposals drawers.rs:153-172 (one undo step
# "Accept cables", toast "Accepted 1 cable: =P1-W2 4G1.5").
# GAP: no command id and no key for "accept cable proposals"; only the drawer button.
point = { ui = "drawer.cables.accept" }
expect = { cable = { name = "-W2", cores_at_least = 4 } }
solve = [ { cable = { name = "-W2", wires = [["-X1:1", "-M1:U1"], ["-X1:2", "-M1:V1"], ["-X1:3", "-M1:W1"], ["-X1:PE", "-M1:PE"]] } } ]

[[step]]
id = "read-cores"
title = "Read the cores"
title_nl = "Lees de aders"
text = """
The right half lists the cores of the cable you picked.
BN, BK and GY carry L1 to L3. The green-yellow core GNYE always carries PE.
"""
text_nl = """
De rechterhelft toont de aders van de gekozen kabel.
BN, BK en GY voeren L1 tot L3. De groen-gele ader GNYE voert altijd PE.
"""
# verified: drawers.rs:224-262 columns Core, From (+CAB), To (+FLD), Potential; core order and colours
# novo-cables propose.rs assign() (L1 BN, L2 BK, L3 GY, N BU, PE GNYE); kind.rs colour_cores.
point = { ui = "drawer.cables.cores" }
note = [
  { ui = "drawer.cables.cores", text = "Core: colour or number", text_nl = "Ader: kleur of nummer" },
  { ui = "drawer.cables.cores", text = "From: cabinet end, To: field end", text_nl = "From: kastzijde, To: veldzijde" },
  { ui = "drawer.cables.cores", text = "Potential the wire carries", text_nl = "Potentiaal van de draad" },
]
pause = true

[[step]]
id = "free-core"
title = "See a free core"
title_nl = "Zie een vrije ader"
text = """
Click **=P1-W1** in the list on the left.
Its **Cores** column says 2 of 3: one core is free, kept for later.
"""
text_nl = """
Klik links in de lijst op **=P1-W1**.
De kolom **Cores** zegt 2 of 3: een ader is vrij, gereserveerd voor later.
"""
# verified: drawers.rs:198-222 (list; a click on the tag picks the cable, DrawerAction::ShowCable),
# "{used} of {cores}" drawers.rs:217. A click has no solve operation yet, so this is a reading step.
point = { ui = "drawer.cables.list" }
pause = true

[[step]]
id = "part-and-length"
title = "Give the motor cable a part and a length"
title_nl = "Geef de motorkabel een artikel en een lengte"
text = """
Pick the Lapp **ÖLFLEX CLASSIC 110 4G1,5** as the part of -W2 and set its length to 12 m.
The wire list and the bill of materials use them.
"""
text_nl = """
Kies de Lapp **ÖLFLEX CLASSIC 110 4G1,5** als artikel van -W2 en zet de lengte op 12 m.
De draadlijst en de stuklijst gebruiken ze.
"""
# GAP: no screen control sets a cable's part or length. Engine: novo_parts::assign_cable_part
#      (novo-parts/src/assign.rs:247) and Cable.length_m. The Cables drawer is read-only
#      (drawers.rs:178-262), the inspector only knows devices (inspector.rs:78), and the property
#      sheet (novo-parts sheet.rs) is not in the app. Accept passes no catalog (drawers.rs:158).
#      Owner: Parts / UI integration (inspector for cables).
# GAP: needs check kind `field` on a cable (part set, length).
point = { ui = "inspector.cable.part" }
# GAP: pause until the engine has a cable `field` check (expect = { field = { cable = "-W2", name = "part", is_set = true } })
#      and a `cable_part` solve (name, maker, order_number, length_m); the learning thread agreed to add both.
pause = true

[[step]]
id = "shield"
title = "Add a shield to the transmitter cable"
title_nl = "Voeg een scherm toe aan de zenderkabel"
text = """
A 4-20 mA signal needs a {tip:shield}. Add one to -W1 and connect it to PE at the cabinet end.
A shield that is not connected is reported as a problem.
"""
text_nl = """
Een 4-20 mA-signaal heeft een {tip:shield} nodig. Voeg er een toe aan -W1 en sluit het in de kast aan op PE.
Een scherm dat niet is aangesloten, wordt als probleem gemeld.
"""
# GAP: no screen control adds a shield or connects it. Engine: novo_cables::add_shield and
#      connect_shield (edit.rs:122, :175), core name SH, property cable.shield.SH = "pe". Proposals
#      never offer a shielded type (propose.rs choose_type), and the drawer shows a shield core as a
#      row named SH with the connection in the "From" column (screen.rs shield_ends).
#      The unconnected-shield finding exists (check.rs ShieldUnconnected, novo-checks CableCore).
#      Owner: Cables (WS-12) engine is done; the Cables drawer / inspector owner adds the control.
# GAP: needs check kind `cable` with shield_connected = true (or `problem_free = "cable.core"`).
point = { ui = "drawer.cables.cores" }
# GAP: reading step until the engine has `cable = { name, shield_connected }` and a `cable_shield` solve.
pause = true

[[step]]
id = "done"
title = "That is a cable plan"
title_nl = "Dat is een kabelplan"
text = """
Wires that leave the cabinet are now cables with cores, a part, a length and a shield.
Next: wire numbers, and how they show on the cable cores.
"""
text_nl = """
Draden die de kast verlaten zijn nu kabels met aders, een artikel, een lengte en een scherm.
Straks: draadnummers, en hoe ze op de kabeladers verschijnen.
"""
# NOTE: the generated "Cable diagram" page (novo-reports CableDiagram) is added by the program only
# when a project opens (app.rs:549-554 document_replaced -> reports.rs:109 add_generated_pages) and
# there is no command to add it later. Right after these steps it is not in the outline yet; it appears
# when the project is saved and opened again. GAP: a command "Add generated pages" (UI integration).
pause = true
