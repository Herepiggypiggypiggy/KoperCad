format = 1
id = "live-view"
version = 1
status = "early"
title = "The live view"
summary = "Switch on the live view, press the start button and read what lights up."
track = "circuits"
order = 30
level = "intermediate"
minutes = 6
topics = ["simulation", "live"]
needs = ["cross-references"]
project = "../cross-references/finished.json"
page = "Control circuit"

[[step]]
id = "enter"
title = "Switch the live view on"
text = """
Press {key:sim.live}. The drawing turns live: potentials that carry power light up, and a card lists them.
"""
point = { ui = "dock.live" }
expect = { live = true }
solve = [ { command = "sim.live" } ]

[[step]]
id = "card"
title = "Read the card"
text = """
The card says **Live potentials** and lists each one that has power. At the start only the supply is live.
"""
point = { ui = "live.card" }
pause = true

[[step]]
id = "page-down"
title = "Go to the control circuit"
text = """
Press {key:nav.next_page} if you are not on the control circuit yet.
"""
expect = { page = "Control circuit" }
solve = [ { page = "Control circuit" } ]

[[step]]
id = "close-stop"
title = "Close the stop button"
text = """
Contacts start open in the live view, and the stop button is a normally closed one. Click **-S1** to close it.
"""
point = { at = { device = "-S1" } }
expect = { pole_closed = "-S1" }

[[step]]
id = "start"
title = "Press start"
text = """
Click **-S2** and hold. The coil **-K1** lights, its contacts follow, and the lamp **-P1** and the motor light up.
"""
point = { at = { device = "-S2" } }
expect = { coil_on = "-K1" }

[[step]]
id = "seal-in"
title = "Let go"
text = """
Release the start button. The coil stays on: the holding contact keeps it in. That is a {tip:self-hold}.
"""
point = { at = { device = "-K1", pin = "13" } }
pause = true

[[step]]
id = "stop"
title = "Open the stop button"
text = """
Click **-S1** to open it. The coil drops out and everything goes dark.
"""
point = { at = { device = "-S1" } }
expect = { not = { coil_on = "-K1" } }

[[step]]
id = "leave"
title = "Leave the live view"
text = """
Press {key:sim.live} again. The drawing is untouched; the live view never edits it.
"""
point = { ui = "dock.live" }
pause = true
