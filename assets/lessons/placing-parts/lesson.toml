format = 1
id = "placing-parts"
version = 1
status = "draft"
title = "Placing parts fast"
title_nl = "Snel onderdelen plaatsen"
summary = "Put a breaker, a button and a relay on the page with the wheel and the fast keys."
summary_nl = "Plaats een automaat, een drukknop en een relais met het wiel en de snelle toetsen."
track = "basics"
order = 10
level = "beginner"
minutes = 6
topics = ["placing", "fast keys"]
next = ["wiring-modes"]
project = "project.json"
finished = "finished.json"
page = "Control branch"

[[step]]
id = "intro"
title = "What you will build"
title_nl = "Wat je gaat tekenen"
text = """
You will draw a control branch: a breaker, a start button and a relay coil in a column between the supply **L1** and the neutral **N**.
Placing parts from the keyboard is the fastest way to draw, so you will learn the three ways in turn: by name, with the wheel, and with a favourite digit.
"""
text_nl = """
Je tekent een stuurstroomtak: een automaat, een startknop en een relaisspoel onder elkaar tussen de voeding **L1** en de nul **N**.
Onderdelen plaatsen met het toetsenbord is de snelste manier van tekenen. Je leert de drie manieren: op naam, met het wiel en met een favoriete cijfertoets.
"""
point = { area = { page = "Control branch", x = 60, y = 16, w = 40, h = 130 } }
pause = true

[[step]]
id = "type-mcb"
title = "Ask for a breaker by name"
title_nl = "Vraag een automaat bij naam"
text = """
Typing a short name is quicker than hunting through menus, and the name stays the same every day.
"""
text_nl = """
Een korte naam typen gaat sneller dan zoeken in menu's, en de naam blijft elke dag gelijk.
"""
how = [
  "Tap {key:tool.place}. A search field opens.",
  "Type **mcb**. The single-pole breaker is the first match.",
  "Press Enter. The breaker hangs on your pointer.",
]
how_nl = [
  "Tik op {key:tool.place}. Er opent een zoekveld.",
  "Typ **mcb**. De eenpolige automaat is de eerste treffer.",
  "Druk op Enter. De automaat hangt aan je aanwijzer.",
]
point = { ui = "dock.place" }
expect = { tool = "place" }
solve = [ { command = "tool.place", arg = "mcb" } ]

[[step]]
id = "drop-breaker"
title = "Drop it under L1"
title_nl = "Zet hem onder L1"
text = """
The breaker protects the control circuit, so it goes directly under the supply. Facing pins are wired for you.
"""
text_nl = """
De automaat beveiligt het stuurstroomcircuit, dus hij staat direct onder de voeding. Pennen die naar elkaar wijzen worden voor je bedraad.
"""
how = [
  "Move the pointer to the dot just under **L1**.",
  "Click. The part is placed and a wire is drawn up to L1. It gets the tag **-F1**.",
  "Press {key:edit.escape} to put the part down. Otherwise the next click places a second breaker.",
]
how_nl = [
  "Beweeg de aanwijzer naar het punt direct onder **L1**.",
  "Klik. Het onderdeel staat er en er komt een draad naar L1. Het krijgt de tag **-F1**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten. Anders plaatst de volgende klik een tweede automaat.",
]
point = { at = { page = "Control branch", x = 80, y = 40 } }
expect = { device = { symbol = "iec/protection/mcb_1p" } }
solve = [ { place = { symbol = "iec/protection/mcb_1p", page = "Control branch", x = 80, y = 40 } } ]

[[step]]
id = "hold-wheel"
title = "Open the wheel"
title_nl = "Open het wiel"
text = """
When you do not know the name, the wheel shows the groups of parts around your pointer. One hold and one move picks a part, so your hand stays on the drawing.
"""
text_nl = """
Als je de naam niet weet, toont het wiel de groepen onderdelen rond je aanwijzer. Eén vasthouden en één beweging kiest een onderdeel, zodat je hand op de tekening blijft.
"""
how = [
  "Hold {key:tool.place} down for a moment. The wheel opens around the pointer.",
  "Keep the key held and look at the groups: Switch, Relay, Breaker, Points and more.",
  "Release the key over an empty part of the wheel to close it again.",
]
how_nl = [
  "Houd {key:tool.place} even ingedrukt. Het wiel opent rond de aanwijzer.",
  "Houd de toets vast en bekijk de groepen: Schakelaar, Relais, Automaat, Punten en meer.",
  "Laat de toets los boven een lege plek van het wiel om het te sluiten.",
]
point = { ui = "wheel" }
expect = { signal = "wheel_opened" }

[[step]]
id = "wheel-pushbutton"
title = "Pick a push button from the wheel"
title_nl = "Kies een drukknop uit het wiel"
text = """
The start button closes the circuit while it is pressed, so it is a **normally open** push button. It goes under the breaker.
"""
text_nl = """
De startknop sluit het circuit zolang hij ingedrukt is, dus het is een **sluitende** drukknop. Hij komt onder de automaat.
"""
how = [
  "Hold {key:tool.place} to open the wheel.",
  "Move toward **Switch**, then toward **Push NO** (the push button that closes while pressed).",
  "Release the key. The push button hangs on your pointer.",
  "Click just under the breaker. It gets the tag **-S1** and is wired to the breaker.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Houd {key:tool.place} ingedrukt om het wiel te openen.",
  "Beweeg naar **Switch** en dan naar **Push NO** (de drukknop die sluit zolang hij ingedrukt is).",
  "Laat de toets los. De drukknop hangt aan je aanwijzer.",
  "Klik net onder de automaat. Hij krijgt de tag **-S1** en wordt met de automaat verbonden.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { ui = "wheel" }
expect = { device = { symbol = "iec/operators/pushbutton_no" } }
solve = [ { place = { symbol = "iec/operators/pushbutton_no", page = "Control branch", x = 80, y = 72 } } ]

[[step]]
id = "type-coil"
title = "Place the relay coil by name"
title_nl = "Plaats de relaisspoel bij naam"
text = """
The same field also lists your favourite parts with a digit beside each; typing that digit picks the part. Which digit is which depends on your favourites, so read it off the list. Here you simply type the name.
"""
text_nl = """
Hetzelfde veld toont ook je favoriete onderdelen met een cijfer ernaast; dat cijfer typen kiest het onderdeel. Welk cijfer bij welk onderdeel hoort hangt af van je favorieten, dus lees het af van de lijst. Hier typ je gewoon de naam.
"""
how = [
  "Tap {key:tool.place}, type **coil** and press Enter. The relay coil hangs on your pointer.",
  "Click just under the push button. It gets the tag **-K1** and is wired to the button.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **coil** en druk op Enter. De relaisspoel hangt aan je aanwijzer.",
  "Klik net onder de drukknop. Hij krijgt de tag **-K1** en wordt met de knop verbonden.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control branch", x = 80, y = 104 } }
expect = { device = { symbol = "iec/coils/relay" } }
solve = [ { place = { symbol = "iec/coils/relay", page = "Control branch", x = 80, y = 104 } } ]

[[step]]
id = "rotate"
title = "Turn a part before you drop it"
title_nl = "Draai een onderdeel voordat je het neerzet"
text = """
A part can be turned while it hangs on the pointer, before any wire is attached to it. You will put a spare push button to the right of the branch, turned a quarter, and take it away again.
"""
text_nl = """
Een onderdeel kun je draaien terwijl het aan de aanwijzer hangt, voordat er draden aan zitten. Je zet een reserve-drukknop rechts van de tak, een kwartslag gedraaid, en haalt hem daarna weer weg.
"""
how = [
  "Tap {key:tool.place}, type **pb** and press Enter.",
  "Press {key:edit.rotate}. The push button on your pointer turns a quarter.",
  "Click on the empty page to the right of the branch.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **pb** en druk op Enter.",
  "Druk op {key:edit.rotate}. De drukknop aan je aanwijzer draait een kwartslag.",
  "Klik op de lege pagina rechts van de tak.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control branch", x = 130, y = 72 } }
expect = { device = { symbol = "iec/operators/pushbutton_no", at_least = 2 } }
solve = [ { place = { symbol = "iec/operators/pushbutton_no", page = "Control branch", x = 130, y = 72, turns = 1 } } ]

[[step]]
id = "undo-spare"
title = "Take it back with undo"
title_nl = "Haal hem terug met ongedaan maken"
text = """
Everything you do can be undone, so trying is free.
"""
text_nl = """
Alles wat je doet kan ongedaan worden gemaakt, dus proberen kost niets.
"""
how = [
  "Press {key:edit.undo}. The spare push button disappears.",
]
how_nl = [
  "Druk op {key:edit.undo}. De reserve-drukknop verdwijnt.",
]
expect = { command = "edit.undo" }
solve = [ { command = "edit.undo" } ]

[[step]]
id = "duplicate"
title = "Copy a part with one key"
title_nl = "Kopieer een onderdeel met één toets"
text = """
Duplicating copies the selected part and gives the copy the next free number, so a second button never needs renaming.
"""
text_nl = """
Dupliceren kopieert het geselecteerde onderdeel en geeft de kopie het eerstvolgende vrije nummer, zodat een tweede knop nooit hernoemd hoeft te worden.
"""
how = [
  "Click the push button **-S1** to select it.",
  "Press {key:edit.duplicate}. A copy appears beside it with the tag **-S2**.",
  "Press {key:edit.undo} to take the copy away again.",
]
how_nl = [
  "Klik op de drukknop **-S1** om hem te selecteren.",
  "Druk op {key:edit.duplicate}. Naast de knop verschijnt een kopie met de tag **-S2**.",
  "Druk op {key:edit.undo} om de kopie weer weg te halen.",
]
point = { at = { device = "-S1" } }
expect = { command = "edit.duplicate" }
solve = [ { select = "-S1" }, { command = "edit.duplicate" } ]

[[step]]
id = "done"
title = "What you have now"
title_nl = "Wat je nu hebt"
text = """
Your page shows three parts in a column between L1 and N: the breaker **-F1**, the push button **-S1** and the relay coil **-K1**. Four wires join them: L1 to -F1, -F1 to -S1, -S1 to -K1 and -K1 to N. You drew none of them; they were drawn as the parts went down.
Use **Compare with the finished result** to open the same drawing as the lesson ends with it.
"""
text_nl = """
Op je pagina staan drie onderdelen onder elkaar tussen L1 en N: de automaat **-F1**, de drukknop **-S1** en de relaisspoel **-K1**. Vier draden verbinden ze: L1 met -F1, -F1 met -S1, -S1 met -K1 en -K1 met N. Je hebt er geen getekend; ze verschenen terwijl je de onderdelen neerzette.
Gebruik **Vergelijk met het eindresultaat** om dezelfde tekening te openen zoals de les hem afsluit.
"""
pause = true
