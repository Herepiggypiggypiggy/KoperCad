# Lesson: the reports as lists (wire list, cable diagram, bill of materials),
# giving a device a part through the spreadsheet, and the Excel export.
# Sample project: the pump starter with the new lamp -P1 wired and still
# without a part (project.json); builder and tests:
# crates/novo-tests/tests/lessons/documents.rs. Verified step by step in
# crates/novo-app/src/app/lesson_verify_outputs.rs. Reviewer notes: NOTES.md.
#
# GAP still open: no control assigns a part to a device (inspector.rs "Part"
# is a read-only label, the Parts window only browses and imports). The one
# way in the program today is the spreadsheet: Order number and Manufacturer
# columns of the Devices sheet (novo-interop sheets/fields.rs), which the
# lesson teaches. A part picker would replace steps export-sheet, edit-part
# and import-part.

format = 1
id = "wire-list-and-bom"
version = 1
status = "early"
title = "Wire List and Bill of Materials"
title_nl = "Draadlijst en stuklijst"
summary = "Find a wire and a cable in the lists, give a lamp a part through the spreadsheet, watch the bill of materials follow and export it."
summary_nl = "Zoek een draad en een kabel in de lijsten, geef een lamp via het spreadsheet een onderdeel, zie de stuklijst meebewegen en exporteer hem."
track = "outputs"
order = 30
level = "beginner"
minutes = 9
topics = ["reports", "parts", "export"]
needs = ["generated-pages", "cables-and-shields"]
next = ["pdf-export"]
project = "project.json"
page = "Control circuit"


[[step]]
id = "intro"
title = "What you will have"
title_nl = "Wat je straks hebt"
text = """
You will find one wire and one cable in their lists, give the new lamp a part and watch the bill of materials follow, then export it for the buyer.
It saves counting devices from the drawing by hand, and ordering the wrong quantity.
"""
text_nl = """
Je zoekt een draad en een kabel op in hun lijsten, geeft de nieuwe lamp een onderdeel, ziet de stuklijst meebewegen en exporteert hem voor de inkoper.
Zo hoef je apparaten niet met de hand uit de tekening te tellen en bestel je nooit het verkeerde aantal.
"""

[[step]]
id = "open-wire-list"
title = "Open the wire list"
title_nl = "Open de draadlijst"
# verified: lesson_verify_outputs.rs wire_list_and_bom. The Reports menu of
# the menu bar lists Contents, Bill of materials, Device list, Wire list,
# Terminal diagram, Cable diagram (commands.rs report.*, menus.rs); a click
# runs the command and opens the Reports workspace on that report
# (reports_view.rs show_report). The same lists are generated pages in the
# page list under "Contents and reports".
text = """
Open the wire list in the Reports view: one row per wire, with its number, both ends, colour and size.
The same list is also a generated page in the page list.
"""
text_nl = """
Open de draadlijst in het Reports-venster: één regel per draad, met nummer, beide einden, kleur en doorsnede.
Dezelfde lijst staat ook als gegenereerde pagina in de paginalijst.
"""
how = ["Click **Reports** in the menu bar", "Click **Wire list**"]
how_nl = ["Klik in de menubalk op **Reports**", "Klik op **Wire list**"]
expect = { command = "report.wires" }
solve = [ { command = "report.wires" } ]

[[step]]
id = "find-wire"
title = "Find wire 4"
title_nl = "Zoek draad 4"
# verified: columns Wire no., From, To, Potential, Colour, mm2, Cable,
# Location, Cut length mm, Length basis (novo-reports wires.rs). Wire 4 runs
# from =A1+CAB-X1:1 to =A1+FLD-M1:U1 in core BK of =A1-W1; the wire numbers
# of the sample project are set by documents.rs. Filter rows (Ctrl+F) keeps
# only the rows that contain the text (reports_view.rs).
text = """
Wire **4** goes from terminal 1 of strip **-X1** to pin **U1** on the motor, in the black (BK) core of cable **-W1**.
Type **U1** in **Filter rows** to see only the wires that touch a U1 pin.
"""
text_nl = """
Draad **4** loopt van klem 1 van klemmenstrook **-X1** naar pen **U1** op de motor, in de zwarte (BK) ader van kabel **-W1**.
Typ **U1** in **Filter rows** om alleen de draden te zien die aan een U1-pen komen.
"""
how = ["Read the row **4**", "Click **Filter rows (Ctrl+F)** and type **U1** to keep only the U1 wires"]
how_nl = ["Lees regel **4**", "Klik op **Filter rows (Ctrl+F)** en typ **U1** om alleen de U1-draden te houden"]

[[step]]
id = "open-cable-diagram"
title = "Open the cable diagram"
title_nl = "Open het kabelschema"
# verified: the first sheet (Overview) has one row per cable: Cable, Type,
# Length (m), From, To, Used, Cores, Spare (novo-reports diagrams.rs); here
# -W1, 12 m, +CAB to +FLD, 4 of 4 cores used, 0 spare; the second section
# lists the cores.
text = """
Open the cable diagram. A cable holds several coloured wires, called **cores**; the Overview section lists each cable, how long it is and how many of its cores are used.
**-W1** uses 4 of its 4 cores, so none is spare. The next section lists every core.
"""
text_nl = """
Open het kabelschema. Een kabel bevat meerdere gekleurde draden, de **aders**; het overzicht toont elke kabel, de lengte en hoeveel aders in gebruik zijn.
**-W1** gebruikt 4 van zijn 4 aders, er is dus geen reserve. De volgende sectie toont elke ader.
"""
how = ["Click **Reports**, then **Cable diagram**"]
how_nl = ["Klik op **Reports** en dan op **Cable diagram**"]
expect = { command = "report.cables" }
solve = [ { command = "report.cables" } ]

[[step]]
id = "open-bom"
title = "Open the bill of materials"
title_nl = "Open de stuklijst"
# verified: report.bom "Bill of materials" (commands.rs). Columns Pos., Qty,
# Manufacturer, Order number, Type, Description, Length (m), Used by; rows sort
# by manufacturer then order number; each terminal counts as one use of its
# terminal block (novo-reports bom.rs).
text = """
Open the bill of materials: one row per article with its quantity, the order number and where it is used.
The terminal block **3044076** has **Qty** 3, used by -X1:1, -X1:2 and -X1:3.
"""
text_nl = """
Open de stuklijst: één regel per artikel met aantal, bestelnummer en waar het gebruikt wordt.
Het klemmenblok **3044076** heeft **Qty** 3, gebruikt door -X1:1, -X1:2 en -X1:3.
"""
how = ["Click **Reports**, then **Bill of materials**"]
how_nl = ["Klik op **Reports** en dan op **Bill of materials**"]
expect = { command = "report.bom" }
solve = [ { command = "report.bom" } ]

[[step]]
id = "see-missing"
title = "Devices without a part"
title_nl = "Apparaten zonder onderdeel"
# verified: while a device or cable has no part the report adds a second
# section "Devices without parts" under the table (bom.rs). Only =A1+CAB-P1
# is listed; -X1 counts as covered through its terminals. The Issues list
# shows the same device as "has no part" (novo-checks MissingPart, an info).
text = """
Scroll to the section **Devices without parts**: only the new lamp **-P1** is there.
Until it has a part, the buyer would not know to order it.
"""
text_nl = """
Scroll naar de sectie **Devices without parts**: alleen de nieuwe lamp **-P1** staat erin.
Zolang hij geen onderdeel heeft, weet de inkoper niet dat hij besteld moet worden.
"""
how = ["Scroll down to the section **Devices without parts**"]
how_nl = ["Scrol omlaag naar de sectie **Devices without parts**"]

[[step]]
id = "export-sheet"
title = "Export the devices to a spreadsheet"
title_nl = "Exporteer de apparaten naar een spreadsheet"
# verified: export.sheets "Export for bulk edit (.xlsx)" is in File > Export
# (commands.rs, menus.rs); no key. It writes "<project> sheets.xlsx" next to
# the project or in <Documents>\KoperCAD (sheets.rs export_spreadsheet).
# GAP: no control picks a part for a device (inspector Part is read-only);
# the spreadsheet is the one way in the program today.
text = """
There is no part picker in the inspector yet, so give the lamp its part through the spreadsheet: export the project for bulk edit.
The message at the bottom names the .xlsx file it wrote.
"""
text_nl = """
De inspecteur heeft nog geen onderdeelkiezer, dus geef de lamp zijn onderdeel via het spreadsheet: exporteer het project voor bulkbewerking.
De melding onderaan noemt het .xlsx-bestand dat is geschreven.
"""
how = ["Click **File**, then **Export**, then **Export for bulk edit (.xlsx)**", "Read the message at the bottom: it names the file"]
how_nl = ["Klik op **File**, dan op **Export** en dan op **Export for bulk edit (.xlsx)**", "Lees de melding onderaan: die noemt het bestand"]
expect = { command = "export.sheets" }
solve = [ { command = "export.sheets" } ]

[[step]]
id = "edit-part"
title = "Fill in the part in Excel"
title_nl = "Vul het onderdeel in Excel in"
# verified: the Devices sheet has the columns Id, Tag, Description, Kind,
# Manufacturer, Order number (novo-interop sheets/export.rs); an Order number
# that the catalog does not know creates a part with that maker and number
# (sheets/create.rs). Excel is outside the program, so this is a reading step.
text = """
Open the file in Excel, go to the sheet **Devices**, find the row **-P1** and type **Siemens** under **Manufacturer** and **3SU1106-6AA40-1AA0** under **Order number**. Save the file.
Leave the grey columns alone: they only show where a row belongs.
"""
text_nl = """
Open het bestand in Excel, ga naar het blad **Devices**, zoek de regel **-P1** en typ **Siemens** onder **Manufacturer** en **3SU1106-6AA40-1AA0** onder **Order number**. Sla het bestand op.
Blijf van de grijze kolommen af: ze tonen alleen waar een regel bij hoort.
"""
how = ["Open the file in Excel", "Sheet **Devices**, row **-P1**: type **Siemens** under **Manufacturer** and **3SU1106-6AA40-1AA0** under **Order number**", "Save the file"]
how_nl = ["Open het bestand in Excel", "Blad **Devices**, regel **-P1**: typ **Siemens** onder **Manufacturer** en **3SU1106-6AA40-1AA0** onder **Order number**", "Sla het bestand op"]

[[step]]
id = "import-part"
title = "Import the spreadsheet"
title_nl = "Importeer het spreadsheet"
# verified: import.spreadsheet "Import spreadsheet" is in File (commands.rs);
# it asks for the file (a file dialog: not driven headless), opens a preview
# and "Apply 1 change (Enter)" writes it as one undo step (sheet_import.rs).
# solve: assign_part stands for the whole import (no solve op for a sheet).
text = """
Import the saved file and check the preview: one change, the part of **-P1**. Apply it.
Now the lamp has a part.
"""
text_nl = """
Importeer het opgeslagen bestand en controleer het voorbeeld: één wijziging, het onderdeel van **-P1**. Pas het toe.
Nu heeft de lamp een onderdeel.
"""
how = ["Click **File**, then **Import spreadsheet**", "Pick the saved file", "Check the preview, then click **Apply 1 change (Enter)** or press Enter"]
how_nl = ["Klik op **File** en dan op **Import spreadsheet**", "Kies het opgeslagen bestand", "Controleer het voorbeeld en klik op **Apply 1 change (Enter)** of druk op Enter"]
expect = { field = { device = "-P1", name = "part", is_set = true } }
solve = [ { assign_part = { device = "-P1", manufacturer = "Siemens", order_number = "3SU1106-6AA40-1AA0" } } ]

[[step]]
id = "bom-follows"
title = "The bill of materials followed"
title_nl = "De stuklijst is meegegaan"
# verified: the report reads devices, terminals, cables and parts (bom.rs)
# and is regenerated on the next change set. With no device left without a
# part the second section disappears; the lamp is the row Siemens
# 3SU1106-6AA40-1AA0 with Qty 1 (lesson_verify_outputs.rs).
text = """
Look at the bill of materials again: the lamp is a row with order number **3SU1106-6AA40-1AA0** and **Qty** 1, and the section **Devices without parts** is gone.
You changed no list; the part you gave the device did it.
"""
text_nl = """
Kijk nog eens naar de stuklijst: de lamp is een regel met bestelnummer **3SU1106-6AA40-1AA0** en **Qty** 1, en de sectie **Devices without parts** is verdwenen.
Je hebt geen lijst gewijzigd; het onderdeel dat je het apparaat gaf deed dat.
"""
how = ["Click **Reports**, then **Bill of materials**", "Find the row **3SU1106-6AA40-1AA0**"]
how_nl = ["Klik op **Reports** en dan op **Bill of materials**", "Zoek de regel **3SU1106-6AA40-1AA0**"]

[[step]]
id = "export-bom"
title = "Export it for the buyer"
title_nl = "Exporteer hem voor de inkoper"
# verified: export.bom "Export bill of materials" is in File > Export
# (commands.rs, menus.rs), no key of its own; it writes
# "<project> - Bill of materials.xlsx" next to the project file, or in
# <Documents>\KoperCAD for a project not saved yet, never over an earlier
# file, and says "Exported <path>" (reports_view.rs export_report/export_path).
# Columns as the table; numbers stay numbers in Excel (novo-reports export.rs).
# Other lists: File > Export > Export all reports to Excel (export.reports,
# one sheet each) and, per report, the Excel and CSV buttons in the Reports
# view.
text = """
Press {key:view.command_palette}, type **export bom** and press Enter, or choose **File > Export > Export bill of materials**.
KoperCAD saves **<project> - Bill of materials.xlsx** and the message at the bottom shows where. The other lists have **Excel** and **CSV** buttons in the Reports view.
"""
text_nl = """
Druk op {key:view.command_palette}, typ **export bom** en druk op Enter, of kies **File > Export > Export bill of materials**.
KoperCAD bewaart **<project> - Bill of materials.xlsx** en de melding onderaan toont waar. De andere lijsten hebben **Excel**- en **CSV**-knoppen in het Reports-venster.
"""
how = ["Press {key:view.command_palette}, type **export bom**, press Enter", "Or click **File**, **Export**, **Export bill of materials**"]
how_nl = ["Druk op {key:view.command_palette}, typ **export bom**, druk op Enter", "Of klik op **File**, **Export**, **Export bill of materials**"]
demo = [ { press = "view.command_palette" }, { type = "export bom" }, { key = "Enter" } ]
expect = { command = "export.bom" }
solve = [ { command = "export.bom" } ]
