# Lesson: the pages KoperCAD writes from the drawing and keeps current.
# Sample project: the pump starter with its generated pages (project.json);
# builder and tests: crates/novo-tests/tests/lessons/documents.rs.
# Reviewer notes with the verified UI path per step: NOTES.md.

format = 1
id = "generated-pages"
version = 1
status = "early"
title = "Pages KoperCAD Writes For You"
title_nl = "Pagina's die KoperCAD voor je schrijft"
summary = "Find the contents, device list, terminal and cable diagrams, add a lamp and watch the lists follow."
summary_nl = "Vind de inhoudsopgave, de apparatenlijst, de klemmen- en kabelschema's, plaats een lamp en zie de lijsten meebewegen."
track = "outputs"
order = 20
level = "beginner"
minutes = 8
topics = ["reports", "pages", "outline"]
show_problems = true
needs = ["terminal-strips", "cables-and-shields"]
next = ["wire-list-and-bom"]
project = "project.json"
page = "Control circuit"

[[step]]
id = "intro"
title = "What you will have"
title_nl = "Wat je straks hebt"
text = """
KoperCAD writes the contents, parts list, device list, wire list, terminal diagram and cable diagram for you and keeps them current.
You will find them, change the drawing and watch a list follow. That saves the evening before an issue date, when every list would be redone by hand.
"""
text_nl = """
KoperCAD schrijft de inhoudsopgave, stuklijst, apparatenlijst, draadlijst, klemmenschema en kabelschema voor je en houdt ze bij.
Je zoekt ze op, wijzigt de tekening en ziet een lijst meebewegen. Dat scheelt de avond voor de uitgiftedatum, waarop je anders elke lijst met de hand moet herzien.
"""

[[step]]
id = "open-contents"
title = "Open the contents page"
title_nl = "Open de inhoudsopgave"
# verified: lesson_verify_outputs.rs generated_pages. The flyout button is
# labelled with the outline mode, "Pages" (app.rs outline_flyout); a window of
# 1700 px or more keeps the list open beside the drawing. The page list is a
# tree: groups =A1 and +CAB with the drawn pages, then the group "Contents and
# reports" with the six generated pages (outline.rs outline_pages). A click on
# a row shows the page and closes the flyout. The title of the contents page is
# "Table of contents" (novo-reports defaults.rs).
text = """
Open the table of contents, the first page KoperCAD writes. In the page list your drawn pages are **1** and **2**; the six written pages are under **Contents and reports**.
"""
text_nl = """
Open de inhoudsopgave, de eerste pagina die KoperCAD schrijft. In de paginalijst zijn **1** en **2** je getekende pagina's; de zes geschreven pagina's staan onder **Contents and reports**.
"""
how = ["Click **Pages** in the top bar (on a window 1700 pixels wide or more the list is already open)", "Under the folder **Contents and reports** click **0a  Table of contents**"]
how_nl = ["Klik linksboven bij de tekening op **Pages** (op een scherm van 1700 pixels of breder staat de lijst al open)", "Klik onder de map **Contents and reports** op **0a  Table of contents**"]
expect = { page = "Table of contents" }
solve = [ { page = "Table of contents" } ]

[[step]]
id = "read-contents"
title = "A table, not a drawing"
title_nl = "Een tabel, geen tekening"
# verified: columns Page, Title, Page group, Panel, Kind; Kind reads
# "Schematic" or "Generated: <report>" (novo-reports toc.rs); the canvas
# draws the sheet inside the page frame (reports.rs).
text = """
The table has one row per page: page, title, group, panel and kind (Schematic, or Generated).
There is nothing to select here. It changes when the drawing changes, so nobody retypes the index.
"""
text_nl = """
De tabel heeft één regel per pagina: pagina, titel, groep, kast en soort (Schematic of Generated).
Hier valt niets te selecteren. De tabel verandert als de tekening verandert, dus niemand typt de index opnieuw.
"""
point = { area = { page = "Table of contents", x = 15, y = 27, w = 390, h = 90 } }
note = [
  { area = { page = "Table of contents", x = 336.9, y = 27, w = 66.6, h = 8 }, text = "Drawn or generated", text_nl = "Getekend of gegenereerd" },
]

[[step]]
id = "back-to-drawing"
title = "Back to the drawing"
title_nl = "Terug naar de tekening"
# verified: PageDown is nav.next_page on the canvas (keymap.rs); it steps
# through the pages in order (workbench.rs), so from the contents it takes
# two presses to reach page 2 (checked in lesson_verify_outputs.rs).
text = "Go back to your drawing: **Control circuit** is page 2, two pages on from the contents. Page Down steps one page at a time; a click on the row in the page list works too."
text_nl = "Ga terug naar je tekening: **Control circuit** is pagina 2, twee pagina's na de inhoudsopgave. Page Down gaat een pagina per keer verder; een klik op de regel in de paginalijst werkt ook."
how = ["Press {key:nav.next_page} (Page Down) once: **1  Main circuit**", "Press {key:nav.next_page} again: **2  Control circuit**", "Or click **Pages**, then the row **Control circuit**"]
how_nl = ["Druk één keer op {key:nav.next_page} (Page Down): **1  Main circuit**", "Druk nogmaals op {key:nav.next_page}: **2  Control circuit**", "Of klik op **Pages** en dan op de regel **Control circuit**"]
demo = [ { press = "nav.next_page" }, { wait = 0.4 }, { press = "nav.next_page" } ]
expect = { page = "Control circuit" }
solve = [ { page = "Control circuit" } ]

[[step]]
id = "place-lamp"
title = "Add a pilot lamp"
title_nl = "Plaats een signaallamp"
# verified: Q is tool.place (keymap.rs); the field opens in Place mode and
# "lamp green" finds "Indicator lamp, green"; Enter picks it, a click places
# it (lesson_verify_outputs.rs). The lamp gets the next free tag of the page
# structure. It stays unwired on purpose: the problem pill shows a warning
# for it; wiring is another lesson.
text = """
Add a green pilot lamp to the right of the coil, so you can watch the lists react. A new device gets its own name, such as -P1: its **tag**.
"""
text_nl = """
Plaats een groene signaallamp rechts van de spoel, zodat je de lijsten kunt zien reageren. Een nieuw apparaat krijgt een eigen naam, zoals -P1: zijn **tag**.
"""
how = ["Press {key:tool.place}", "Type **lamp green** and press Enter", "Click the empty spot right of the coil"]
how_nl = ["Druk op {key:tool.place}", "Typ **lamp green** en druk op Enter", "Klik op de lege plek rechts van de spoel"]
demo = [ { press = "tool.place" }, { type = "lamp green" }, { key = "Enter" }, { move = { at = { page = "Control circuit", x = 104, y = 168 } } }, { click = true } ]
point = { area = { page = "Control circuit", x = 96, y = 164, w = 16, h = 24 } }
note = [
  { ui = "dock.place", text = "Same as the key", text_nl = "Hetzelfde als de toets" },
]
# State check: counts symbols, so it does not depend on the tag the engine
# invents. The control page has 8 symbols at the start.
expect = { count = { kind = "symbol", page = "Control circuit", at_least = 9 } }
solve = [ { place = { symbol = "iec/signalling/lamp_green", page = "Control circuit", x = 104, y = 168 } } ]

[[step]]
id = "open-device-list"
title = "Open the device list"
title_nl = "Open de apparatenlijst"
# verified: nav.next_page from page 2 goes to 10 (Bill of materials), then 20
# (Device list).
text = "Open the **Device list**, two pages on from the control circuit, past the bill of materials."
text_nl = "Open de **Device list**, twee pagina's na het stroomkringschema, voorbij de stuklijst."
how = ["Press {key:nav.next_page} twice: the first press shows **10  Bill of materials**, the second **20  Device list**", "Or click **Pages**, then **20  Device list**"]
how_nl = ["Druk twee keer op {key:nav.next_page}: de eerste keer **10  Bill of materials**, de tweede keer **20  Device list**", "Of klik op **Pages** en dan op **20  Device list**"]
demo = [ { press = "nav.next_page" }, { wait = 0.4 }, { press = "nav.next_page" } ]
expect = { page = "Device list" }
solve = [ { page = "Device list" } ]

[[step]]
id = "new-row"
title = "The list already knows the lamp"
title_nl = "De lijst kent de lamp al"
# verified: the device list has one row per device in tag order, columns Tag,
# Function, Location, Description, Kind, Part, Manufacturer, Drawn at
# (novo-reports devices.rs); LiveReports regenerates a report when a change
# set touches what it reads (reports.rs). Row y=59 is the fifth row.
text = """
A new row appeared: the lamp, with its tag, its description and where it is drawn.
You updated nothing. The list follows the drawing, so it is never out of date.
"""
text_nl = """
Er staat een nieuwe regel: de lamp, met tag, omschrijving en waar hij getekend is.
Je hebt niets bijgewerkt. De lijst volgt de tekening en loopt dus nooit achter.
"""
point = { area = { page = "Device list", x = 15, y = 59, w = 390, h = 6 } }
note = [
  { area = { page = "Device list", x = 16.5, y = 59, w = 52, h = 6 }, text = "Next free tag", text_nl = "Eerstvolgende vrije tag" },
  { area = { page = "Device list", x = 351.5, y = 59, w = 52, h = 6 }, text = "Page and column", text_nl = "Pagina en kolom" },
]

[[step]]
id = "sheet-names"
title = "How the sheets are named"
title_nl = "Hoe de bladen heten"
# verified: sheet names are the page name plus a letter when a report needs
# more than one sheet, skipping i, l and o; never a dot (novo-reports
# sheets.rs, DESIGN.md section 8). The lamp has no part, so the bill of
# materials gained its section "Devices without parts" and with it a second
# sheet: 10 became 10a and 10b (checked in documents.rs and in
# lesson_verify_outputs.rs).
text = """
A long list continues on another sheet, named with a letter. The lamp has no part yet, so the bill of materials grew from **10** to **10a** and **10b** in the page list.
The letters skip i, l and o because they look like numbers, and there is never a dot: **2.4** always means page 2, column 4.
"""
text_nl = """
Een lange lijst gaat door op een volgend blad, met een letter in de naam. De lamp heeft nog geen onderdeel, dus de stuklijst groeide in de paginalijst van **10** naar **10a** en **10b**.
De letters slaan i, l en o over omdat ze op cijfers lijken, en er staat nooit een punt: **2.4** is altijd pagina 2, kolom 4.
"""

[[step]]
id = "what-you-edit"
title = "What you change, what follows"
title_nl = "Wat je wijzigt, wat meebeweegt"
# verified: a generated page cannot be renamed (the Rename entry of its menu
# is off: "Generated pages are named by the program") and cannot be deleted
# (the Delete page entry is off). GAP: DESIGN.md section 8 says deleting a
# generated page turns its kind off; tx.delete_page does it, but no control
# reaches it, so the lesson does not teach it.
text = """
Change the drawing, never the table: parts, tags and wires flow into every list. A generated page cannot be renamed or deleted; a drawn page can.
Compare with the result of this lesson: the control page has one extra green lamp right of the coil, with no wires, and the device list has a row for it. Next: the wire list and the bill of materials.
"""
text_nl = """
Wijzig de tekening, nooit de tabel: onderdelen, tags en draden stromen door naar elke lijst. Een gegenereerde pagina kun je niet hernoemen of verwijderen; een getekende wel.
Vergelijk met het resultaat van deze les: de stroomkringpagina heeft rechts van de spoel één extra groene lamp zonder draden, en de apparatenlijst heeft er een regel voor. Straks: de draadlijst en de stuklijst.
"""
