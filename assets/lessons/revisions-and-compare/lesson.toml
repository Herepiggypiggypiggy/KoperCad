format = 1
id = "revisions-and-compare"
version = 1
status = "early"
title = "Issue a revision and see what changed"
summary = "Freeze the drawing as revision A, change it, compare, and issue revision B."
track = "outputs"
order = 40
level = "beginner"
minutes = 8
topics = ["revision", "compare", "changes"]
needs = []
next = ["time-savers"]
project = "project.json"
finished = "finished.json"
page = "Main circuit"
title_nl = "Geef een revisie uit en zie wat er veranderd is"
summary_nl = "Bevries de tekening als revisie A, wijzig hem, vergelijk en geef revisie B uit."

[[step]]
id = "issue-a"
title = "Issue revision A"
title_nl = "Geef revisie A uit"
text = "Issuing a revision saves a copy of the drawing and locks the page numbers, so a reference such as 2.1 keeps pointing at the same place afterwards. The copy is what you compare with later."
text_nl = "Een revisie uitgeven bewaart een kopie van de tekening en legt de paginanummers vast, zodat een verwijzing zoals 2.1 daarna naar dezelfde plek blijft wijzen. Die kopie gebruik je later om mee te vergelijken."
how = [
  "Press {key:view.command_palette}, type **issue** and press Enter. The **Issue revision A** window opens.",
  "Type **First issue** under **What changed**. Check **Index** (A), **Date** and **By** (your initials).",
  "Press **Issue A** (or Enter).",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **issue** en druk op Enter. Het venster **Issue revision A** opent.",
  "Typ **First issue** bij **What changed**. Controleer **Index** (A), **Date** en **By** (je initialen).",
  "Druk op **Issue A** (of Enter).",
]
point = { ui = "palette.button" }
expect = { command = "revision.issue" }
solve = [ { issue_revision = { description = "First issue" } } ]
demo = [ { type = "First issue" }, { key = "Enter" } ]

[[step]]
id = "change-motor"
title = "Change the motor"
title_nl = "Wijzig de motor"
text = "A change after the issue is what the comparison will show. Give the motor a new description."
text_nl = "Een wijziging na de uitgifte is wat de vergelijking gaat tonen. Geef de motor een nieuwe omschrijving."
how = [
  "Click the motor **-M1** on page **Main circuit** to select it.",
  "In the inspector click the **Description** box and type **Pump motor 3 kW**.",
  "Press Enter to confirm.",
]
how_nl = [
  "Klik op de motor **-M1** op pagina **Main circuit** om hem te selecteren.",
  "Klik in de inspector in het vak **Description** en typ **Pump motor 3 kW**.",
  "Druk op Enter om te bevestigen.",
]
point = { at = { device = "-M1" } }
expect = { field = { device = "-M1", name = "description", equals = "Pump motor 3 kW" } }

[[step]]
id = "show-changes"
title = "Show the changes on the drawing"
title_nl = "Toon de wijzigingen op de tekening"
text = "Marks on the pages show at a glance what is new, changed or removed since the latest revision."
text_nl = "Markeringen op de pagina's tonen in één oogopslag wat nieuw, gewijzigd of verwijderd is sinds de laatste revisie."
how = [
  "Press {key:view.command_palette}, type **changes** and press Enter.",
  "Changed things on the page get a mark. Running it a second time switches the marks off again.",
  "Open the page panel and click its **Changes** tab to see the list by page.",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **changes** en druk op Enter.",
  "Gewijzigde dingen op de pagina krijgen een markering. Nog een keer uitvoeren zet de markeringen weer uit.",
  "Open het paginapaneel en klik op het tabblad **Changes** voor de lijst per pagina.",
]
point = { ui = "palette.button" }
expect = { command = "view.changes" }
solve = [ { command = "view.changes" } ]

[[step]]
id = "jump-to-change"
title = "Click a change"
title_nl = "Klik op een wijziging"
text = "The list lets you visit every change without searching the pages."
text_nl = "Met de lijst bezoek je elke wijziging zonder de pagina's af te zoeken."
how = [
  "In the **Changes** tab click a page row to open that page.",
  "Click a row under it to jump to the changed object, here **-M1**.",
]
how_nl = [
  "Klik in het tabblad **Changes** op een paginarij om die pagina te openen.",
  "Klik op een rij eronder om naar het gewijzigde object te springen, hier **-M1**.",
]

[[step]]
id = "compare"
title = "Compare two states"
title_nl = "Vergelijk twee toestanden"
text = "Compare answers 'what is different between then and now' in one list, with filters for the kind of change."
text_nl = "Vergelijken beantwoordt 'wat is er anders tussen toen en nu' in één lijst, met filters voor het soort wijziging."
how = [
  "Press {key:view.command_palette}, type **compare** and press Enter. The **Compare revisions** window opens.",
  "**From** shows revision A and **To** shows now. Pick other states in the two boxes if you like.",
  "Type in the **Filter** box to narrow the list.",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **compare** en druk op Enter. Het venster **Compare revisions** opent.",
  "**From** toont revisie A en **To** toont nu. Kies andere toestanden in de twee vakken als je wilt.",
  "Typ in het vak **Filter** om de lijst te beperken.",
]
point = { ui = "palette.button" }
expect = { command = "revision.compare" }
solve = [ { command = "revision.compare" } ]

[[step]]
id = "swap"
title = "Look from the other side"
title_nl = "Kijk vanaf de andere kant"
text = "Swapping the two sides turns additions into removals, so the same list answers 'what did we add' and 'what did we take away'."
text_nl = "Door de twee kanten om te wisselen worden toevoegingen verwijderingen, zodat dezelfde lijst beantwoordt 'wat hebben we toegevoegd' en 'wat hebben we weggehaald'."
how = [
  "Click the **⇄** button between **From** and **To**.",
  "The sides trade places and the list turns around.",
]
how_nl = [
  "Klik op de knop **⇄** tussen **From** en **To**.",
  "De kanten wisselen van plaats en de lijst draait om.",
]

[[step]]
id = "issue"
title = "Issue revision B"
title_nl = "Geef revisie B uit"
text = "Issue again at the next hand-over. The pages are locked as they are now and later changes show up against revision B."
text_nl = "Geef opnieuw uit bij de volgende overdracht. De pagina's liggen vast zoals ze nu zijn en latere wijzigingen verschijnen ten opzichte van revisie B."
how = [
  "Press {key:view.command_palette}, type **issue** and press Enter.",
  "Type **Larger pump motor** under **What changed**. Check **Index**, **Date** and **By** (your initials).",
  "Press **Issue B**.",
]
how_nl = [
  "Druk op {key:view.command_palette}, typ **issue** en druk op Enter.",
  "Typ **Larger pump motor** bij **What changed**. Controleer **Index**, **Date** en **By** (je initialen).",
  "Druk op **Issue B**.",
]
point = { ui = "palette.button" }
expect = { command = "revision.issue" }
solve = [ { issue_revision = { description = "Larger pump motor" } } ]

[[step]]
id = "done"
title = "A trail you can trust"
title_nl = "Een spoor dat je kunt vertrouwen"
text = "Issue at every hand-over, compare before you send. Next: settings that save time."
text_nl = "Geef uit bij elke overdracht, vergelijk voor je verstuurt. Hierna: instellingen die tijd besparen."
