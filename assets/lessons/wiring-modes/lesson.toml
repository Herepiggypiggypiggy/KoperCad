format = 1
id = "wiring-modes"
version = 1
status = "early"
title = "Corners and Lines"
summary = "Draw wires from a pin, and bend them in the two wiring modes."
track = "start"
order = 20
level = "beginner"
minutes = 7
topics = ["wiring"]
needs = ["placing-parts"]
next = ["potentials"]
project = "project.json"
finished = "finished.json"
page = "Two start buttons"

[[step]]
id = "pin-drag"
title = "Drag from a pin"
text = """
Drag from the lower pin of the left breaker **-F1** to the upper pin of the left button **-S1**.
Facing pins join with a straight wire.
"""
point = { at = { device = "-F1", pin = "2" } }
note = [ { at = { device = "-S1", pin = "13" }, text = "Drop on this pin" } ]
expect = { wire = { from = "-F1:2", to = "-S1:13" } }
solve = [ { wire = ["-F1:2", "-S1:13"] } ]

[[step]]
id = "corners-tool"
title = "Start a wire with W"
text = """
Press {key:tool.connect}. The dock shows the wiring mode **Corners**. In Corners the router finds the bends for you.
"""
point = { ui = "dock.wire_mode" }
expect = { tool = "wire" }

[[step]]
id = "corners-wire"
title = "Wire the left button to the relay"
text = """
Click the lower pin of **-S1**, click the dot to the side at the height of the relay, then the top pin of the left relay **-K1**.
"""
point = { at = { device = "-S1", pin = "14" } }
note = [ { at = { device = "-K1", pin = "A1" }, text = "Finish here" } ]
expect = { wire = { from = "-S1:14", to = "-K1:A1" } }
solve = [ { wire = ["-S1:14", "-K1:A1"] } ]

[[step]]
id = "switch-mode"
title = "Switch to Lines"
text = """
Press {key:wire.mode}. The dock now says **Lines**. Here every bend is a click you choose yourself.
"""
point = { ui = "dock.wire_mode" }
expect = { wiring_mode = "lines" }

[[step]]
id = "lines-wire"
title = "Wire the right button, bend by bend"
text = """
Click the lower pin of the right button **-S2**. Click the two corners, then the top pin of the right relay.
Each click is a bend.
"""
point = { at = { device = "-S2", pin = "14" } }
note = [ { at = { device = "-K2", pin = "A1" }, text = "Finish here" } ]
expect = { wire = { from = "-S2:14", to = "-K2:A1" } }

[[step]]
id = "compare"
title = "Which suits your hand?"
text = """
Corners saves clicks, Lines gives exact control. Switch with {key:wire.mode} any time. Next: potentials.
"""
pause = true
