format = 1
id = "potentials"
version = 1
status = "early"
title = "Potentials and feeds"
summary = "Give a motor feeder its supply with a row of feeds and an earth."
track = "start"
order = 30
level = "beginner"
minutes = 6
topics = ["potentials", "feeds"]
needs = ["wiring-modes"]
next = ["motor-starter"]
project = "project.json"
finished = "finished.json"
page = "Motor feeder"

[[step]]
id = "intro"
title = "A drawing with no supply"
text = """
The breaker, the contactor and the motor are wired, but nothing says where the power comes from.
A {tip:potential} is a named supply such as **L1**. A {tip:feed} puts it on the page.
"""
point = { area = { page = "Motor feeder", x = 60, y = 16, w = 50, h = 110 } }
pause = true

[[step]]
id = "feed-from-wheel"
title = "Open the feed menu"
text = """
Hold {key:tool.place}, choose **Points**, then **Feed**. A feed hangs on your pointer.
"""
point = { ui = "wheel" }
expect = { tool = "place" }

[[step]]
id = "row"
title = "Drag a row of three feeds"
text = """
Drag across the three top pins of the breaker **-Q1**. The dock shows **Row x3, pitch 8 mm**.
Release to drop three feeds, named **L1**, **L2** and **L3**.
"""
point = { at = { device = "-Q1", pin = "1" } }
note = [ { at = { device = "-Q1", pin = "5" }, text = "Release here" } ]
expect = { count = { kind = "feed", page = "Motor feeder", at_least = 3 } }
solve = [ { feed_row = { names = ["L1", "L2", "L3"], page = "Motor feeder", x = 80, y = 20 } } ]

[[step]]
id = "earth-feed"
title = "Add one more feed above the motor earth"
text = """
Place a fourth feed just above the earth pin of the motor **-M1**. It is named **L4** for now.
"""
point = { at = { device = "-M1", pin = "PE" } }
expect = { count = { kind = "feed", page = "Motor feeder", at_least = 4 } }

[[step]]
id = "make-earth"
title = "Make it the earth"
text = """
Right-click the new feed and choose **PE** from the potential chips.
The symbol changes to the protective earth.
"""
point = { at = { feed = "L4" } }
expect = { potential_kind = { kind = "protective_earth", page = "Motor feeder" } }

[[step]]
id = "where-it-goes"
title = "See where a potential goes"
text = """
Select **L1** and use **Show where it goes**. Every pin on that potential lights up.
"""
point = { at = { feed = "L1" } }
pause = true
