title = "Potentials and feeds"
title_nl = "Potentialen en voedingen"
summary = "Give a motor feeder its supply with a row of feeds and an earth."
summary_nl = "Geef een motorgroep zijn voeding met een rij voedingen en een aarde."
track = "start"
order = 30
level = "beginner"
minutes = 6
topics = ["potentials", "feeds"]
