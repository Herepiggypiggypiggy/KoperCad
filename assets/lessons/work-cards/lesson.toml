The pack opens with a cover (how to print and the **tool list** of the cabinet), then a tick-off sheet with every step, then the cards, two to an A4 page: cut or fold at the dashed line.
"""
text_nl = """
**Work cards (PDF)** op de strook, of het opdrachtveld, schrijft het hele pakket: `<project> work cards.pdf`. Het staat ook onder Reports > Export en in Reports > Bench output.
Het pakket begint met een omslag (hoe te printen en de **gereedschapslijst** van de kast), dan een afvinkblad met elke stap, dan de kaarten, twee per A4-pagina: knip of vouw bij de stippellijn.
"""
