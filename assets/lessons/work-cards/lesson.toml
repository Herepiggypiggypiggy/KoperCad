[[step]]
id = "drilling"
title = "Read a rail card"
title_nl = "Lees een raikaart"
text = """
A **rail card** shows the rail strip with its holes (numbered where the scale allows) and lists them in mm from the rail start: "Holes, mm from the rail start", the repeated pitch ("Pitch between holes, mm: 196 x 5") and "Last hole to the rail end".
A note names the devices clipped on the rail, in mm from its start (the first six; all are drawn on the strip).
"""
text_nl = """
Een **raikaart** toont de railstrook met zijn gaten (genummerd waar de schaal het toelaat) en noemt ze in mm vanaf het railbegin: "Holes, mm from the rail start", de herhaalde steek ("Pitch between holes, mm: 196 x 5") en "Last hole to the rail end".
Een notitie noemt de apparaten op de rail, in mm vanaf het railbegin (de eerste zes; alle staan getekend op de strook).
"""

[[step]]
id = "device-card"
title = "Read a device card"
title_nl = "Lees een apparaatkaart"
text = """
A **device card** shows the footprint with its screw holes and any cut-out, each hole as distances from the nearest plate edges, such as "65 mm from the left edge, 225 mm from the bottom edge".
A template is drawn 1:1 where it fits its area. Otherwise the card says **NOT true size: measure from the list, not the drawing**.
"""
text_nl = """
Een **apparaatkaart** toont de voetafdruk met zijn schroefgaten en eventuele uitsnijding, elk gat als afstanden tot de dichtstbijzijnde plaatranden, zoals "65 mm from the left edge, 225 mm from the bottom edge".
Een sjabloon wordt 1:1 getekend waar het in zijn gebied past. Anders zegt de kaart **NOT true size: measure from the list, not the drawing**.
"""

[[step]]
id = "ruler"
title = "Check the print with the ruler"
title_nl = "Controleer de print met de liniaal"
text = """
Printing at 100 % (no fit-to-page) is up to the print dialog. The 100 mm ruler on every card is the check: lay a real ruler on it.
If the print is stretched, the print-scale check page tells you how to repair it. A hole measured off a stretched print is in the wrong place.
"""
text_nl = """
Printen op 100 % (niet aanpassen aan pagina) hangt van het printvenster af. De liniaal van 100 mm op elke kaart is de controle: leg er een echte liniaal op.
Is de print uitgerekt, dan vertelt de pagina voor de printschaal-controle hoe je dat herstelt. Een gat dat van een uitgerekte print is gemeten zit op de verkeerde plek.
"""

[[step]]
id = "wire-cards"
title = "Read a wire cut card"
title_nl = "Lees een draadafkortkaart"
text = """
Wire cards come per circuit group (Power, Control, PE), nine wires to a card: from, to, size and colour, the cut length, and a Cut and a Run box.
A length with **~** is an estimate, not a routed length. The **Per end** column shows what each end adds for a ferrule or a lug, already inside the cut length. The group of a wire is the model of the usual practice, not a reading of your schematic.
"""
text_nl = """
Draadkaarten komen per stroomkringgroep (Power, Control, PE), negen draden per kaart: van, naar, maat en kleur, de afkortlengte en een vakje Cut en Run.
Een lengte met **~** is een schatting, geen gerouteerde lengte. De kolom **Per end** toont wat elk einde toevoegt voor een adereindhuls of een kabelschoen, al binnen de afkortlengte. De groep van een draad is het model van de gebruikelijke praktijk, geen lezing van je schema.
"""

[[step]]
id = "honest"
title = "What is exact and what is a guess"
title_nl = "Wat exact is en wat een schatting"
text = """
Positions come from the cabinet layout, **not from a measured plate**, and every card says so. Measure the real plate before you trust a hole.
The tool list is derived from hole diameters and cut-outs and is a suggestion, not a standard. Duct fixing positions on the cards (25 mm from each end, at most 200 mm apart) are a labelled planning rule, not the duct maker's data: the maker's instructions win, and those holes are not in the drilling list.
"""
text_nl = """
Posities komen uit de kastindeling, **niet van een opgemeten plaat**, en elke kaart zegt dat. Meet de echte plaat op voordat je een gat vertrouwt.
De gereedschapslijst is afgeleid van gatdiameters en uitsnijdingen en is een suggestie, geen norm. Bevestigingsposities van kanalen op de kaarten (25 mm van elk einde, hoogstens 200 mm uit elkaar) zijn een benoemde planningsregel, geen gegevens van de kanaalmaker: diens instructies gaan voor en die gaten staan niet in de boorlijst.
"""

