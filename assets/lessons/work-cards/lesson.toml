**Print this step** schrijft de kaart van die stap alleen op één A4-pagina, genaamd `<project> work card <mark>.pdf`. Een opslagvenster vraagt waar hij heen gaat; het begint naast het project (in Documenten voor een naamloos project) en annuleren schrijft niets. Gebruik het als één onderdeel erop gaat en je niet het hele pakket wilt.
De knop verschijnt alleen op een stap die een onderdeel toevoegt.
"""
