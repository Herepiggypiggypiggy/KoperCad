[[step]]
id = "why"
title = "One card per step, ticked with a pencil"
title_nl = "Eén kaart per stap, afgevinkt met een potlood"
text = """
The workshop cuts wires and drills holes **by hand**. The work cards turn the build order into paper for that: one half page per step, on an ordinary office printer.
Every card says what to do, with which tools, and has tick boxes such as Cut, Drilled, Fitted and Checked (they differ a little per card) and a 100 mm ruler.
"""
text_nl = """
De werkplaats kort draden af en boort gaten **met de hand**. De werkkaarten maken van de bouwvolgorde papier daarvoor: een halve pagina per stap, op een gewone kantoorprinter.
Elke kaart zegt wat te doen, met welk gereedschap, en heeft vakjes om af te vinken zoals Cut, Drilled, Fitted en Checked (ze verschillen per kaart een beetje) en een liniaal van 100 mm.
"""

