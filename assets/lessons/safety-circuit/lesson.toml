Om een prestatieniveau te noemen, beschrijf je deze stop als veiligheidsfunctie in het venster Veiligheidsfuncties en koppel je sensor, logica en actuatoren aan deze apparaten. Het bereikte niveau is dan een schatting uit de gegevens die je invoert (een PFHd-schatting in gesloten vorm, niet de tabel uit de norm).
"""
