# Cabinet track, lesson 9. Sample: wire-routing/project.json. Part depths in the sample: -F1 68,
# -K1 90, -F2 90, -F3 70, -X1 45, -T1 85, -S0 and -S1 50 mm.
#
# NOT VERIFIABLE ON MAIN (aa5977ab): the novo-view3d crate exists (scene builder, camera, renderer)
# but the app does not use it yet: there is no 3D face next to Plate and Table, no command
# cabinet.view3d and no view cube in the Cabinet. The steps follow the input table of
# docs/design/3d-view.md section 6 and must be re-checked in the app when the 3D face lands.
# Keep status = "draft" until then. Needs: the face switch and the anchors named below.
format = 1
id = "view-3d"
version = 2
status = "early"
title = "The cabinet in 3D"
title_nl = "De kast in 3D"
summary = "Orbit the laid-out cabinet, click a device to find it on the plate, and use the view cube."
summary_nl = "Draai om de ingedeelde kast, klik een component om het op de plaat te vinden en gebruik de kijkkubus."
track = "cabinet"
order = 90
level = "beginner"
minutes = 5
topics = ["cabinet", "3d"]
needs = ["cabinet-layout"]
project = "../wire-routing/project.json"

[[step]]
id = "open-3d"
how = ["Press {key:view.cabinet}.", "Click 3D in the face switch next to Plate and Table."]
how_nl = ["Druk op {key:view.cabinet}.", "Klik op 3D in de schakelaar naast Plate en Table."]
title = "Switch to 3D"
title_nl = "Schakel naar 3D"
text = """
The plate drawing shows width and height only. Open the Cabinet with {key:view.cabinet}, then click **3D** in the face switch next to **Plate** and **Table**.
The plate, the rails, the ducts and every device appear as solid boxes as deep as their parts.
"""
text_nl = """
De plaattekening toont alleen breedte en hoogte. Open de kast met {key:view.cabinet} en klik dan op **3D** in de weergaveschakelaar naast **Plate** en **Table**.
De plaat, de rails, de kanalen en elk component verschijnen als massieve blokken zo diep als hun artikelen.
"""
point = { ui = "cabinet.view3d" }
expect = { command = "cabinet.view3d" }
solve = [ { command = "view.cabinet" }, { command = "cabinet.view3d" } ]

[[step]]
id = "orbit"
title = "Look around"
title_nl = "Kijk rond"
text = """
Drag with the **right** mouse button, or hold **Alt** and drag with the left button. The cabinet turns around its middle and never rolls, so up stays up.
A short right click still opens the context menu.
"""
text_nl = """
Sleep met de **rechter** muisknop, of houd **Alt** ingedrukt en sleep met de linker. De kast draait om zijn midden en rolt nooit, dus boven blijft boven.
Een korte klik met rechts opent nog steeds het contextmenu.
"""
point = { ui = "cabinet.canvas" }

[[step]]
id = "zoom-pan"
title = "Zoom and pan"
title_nl = "Zoom en pan"
text = """
The wheel zooms towards the pointer. Hold **Space** and drag, or drag with the middle button, to pan the cabinet across the window.
"""
text_nl = """
Het wiel zoomt naar de aanwijzer toe. Houd **Spatie** ingedrukt en sleep, of sleep met de middelste knop, om de kast door het venster te verschuiven.
"""
point = { ui = "cabinet.canvas" }

[[step]]
id = "click-device"
how = ["Click -K1 in the 3D view.", "Double-click it to fit the camera."]
how_nl = ["Klik op -K1 in het 3D-beeld.", "Dubbelklik erop om de camera te passen."]
title = "Click a device"
title_nl = "Klik op een component"
text = """
Click the contactor **-K1**. It is selected, drawn lit, and the inspector shows the same data as on the plate: size, position and rail.
Double-click it to fit the camera to it.
"""
text_nl = """
Klik op de contactor **-K1**. Het wordt geselecteerd, lichter getekend, en de inspector toont dezelfde gegevens als op de plaat: maat, positie en rail.
Dubbelklik erop om de camera erop te richten.
"""
point = { ui = "cabinet.canvas" }
expect = { selected = "-K1" }
solve = [ { select = "-K1" } ]

[[step]]
id = "view-cube"
how = ["Click Front on the view cube."]
how_nl = ["Klik op Front op de kijkkubus."]
title = "Use the view cube"
title_nl = "Gebruik de kijkkubus"
text = """
Click **Front** on the view cube. The camera eases round to look straight at the plate, as the plate drawing shows it.
**Back**, **Left**, **Right**, **Top** and **Bottom** do the same from the other sides.
"""
text_nl = """
Klik op **Front** op de kijkkubus. De camera draait soepel om recht naar de plaat te kijken, zoals de plaattekening hem toont.
**Back**, **Left**, **Right**, **Top** en **Bottom** doen hetzelfde van de andere kanten.
"""
point = { ui = "cabinet.view3d.cube" }
expect = { clicked = "cabinet.view3d.cube" }

[[step]]
id = "iso"
how = ["Click a corner of the view cube.", "Press {key:view.fit}."]
how_nl = ["Klik op een hoek van de kijkkubus.", "Druk op {key:view.fit}."]
title = "Show it from a corner"
title_nl = "Toon het vanuit een hoek"
text = """
Click the corner of the cube for an isometric view. Press {key:view.fit} to fit the whole cabinet in the window again.
"""
text_nl = """
Klik op de hoek van de kubus voor een isometrisch beeld. Druk op {key:view.fit} om de hele kast weer in het venster te passen.
"""
point = { ui = "cabinet.view3d.cube" }
expect = { command = "view.fit" }
solve = [ { command = "view.fit" } ]

[[step]]
id = "depth"
title = "Depth you could not see"
title_nl = "Diepte die je niet kon zien"
text = """
From the side or the corner you can see which devices stand out furthest towards the door: **-K1** and **-F2** at 90 mm, then **-T1** at 85 mm.
The plate drawing cannot show that, and it is exactly what the door check in the lesson "Will the door close?" measures.
"""
text_nl = """
Van opzij of vanuit een hoek zie je welke componenten het verst naar de deur toe uitsteken: **-K1** en **-F2** met 90 mm, dan **-T1** met 85 mm.
De plaattekening kan dat niet tonen en het is precies wat de deurcontrole uit de les "Sluit de deur nog?" meet.
"""
point = { ui = "cabinet.canvas" }

[[step]]
id = "back"
how = ["Click Plate in the face switch."]
how_nl = ["Klik op Plate in de schakelaar."]
title = "Back to the plate"
title_nl = "Terug naar de plaat"
text = """
Click **Plate** in the face switch. **-K1**, which you selected in 3D, is selected on the plate too: both views share one selection.
"""
text_nl = """
Klik op **Plate** in de weergaveschakelaar. **-K1**, dat je in 3D selecteerde, is ook op de plaat geselecteerd: beide weergaven delen één selectie.
"""
point = { ui = "cabinet.plate" }
expect = { clicked = "cabinet.plate" }

[[step]]
id = "done"
title = "That is the cabinet track"
title_nl = "Dat was het kastenspoor"
text = """
From placing a first device to a laid-out, wired, drilled and labelled panel you can look at from every side. The schematic track shows how to design what goes in it.
"""
text_nl = """
Van het plaatsen van een eerste component tot een ingedeelde, bedrade, geboorde en gelabelde kast die je van alle kanten kunt bekijken. Het schemaspoor laat zien hoe je ontwerpt wat erin komt.
"""
