# Cabinet track, lesson 1. Sample project: a motor starter whose devices belong to the cabinet
# +CAB, with a 600 x 800 mm plate and nothing placed (project.json). finished.json is the same
# cabinet after Place all with the standard rules. Both come from
# `cargo run -p novo-app --example panel_lessons -- assets/lessons`.
#
# Verified against main (e2fa0013): the Cabinet header, Unplaced list, drag and drop, R and
# Delete on the selection, the problems menu, Place all with Accept, and the Table face.
# Needs from the Cabinet owner (handoff/cabinet-lessons/HANDOFF.md): the anchors and signals the
# steps name, and a `command` check that sees edit.rotate and edit.delete (the shell hands them
# to the Cabinet and drops them from the command list, so those steps use signals).
format = 1
id = "cabinet-layout"
version = 2
status = "ready"
title = "Lay out the mounting plate"
title_nl = "De montageplaat indelen"
summary = "Drag devices onto the plate, turn one, read an overlap, undo it and let Place all fill the plate by the rules."
summary_nl = "Sleep componenten op de plaat, draai er een, lees een overlap, maak die ongedaan en laat Place all de plaat volgens de regels vullen."
track = "cabinet"
order = 10
level = "beginner"
minutes = 8
topics = ["cabinet", "layout"]
show_problems = true
next = ["rails-and-ducts"]
project = "project.json"
finished = "finished.json"

[[step]]
id = "open-cabinet"
how = ["Press {key:view.cabinet}.", "Check that the window now shows the plate of +CAB."]
how_nl = ["Druk op {key:view.cabinet}.", "Controleer dat het venster nu de plaat van +CAB toont."]
title = "Open the cabinet"
title_nl = "Open de kast"
text = """
The schematic says what is connected; the Cabinet says where each device sits inside the enclosure.
Press {key:view.cabinet}. The window changes from the schematic to the inside of **+CAB**:
a large rectangle, the {tip:mounting-plate} of 600 x 800 mm, with a header of buttons above it.
"""
text_nl = """
Het schema zegt wat er verbonden is; de Cabinet-weergave zegt waar elk component in de kast zit.
Druk op {key:view.cabinet}. Het venster verandert van schema naar de binnenkant van **+CAB**:
een grote rechthoek, de {tip:mounting-plate} van 600 x 800 mm, met bovenaan een rij knoppen.
"""
point = { ui = "switcher.cabinet" }
expect = { command = "view.cabinet" }
solve = [ { command = "view.cabinet" } ]

[[step]]
id = "read-the-screen"
title = "What is where"
title_nl = "Wat staat waar"
text = """
Every device of **+CAB** that has no place yet waits in the **Unplaced** list on the left, with its size taken from its part.
The strip under the bar says "0 placed, 8 unplaced" and, once something is wrong, shows a problem count you can click.
**Place all** fills the plate for you; the other buttons come in later lessons.
"""
text_nl = """
Elk component van **+CAB** zonder plek wacht links in de lijst **Unplaced**, met de afmeting uit het artikel.
De strook onder de knoppenbalk zegt "0 placed, 8 unplaced" en toont, zodra er iets mis is, een aantal problemen waarop je kunt klikken.
**Place all** vult de plaat voor je; de andere knoppen komen in latere lessen.
"""
point = { ui = "cabinet.unplaced" }
note = [
  { ui = "cabinet.unplaced", text = "Devices without a place, with their size", text_nl = "Componenten zonder plek, met afmeting" },
  { ui = "cabinet.place_all", text = "Fills the plate by the rules; you see a preview first", text_nl = "Vult de plaat volgens de regels; eerst zie je een voorbeeld" },
  { ui = "cabinet.problems", text = "Overlaps, devices off the plate, rails too short", text_nl = "Overlappingen, componenten buiten de plaat, te korte rails" },
]

[[step]]
id = "drag-first"
how = ["Press and hold the mouse button on -F1 in the Unplaced list.", "Drag it to the upper left of the plate.", "Let go; the strip under the bar says 1 placed, 7 unplaced."]
how_nl = ["Houd de muisknop ingedrukt op -F1 in de lijst Unplaced.", "Sleep het naar linksboven op de plaat.", "Laat los; de strook onder de knoppenbalk zegt 1 placed, 7 unplaced."]
title = "Drag a device onto the plate"
title_nl = "Sleep een component op de plaat"
text = """
Drag **-F1** from the list to the upper left of the plate and let go.
While you drag, a box shows where it will land; positions snap to a 5 mm grid.
Afterwards **-F1** is a 54 x 90 mm box on the plate, gone from the list, and the strip under the bar says "1 placed, 7 unplaced".
"""
text_nl = """
Sleep **-F1** uit de lijst naar linksboven op de plaat en laat los.
Tijdens het slepen toont een kader waar het component landt; posities springen naar een raster van 5 mm.
Daarna staat **-F1** als kader van 54 x 90 mm op de plaat, is het uit de lijst verdwenen en staat in de strook onder de knoppenbalk "1 placed, 7 unplaced".
"""
point = { ui = "cabinet.unplaced" }
expect = { signal = "cabinet_dropped" }
solve = [ { cabinet_place = { device = "-F1", x = 20, y = 20 } } ]

[[step]]
id = "rotate"
how = ["Click -F1 on the plate.", "Press {key:edit.rotate}.", "The box is now 90 wide and 54 high."]
how_nl = ["Klik op -F1 op de plaat.", "Druk op {key:edit.rotate}.", "Het kader is nu 90 breed en 54 hoog."]
title = "Turn it"
title_nl = "Draai het"
text = """
Click **-F1** on the plate to select it, then press {key:edit.rotate}.
The box turns a quarter: it is now 90 wide and 54 high, and the inspector shows the new size.
Pressing the key again turns it back. Nothing happens when no device is selected.
"""
text_nl = """
Klik op **-F1** op de plaat om het te selecteren en druk op {key:edit.rotate}.
Het kader draait een kwartslag: het is nu 90 breed en 54 hoog en de inspector toont de nieuwe maat.
Nog een keer drukken draait terug. Zonder selectie gebeurt er niets.
"""
point = { ui = "cabinet.canvas" }
expect = { signal = "cabinet_rotated" }
solve = [ { cabinet_rotate = "-F1" } ]

[[step]]
id = "overlap"
how = ["Drag -K1 from the list onto the box of -F1.", "Let go; both boxes turn red."]
how_nl = ["Sleep -K1 uit de lijst op het kader van -F1.", "Laat los; beide kaders worden rood."]
title = "Make a mistake on purpose"
title_nl = "Maak met opzet een fout"
text = """
Drag **-K1** from the list so that its box lands on top of **-F1**.
KoperCAD lets you do it, and marks both boxes red: two devices cannot occupy the same place.
"""
text_nl = """
Sleep **-K1** uit de lijst zo dat het kader op **-F1** landt.
KoperCAD laat het toe en kleurt beide kaders rood: twee componenten kunnen niet op dezelfde plek zitten.
"""
point = { ui = "cabinet.canvas" }
expect = { signal = "cabinet_dropped" }
solve = [ { cabinet_place = { device = "-K1", x = 30, y = 30 } } ]

[[step]]
id = "read-problem"
title = "Read what is wrong"
title_nl = "Lees wat er mis is"
text = """
Hold the pointer over a red box: the tooltip says what is wrong in words, for example "Overlaps -F1".
The strip under the bar now shows a problem count; click it for a list of "device: problem" rows, and click a row to select that device.
"""
text_nl = """
Houd de aanwijzer boven een rood kader: de tooltip zegt in woorden wat er mis is, bijvoorbeeld "Overlaps -F1".
De kopregel eindigt nu met een aantal problemen; klik erop voor een lijst met regels "component: probleem" en klik een regel om dat component te selecteren.
"""
point = { ui = "cabinet.problems" }

[[step]]
id = "undo"
how = ["Press {key:edit.undo}.", "-K1 is back in the Unplaced list and the red is gone."]
how_nl = ["Druk op {key:edit.undo}.", "-K1 staat weer in de lijst Unplaced en het rood is weg."]
title = "Take it back"
title_nl = "Maak het ongedaan"
text = """
Press {key:edit.undo}. The drop of **-K1** is undone: it returns to the Unplaced list and the red is gone.
Every drop, move, turn, removal and Place all is one undo step.
"""
text_nl = """
Druk op {key:edit.undo}. Het neerzetten van **-K1** wordt ongedaan gemaakt: het staat weer in de lijst Unplaced en het rood is weg.
Elke drop, verplaatsing, draaiing, verwijdering en Place all is één stap om ongedaan te maken.
"""
point = { ui = "cabinet.canvas" }
expect = { command = "edit.undo" }
solve = [ { command = "edit.undo" } ]

[[step]]
id = "take-off"
how = ["Click -F1 on the plate.", "Press {key:edit.delete}.", "-F1 is back in the Unplaced list."]
how_nl = ["Klik op -F1 op de plaat.", "Druk op {key:edit.delete}.", "-F1 staat weer in de lijst Unplaced."]
title = "Take -F1 off the plate"
title_nl = "Haal -F1 van de plaat"
text = """
Click **-F1** to select it and press {key:edit.delete}.
The device leaves the plate and goes back to the Unplaced list. It is not deleted from the project: only its place is.
"""
text_nl = """
Klik op **-F1** om het te selecteren en druk op {key:edit.delete}.
Het component verlaat de plaat en staat weer in de lijst Unplaced. Het wordt niet uit het project verwijderd: alleen de plek.
"""
point = { ui = "cabinet.unplaced" }
expect = { signal = "cabinet_removed" }
solve = [ { cabinet_remove = "-F1" } ]

[[step]]
id = "place-all"
how = ["Click Place all in the Place group at the left of the bar (or press Ctrl+Shift+P).", "A preview of all eight devices appears; nothing is stored yet."]
how_nl = ["Klik op Place all in de groep Place links in de balk (of druk op Ctrl+Shift+P).", "Er verschijnt een voorbeeld van alle acht componenten; er is nog niets opgeslagen."]
title = "Let Place all do the rest"
title_nl = "Laat Place all de rest doen"
text = """
Click **Place all**. A preview appears; nothing is stored yet.
It follows the standard place rules: breakers and fuses (**F**, **Q**) in a top row, contactors and relays (**K**) on a rail of their own below,
the buttons next, then the transformer, and the terminal strip (**X**) at the bottom, each row on its own DIN rail with a wiring duct beside it.
Power devices and signal devices are kept apart by a gap. Eight devices end up on five rails.
"""
text_nl = """
Klik op **Place all**. Er verschijnt een voorbeeld; er is nog niets opgeslagen.
Het volgt de standaard plaatsingsregels: automaten en zekeringen (**F**, **Q**) in een bovenste rij, contactoren en relais (**K**) op een eigen rail daaronder,
dan de drukknoppen, daarna de transformator en de klemmenstrook (**X**) onderaan, elke rij op een eigen DIN-rail met een bedradingskanaal ernaast.
Vermogens- en signaalcomponenten worden door een tussenruimte gescheiden. Acht componenten komen op vijf rails.
"""
point = { ui = "cabinet.place_all" }
expect = { clicked = "cabinet.place_all" }
solve = [ { cabinet = "place_all" } ]

[[step]]
id = "accept"
how = ["Press Enter, or click Accept.", "The bar shows 8 placed."]
how_nl = ["Druk op Enter of klik op Accept.", "De balk toont 8 placed."]
title = "Keep it"
title_nl = "Bewaar het"
text = """
Press **Enter** or click **Accept** to keep the preview; **Esc** or **Cancel** throws it away.
The strip under the bar now says "8 placed" and "Every device of this panel is placed", and **Place all** is greyed out. Click one device: the inspector says which rule put it there.
The whole plan is one undo step.
"""
text_nl = """
Druk op **Enter** of klik op **Accept** om het voorbeeld te bewaren; **Esc** of **Cancel** gooit het weg.
De strook onder de balk zegt nu "8 placed" en "Every device of this panel is placed", en **Place all** is grijs. Klik een component aan: de inspector zegt welke regel het daar heeft gezet.
Het hele plan is één stap om ongedaan te maken.
"""
point = { ui = "cabinet.accept" }
expect = { signal = "cabinet_plan_accepted" }
solve = [ { cabinet = "accept" } ]

[[step]]
id = "table"
how = ["Press {key:view.cabinet_table}, or click Table.", "Press it again to return to the plate."]
how_nl = ["Druk op {key:view.cabinet_table} of klik op Table.", "Druk er nogmaals op om terug te keren naar de plaat."]
title = "The same data as a table"
title_nl = "Dezelfde gegevens als tabel"
text = """
Press {key:view.cabinet_table} (or click **Table**). The plate becomes a table with one row per device: its size, where it sits, its rail and its problems.
Press it again to return to the plate. A table is quicker than the drawing when you look for one device in a large panel.
"""
text_nl = """
Druk op {key:view.cabinet_table} (of klik op **Table**). De plaat wordt een tabel met één rij per component: afmeting, plek, rail en problemen.
Druk nogmaals om terug te gaan naar de plaat. In een grote kast zoek je een component sneller in de tabel dan in de tekening.
"""
point = { ui = "cabinet.table" }
expect = { command = "view.cabinet_table" }
solve = [ { command = "view.cabinet_table" } ]

[[step]]
id = "done"
title = "That is the layout"
title_nl = "Dat is de indeling"
text = """
You placed a device by hand, turned it, made an overlap and read it in words, undid it, and let Place all lay out the whole plate by the rules.
Next lesson: the five rails and five ducts Place all added, and what they are for.
"""
text_nl = """
Je zette een component met de hand neer, draaide het, maakte een overlap en las die in woorden, maakte het ongedaan en liet Place all de hele plaat volgens de regels indelen.
Volgende les: de vijf rails en vijf kanalen die Place all toevoegde en waar ze voor dienen.
"""
