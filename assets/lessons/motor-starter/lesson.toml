format = 1
id = "motor-starter"
version = 1
status = "draft"
title = "A motor starter"
title_nl = "Een motorstarter"
summary = "Draw the power circuit and the control circuit of a direct-on-line motor starter."
summary_nl = "Teken het hoofdcircuit en het stuurcircuit van een directe motorstarter."
track = "basics"
order = 40
level = "intermediate"
minutes = 12
topics = ["motor", "control circuit", "tags"]
needs = ["potentials"]
next = ["cross-references"]
project = "project.json"
finished = "finished.json"
page = "Main circuit"

[[step]]
id = "plan"
title = "The plan"
title_nl = "Het plan"
text = """
A direct-on-line starter has two circuits. Page 1, **Main circuit**, carries the power: a motor protection breaker, the main contacts of a contactor and the motor, which is already on the page under three line feeds and an earth feed.
Page 2, **Control circuit**, switches the contactor: a stop button, a start button and the contactor coil, with a contact that holds the coil on after you let go of the start button.
You will build both pages part by part, using the fast keys from the earlier lessons.
"""
text_nl = """
Een directe motorstarter heeft twee circuits. Pagina 1, **Main circuit**, voert de stroom: een motorbeveiligingsschakelaar, de hoofdcontacten van een contactor en de motor, die al op de pagina staat onder drie lijnfeeds en een aardfeed.
Pagina 2, **Control circuit**, schakelt de contactor: een stopknop, een startknop en de contactorspoel, met een contact dat de spoel aanhoudt nadat je de startknop loslaat.
Je bouwt beide pagina's onderdeel voor onderdeel, met de snelle toetsen uit de eerdere lessen.
"""
point = { at = { device = "-M1" } }
pause = true

[[step]]
id = "breaker"
title = "Place the motor breaker"
title_nl = "Plaats de motorbeveiliging"
text = """
The motor breaker protects the motor against overload and short circuit, so it is the first device under the supply.
"""
text_nl = """
De motorbeveiliging beschermt de motor tegen overbelasting en kortsluiting, dus het is het eerste apparaat onder de voeding.
"""
how = [
  "Tap {key:tool.place}, then tap **5**. The motor protection breaker hangs on your pointer.",
  "Click just under the three feeds. It is wired to them and gets the tag **-Q1**.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place} en dan op **5**. De motorbeveiliging hangt aan je aanwijzer.",
  "Klik net onder de drie feeds. Hij wordt met de feeds verbonden en krijgt de tag **-Q1**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Main circuit", x = 80, y = 40 } }
expect = { device = { symbol = "iec/protection/motor_protection_breaker" } }
solve = [ { place = { symbol = "iec/protection/motor_protection_breaker", page = "Main circuit", x = 80, y = 40 } } ]

[[step]]
id = "contactor"
title = "Place the main contacts"
title_nl = "Plaats de hoofdcontacten"
text = """
The contactor switches the motor on and off. Its three main contacts carry the motor current, one per phase.
"""
text_nl = """
De contactor schakelt de motor in en uit. Zijn drie hoofdcontacten voeren de motorstroom, één per fase.
"""
how = [
  "Tap {key:tool.place}, then tap **4**. The three main contacts hang on your pointer.",
  "Click under the breaker. The three wires between breaker and contacts, and the three wires down to the motor, are drawn for you. The device gets the tag **-K1**.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place} en dan op **4**. De drie hoofdcontacten hangen aan je aanwijzer.",
  "Klik onder de motorbeveiliging. De drie draden tussen beveiliging en contacten, en de drie draden omlaag naar de motor, worden voor je getekend. Het apparaat krijgt de tag **-K1**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Main circuit", x = 80, y = 72 } }
expect = { device = { symbol = "iec/contactors/main_3p" } }
solve = [ { place = { symbol = "iec/contactors/main_3p", page = "Main circuit", x = 80, y = 72 } } ]

[[step]]
id = "next-page"
title = "Go to the control circuit"
title_nl = "Ga naar het stuurcircuit"
text = """
The coil of the contactor is drawn on its own page, the way a real drawing separates power from control.
"""
text_nl = """
De spoel van de contactor staat op een eigen pagina, zoals een echte tekening hoofd- en stuurstroom scheidt.
"""
how = [
  "Press {key:nav.next_page} (Page Down). The page **Control circuit** opens, with an L1 feed at the top and an N feed at the bottom.",
]
how_nl = [
  "Druk op {key:nav.next_page} (Page Down). De pagina **Control circuit** opent, met een L1-feed bovenaan en een N-feed onderaan.",
]
point = { ui = "pages.list" }
expect = { page = "Control circuit" }
solve = [ { command = "nav.next_page" } ]

[[step]]
id = "fuse"
title = "Place the control breaker"
title_nl = "Plaats de stuurstroomautomaat"
text = """
The control circuit has its own small breaker, so a fault in the control wiring trips it and not the motor breaker.
"""
text_nl = """
Het stuurcircuit heeft een eigen kleine automaat, zodat een fout in de stuurbedrading hem laat vallen en niet de motorbeveiliging.
"""
how = [
  "Tap {key:tool.place}, type **mcb** and press Enter.",
  "Click just under **L1**. It is wired to L1 and gets the tag **-F1**.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **mcb** en druk op Enter.",
  "Klik net onder **L1**. Hij wordt met L1 verbonden en krijgt de tag **-F1**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control circuit", x = 80, y = 40 } }
expect = { device = { symbol = "iec/protection/mcb_1p" } }
solve = [ { place = { symbol = "iec/protection/mcb_1p", page = "Control circuit", x = 80, y = 40 } } ]

[[step]]
id = "stop"
title = "Place the stop button"
title_nl = "Plaats de stopknop"
text = """
A stop button must stop the motor even when its wire breaks, so it is **normally closed**: the circuit is closed until you press it.
"""
text_nl = """
Een stopknop moet de motor ook stoppen als zijn draad breekt, daarom is hij **verbrekend**: het circuit is gesloten totdat je hem indrukt.
"""
how = [
  "Tap {key:tool.place}, type **pbnc** and press Enter.",
  "Click just under the breaker. It is wired to the breaker and gets the tag **-S1**.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **pbnc** en druk op Enter.",
  "Klik net onder de automaat. Hij wordt met de automaat verbonden en krijgt de tag **-S1**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control circuit", x = 80, y = 72 } }
expect = { device = { symbol = "iec/operators/pushbutton_nc" } }
solve = [ { place = { symbol = "iec/operators/pushbutton_nc", page = "Control circuit", x = 80, y = 72 } } ]

[[step]]
id = "start"
title = "Place the start button"
title_nl = "Plaats de startknop"
text = """
The start button is **normally open**: it only closes the circuit while it is pressed.
"""
text_nl = """
De startknop is **sluitend**: hij sluit het circuit alleen zolang hij ingedrukt is.
"""
how = [
  "Tap {key:tool.place}, type **pb** and press Enter.",
  "Click just under the stop button. It is wired to the stop button and gets the tag **-S2**.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **pb** en druk op Enter.",
  "Klik net onder de stopknop. Hij wordt met de stopknop verbonden en krijgt de tag **-S2**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control circuit", x = 80, y = 104 } }
expect = { device = { symbol = "iec/operators/pushbutton_no" } }
solve = [ { place = { symbol = "iec/operators/pushbutton_no", page = "Control circuit", x = 80, y = 104 } } ]

[[step]]
id = "coil"
title = "Place the coil of the contactor"
title_nl = "Plaats de spoel van de contactor"
text = """
The coil belongs to the contactor you placed on page 1. Naming the device tells KoperCAD to add the coil to **-K1** instead of making a new device.
"""
text_nl = """
De spoel hoort bij de contactor die je op pagina 1 plaatste. Door het apparaat te noemen voegt KoperCAD de spoel toe aan **-K1** in plaats van een nieuw apparaat te maken.
"""
how = [
  "Tap {key:tool.place}, type **coil K1** and press Enter.",
  "Click just under the start button, above the N feed. It is wired to the start button and to N, and it is the coil of **-K1**.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **coil K1** en druk op Enter.",
  "Klik net onder de startknop, boven de N-feed. Hij wordt met de startknop en met N verbonden en is de spoel van **-K1**.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control circuit", x = 80, y = 136 } }
expect = { device = { tag = "-K1", symbol = "iec/coils/relay" } }
solve = [ { place = { symbol = "iec/coils/relay", parent = "-K1", page = "Control circuit", x = 80, y = 136 } } ]

[[step]]
id = "hold-contact"
title = "Place the holding contact"
title_nl = "Plaats het houdcontact"
text = """
Without help, the coil drops out as soon as you release the start button. A contact of the same contactor, in parallel with the start button, keeps it on. This is called a {tip:self-hold}.
"""
text_nl = """
Zonder hulp valt de spoel af zodra je de startknop loslaat. Een contact van dezelfde contactor, parallel aan de startknop, houdt hem aan. Dit heet een {tip:self-hold}.
"""
how = [
  "Tap {key:tool.place}, type **no K1** and press Enter.",
  "Click on the empty page to the right of the start button. The contact is the next contact of **-K1**, numbered 13-14.",
  "Press {key:edit.escape} to put the part down.",
]
how_nl = [
  "Tik op {key:tool.place}, typ **no K1** en druk op Enter.",
  "Klik op de lege pagina rechts van de startknop. Het contact is het volgende contact van **-K1**, genummerd 13-14.",
  "Druk op {key:edit.escape} om het onderdeel los te laten.",
]
point = { at = { page = "Control circuit", x = 96, y = 104 } }
expect = { count = { kind = "symbol", page = "Control circuit", at_least = 6 } }
solve = [ { place = { symbol = "iec/contacts/no", parent = "-K1", page = "Control circuit", x = 96, y = 104 } } ]

[[step]]
id = "hold-top"
title = "Join the contact's upper pin"
title_nl = "Verbind de bovenste pen van het contact"
text = """
The top of the holding contact must join the same wire as the top of the start button, so that both can feed the coil.
"""
text_nl = """
De bovenkant van het houdcontact moet op dezelfde draad komen als de bovenkant van de startknop, zodat beide de spoel kunnen voeden.
"""
how = [
  "Press the mouse button down on the upper pin of the holding contact (pin 13).",
  "Drag onto the wire between the stop button and the start button, and release on the wire. A junction appears where you let go.",
]
how_nl = [
  "Druk de muisknop in op de bovenste pen van het houdcontact (pen 13).",
  "Sleep naar de draad tussen de stopknop en de startknop en laat los op de draad. Waar je loslaat verschijnt een knooppunt.",
]
point = { at = { page = "Control circuit", x = 80, y = 96 } }
note = [ { at = { device = "-K1", pin = "13" }, text = "Start here" } ]
expect = { wire = { from = "-K1:13", to = "-S2:13" } }
solve = [ { tee = { from = "-K1:13", onto = "-S2:13", at = [80, 96] } } ]

[[step]]
id = "hold-bottom"
title = "Join the contact's lower pin"
title_nl = "Verbind de onderste pen van het contact"
text = """
The bottom of the contact joins the wire to the coil, so closing the contact feeds the coil in the same way the start button does.
"""
text_nl = """
De onderkant van het contact komt op de draad naar de spoel, zodat het sluiten van het contact de spoel op dezelfde manier voedt als de startknop.
"""
how = [
  "Press the mouse button down on the lower pin of the holding contact (pin 14).",
  "Drag onto the wire between the start button and the coil, and release on the wire.",
]
how_nl = [
  "Druk de muisknop in op de onderste pen van het houdcontact (pen 14).",
  "Sleep naar de draad tussen de startknop en de spoel en laat los op de draad.",
]
point = { at = { page = "Control circuit", x = 80, y = 128 } }
note = [ { at = { device = "-K1", pin = "14" }, text = "Start here" } ]
expect = { wire = { from = "-K1:14", to = "-K1:A1" } }
solve = [ { tee = { from = "-K1:14", onto = "-K1:A1", at = [80, 128] } } ]

[[step]]
id = "try"
title = "Try it"
title_nl = "Probeer het"
text = """
The starter is complete: on page 1 the supply runs through -Q1 and the main contacts of -K1 to the motor; on page 2 the stop button, the start button and the coil of -K1 sit between L1 and N, and the holding contact sits in parallel with the start button.
The live view shows it working. The live-view lesson explains how to read it.
"""
text_nl = """
De starter is compleet: op pagina 1 loopt de voeding via -Q1 en de hoofdcontacten van -K1 naar de motor; op pagina 2 staan de stopknop, de startknop en de spoel van -K1 tussen L1 en N, en het houdcontact staat parallel aan de startknop.
De live-weergave laat het werken zien. De les over de live-weergave legt uit hoe je die leest.
"""
how = [
  "Press {key:sim.live} to switch the live view on, and press it again to switch it off.",
]
how_nl = [
  "Druk op {key:sim.live} om de live-weergave aan te zetten, en nog een keer om hem uit te zetten.",
]
point = { ui = "dock.live" }
expect = { command = "sim.live" }
solve = [ { command = "sim.live" } ]
