format = 1
id = "motor-starter"
version = 1
status = "draft"
title = "A motor starter"
title_nl = "Een motorstarter"
summary = "Draw the power circuit and the control circuit of a direct-on-line motor starter."
summary_nl = "Teken het hoofdcircuit en het stuurcircuit van een directe motorstarter."
track = "basics"
order = 40
level = "intermediate"
minutes = 12
topics = ["motor", "control circuit", "tags"]
needs = ["potentials"]
next = ["cross-references"]
project = "project.json"
finished = "finished.json"
page = "Main circuit"

[[step]]
id = "plan"
title = "The plan"
title_nl = "Het plan"
text = """
A direct-on-line starter has two circuits. Page 1, **Main circuit**, carries the power: a motor protection breaker, the main contacts of a contactor and the motor, already on the page under three line feeds and an earth feed.
Page 2, **Control circuit**, switches the contactor: a stop button, a start button and the contactor coil, with a contact that holds the coil on after you let go of the start button.
You will build both pages part by part.
"""
text_nl = """
Een directe motorstarter heeft twee circuits. Pagina 1, **Main circuit**, voert de stroom: een motorbeveiligingsschakelaar, de hoofdcontacten van een contactor en de motor, al op de pagina onder drie lijnfeeds en een aardfeed.
Pagina 2, **Control circuit**, schakelt de contactor: een stopknop, een startknop en de contactorspoel, met een contact dat de spoel aanhoudt nadat je de startknop loslaat.
Je bouwt beide pagina's onderdeel voor onderdeel.
"""
point = { at = { device = "-M1" } }
pause = true

[[step]]
id = "breaker"
title = "Place the motor breaker"
title_nl = "Plaats de motorbeveiliging"
text = """
The motor breaker protects the motor against overload and short circuit, so it is the first device under the supply.
"""
text_nl = """
De motorbeveiliging beschermt de motor tegen overbelasting en kortsluiting, dus het is het eerste apparaat onder de voeding.
"""
demo = [
  { press = "tool.place" },
  { type = "mpcb" },
  { key = "Enter" },
  { ghost = { symbol = "iec/protection/motor_protection_breaker", page = "Main circuit", x = 80, y = 40 } },
  { move = { at = { page = "Main circuit", x = 80, y = 40 } } },
  { click = true },
  { say = "It is wired to the three feeds and gets the tag -Q1.", say_nl = "Hij wordt met de drie feeds verbonden en krijgt de tag -Q1." },
  { press = "edit.escape" },
]
point = { at = { page = "Main circuit", x = 80, y = 40 } }
expect = { device = { symbol = "iec/protection/motor_protection_breaker" } }
solve = [ { place = { symbol = "iec/protection/motor_protection_breaker", page = "Main circuit", x = 80, y = 40 } } ]

[[step]]
id = "contactor"
title = "Place the main contacts"
title_nl = "Plaats de hoofdcontacten"
text = """
The contactor switches the motor on and off. Its three main contacts carry the motor current, one per phase.
"""
text_nl = """
De contactor schakelt de motor in en uit. Zijn drie hoofdcontacten voeren de motorstroom, één per fase.
"""
demo = [
  { press = "tool.place" },
  { type = "main" },
  { key = "Enter" },
  { ghost = { symbol = "iec/contactors/main_3p", page = "Main circuit", x = 80, y = 72 } },
  { move = { at = { page = "Main circuit", x = 80, y = 72 } } },
  { click = true },
  { say = "The wires to the breaker and down to the motor draw themselves. The tag is -K1.", say_nl = "De draden naar de beveiliging en omlaag naar de motor tekenen zichzelf. De tag is -K1." },
  { press = "edit.escape" },
]
point = { at = { page = "Main circuit", x = 80, y = 72 } }
expect = { device = { symbol = "iec/contactors/main_3p" } }
solve = [ { place = { symbol = "iec/contactors/main_3p", page = "Main circuit", x = 80, y = 72 } } ]

[[step]]
id = "next-page"
title = "Go to the control circuit"
title_nl = "Ga naar het stuurcircuit"
text = """
The coil of the contactor is drawn on its own page, the way a real drawing separates power from control.
"""
text_nl = """
De spoel van de contactor staat op een eigen pagina, zoals een echte tekening hoofd- en stuurstroom scheidt.
"""
demo = [
  { press = "nav.next_page" },
  { say = "The Control circuit page opens.", say_nl = "De pagina Control circuit opent." },
]
expect = { page = "Control circuit" }
solve = [ { command = "nav.next_page" } ]

[[step]]
id = "fuse"
title = "Place the control breaker"
title_nl = "Plaats de stuurstroomautomaat"
text = """
The control circuit has its own small breaker, so a fault in the control wiring trips it and not the motor breaker.
"""
text_nl = """
Het stuurcircuit heeft een eigen kleine automaat, zodat een fout in de stuurbedrading hem laat vallen en niet de motorbeveiliging.
"""
demo = [
  { press = "tool.place" },
  { type = "mcb" },
  { key = "Enter" },
  { ghost = { symbol = "iec/protection/mcb_1p", page = "Control circuit", x = 80, y = 40 } },
  { move = { at = { page = "Control circuit", x = 80, y = 40 } } },
  { click = true },
  { say = "It is wired to L1 and gets the tag -F1.", say_nl = "Hij wordt met L1 verbonden en krijgt de tag -F1." },
  { press = "edit.escape" },
]
point = { at = { page = "Control circuit", x = 80, y = 40 } }
expect = { device = { symbol = "iec/protection/mcb_1p" } }
solve = [ { place = { symbol = "iec/protection/mcb_1p", page = "Control circuit", x = 80, y = 40 } } ]

[[step]]
id = "stop"
title = "Place the stop button"
title_nl = "Plaats de stopknop"
text = """
A stop button must stop the motor even when its wire breaks, so it is **normally closed**: the circuit is closed until you press it.
"""
text_nl = """
Een stopknop moet de motor ook stoppen als zijn draad breekt, daarom is hij **verbrekend**: het circuit is gesloten totdat je hem indrukt.
"""
demo = [
  { press = "tool.place" },
  { type = "pbnc" },
  { key = "Enter" },
  { ghost = { symbol = "iec/operators/pushbutton_nc", page = "Control circuit", x = 80, y = 72 } },
  { move = { at = { page = "Control circuit", x = 80, y = 72 } } },
  { click = true },
  { say = "It gets the tag -S1.", say_nl = "Hij krijgt de tag -S1." },
  { press = "edit.escape" },
]
point = { at = { page = "Control circuit", x = 80, y = 72 } }
expect = { device = { symbol = "iec/operators/pushbutton_nc" } }
solve = [ { place = { symbol = "iec/operators/pushbutton_nc", page = "Control circuit", x = 80, y = 72 } } ]

[[step]]
id = "start"
title = "Place the start button"
title_nl = "Plaats de startknop"
text = """
The start button is **normally open**: it only closes the circuit while it is pressed.
"""
text_nl = """
De startknop is **sluitend**: hij sluit het circuit alleen zolang hij ingedrukt is.
"""
demo = [
  { press = "tool.place" },
  { type = "pb" },
  { key = "Enter" },
  { ghost = { symbol = "iec/operators/pushbutton_no", page = "Control circuit", x = 80, y = 104 } },
  { move = { at = { page = "Control circuit", x = 80, y = 104 } } },
  { click = true },
  { say = "It gets the tag -S2.", say_nl = "Hij krijgt de tag -S2." },
  { press = "edit.escape" },
]
point = { at = { page = "Control circuit", x = 80, y = 104 } }
expect = { device = { symbol = "iec/operators/pushbutton_no" } }
solve = [ { place = { symbol = "iec/operators/pushbutton_no", page = "Control circuit", x = 80, y = 104 } } ]

[[step]]
id = "coil"
title = "Place the coil of the contactor"
title_nl = "Plaats de spoel van de contactor"
text = """
The coil belongs to the contactor you placed on page 1. Naming the device tells KoperCAD to add the coil to **-K1** instead of making a new device.
"""
text_nl = """
De spoel hoort bij de contactor die je op pagina 1 plaatste. Door het apparaat te noemen voegt KoperCAD de spoel toe aan **-K1** in plaats van een nieuw apparaat te maken.
"""
demo = [
  { press = "tool.place" },
  { type = "coil K1" },
  { key = "Enter" },
  { ghost = { symbol = "iec/coils/relay", page = "Control circuit", x = 80, y = 136 } },
  { move = { at = { page = "Control circuit", x = 80, y = 136 } } },
  { click = true },
  { say = "It is the coil of -K1, wired to the start button and to N.", say_nl = "Het is de spoel van -K1, verbonden met de startknop en met N." },
  { press = "edit.escape" },
]
point = { at = { page = "Control circuit", x = 80, y = 136 } }
expect = { device = { tag = "-K1", symbol = "iec/coils/relay" } }
solve = [ { place = { symbol = "iec/coils/relay", parent = "-K1", page = "Control circuit", x = 80, y = 136 } } ]

[[step]]
id = "hold-contact"
title = "Place the holding contact"
title_nl = "Plaats het houdcontact"
text = """
Without help, the coil drops out as soon as you release the start button. A contact of the same contactor, in parallel with the start button, keeps it on. This is called a {tip:self-hold}.
"""
text_nl = """
Zonder hulp valt de spoel af zodra je de startknop loslaat. Een contact van dezelfde contactor, parallel aan de startknop, houdt hem aan. Dit heet een {tip:self-hold}.
"""
demo = [
  { press = "tool.place" },
  { type = "no K1" },
  { key = "Enter" },
  { ghost = { symbol = "iec/contacts/no", page = "Control circuit", x = 96, y = 104 } },
  { move = { at = { page = "Control circuit", x = 96, y = 104 } } },
  { click = true },
  { say = "It is the next contact of -K1, numbered 13-14.", say_nl = "Het is het volgende contact van -K1, genummerd 13-14." },
  { press = "edit.escape" },
]
point = { at = { page = "Control circuit", x = 96, y = 104 } }
expect = { count = { kind = "symbol", page = "Control circuit", at_least = 7 } }
solve = [ { place = { symbol = "iec/contacts/no", parent = "-K1", page = "Control circuit", x = 96, y = 104 } } ]

[[step]]
id = "hold-top"
title = "Join the contact's upper pin"
title_nl = "Verbind de bovenste pen van het contact"
text = """
The new contact must be in parallel with the start button, so the coil stays on after you let go of the button. First you join its top.
"""
text_nl = """
Het nieuwe contact moet parallel aan de startknop staan, zodat de spoel aan blijft nadat je de knop loslaat. Eerst verbind je de bovenkant.
"""
demo = [
  { drag = { from = { at = { pin = "-K1:13" } }, to = { at = { page = "Control circuit", x = 80, y = 96 } } } },
  { say = "A dot appears where the two wires meet.", say_nl = "Er verschijnt een punt waar de twee draden samenkomen." },
]
point = { at = { page = "Control circuit", x = 80, y = 96 } }
note = [ { at = { device = "-K1", pin = "13" }, text = "Start here" } ]
expect = { wire = { from = "-K1:13", to = "-S2:13" } }
solve = [ { tee = { from = "-K1:13", onto = "-S2:13", at = [80, 96] } } ]

[[step]]
id = "hold-bottom"
title = "Join the contact's lower pin"
title_nl = "Verbind de onderste pen van het contact"
text = """
Now the other side. When the contact closes, it must feed the coil the same way the start button does.
"""
text_nl = """
Nu de andere kant. Als het contact sluit, moet het de spoel op dezelfde manier voeden als de startknop.
"""
demo = [
  { drag = { from = { at = { pin = "-K1:14" } }, to = { at = { page = "Control circuit", x = 80, y = 128 } } } },
  { say = "Another dot appears. The contact now bypasses the start button.", say_nl = "Er verschijnt nog een punt. Het contact overbrugt nu de startknop." },
]
point = { at = { page = "Control circuit", x = 80, y = 128 } }
note = [ { at = { device = "-K1", pin = "14" }, text = "Start here" } ]
expect = { wire = { from = "-K1:14", to = "-K1:A1" } }
solve = [ { tee = { from = "-K1:14", onto = "-K1:A1", at = [80, 128] } } ]

[[step]]
id = "try"
title = "Try it"
title_nl = "Probeer het"
text = """
The starter is complete: on page 1 the supply runs through -Q1 and the main contacts of -K1 to the motor; on page 2 the stop button, the start button and the coil of -K1 sit between L1 and N, and the holding contact sits in parallel with the start button.
The live view lets you try it. The next lessons show how to read it.
"""
text_nl = """
De starter is compleet: op pagina 1 loopt de voeding via -Q1 en de hoofdcontacten van -K1 naar de motor; op pagina 2 staan de stopknop, de startknop en de spoel van -K1 tussen L1 en N, en het houdcontact staat parallel aan de startknop.
Met de live-weergave kun je het proberen. De volgende lessen laten zien hoe je die leest.
"""
demo = [
  { press = "sim.live" },
  { wait = 1 },
  { press = "sim.live" },
]
expect = { command = "sim.live" }
solve = [ { command = "sim.live" } ]
